<svg xmlns="http://www.w3.org/2000/svg" class="dgm d-checkout" viewBox="0 0 1018 190" width="1018" height="190" role="img" aria-label="Checkout და გადახდა" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Checkout და გადახდა</title><style>
.d-checkout text{font-family:"Noto Sans Georgian", -apple-system, "Segoe UI", sans-serif;fill:var(--d-text,#1b1f27)}
.d-checkout .muted{fill:var(--d-muted,#5f6878)}
.d-checkout .edge{fill:none;stroke:var(--d-edge,#4b5563);stroke-width:1.6}
.d-checkout .dash{stroke-dasharray:6 5}
