.d-checkout .grp{fill:var(--d-grp,#f8fafc);stroke:var(--d-grp-s,#cbd5e1);stroke-width:1.2;stroke-dasharray:5 4}
.d-checkout .life{stroke:var(--d-grp-s,#cbd5e1);stroke-width:1.2;stroke-dasharray:4 4}
.d-checkout .band{fill:var(--d-band,#f1f5f9)}
