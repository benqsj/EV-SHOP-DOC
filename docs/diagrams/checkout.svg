.d-checkout .k-ours{fill:var(--d-ours,#e8f5f0);stroke:var(--d-ours-s,#0f7b5f);stroke-width:1.5}
.d-checkout .k-ext{fill:var(--d-ext,#eef0fe);stroke:var(--d-ext-s,#5b5fd6);stroke-width:1.5}
.d-checkout .k-data{fill:var(--d-data,#fff5e6);stroke:var(--d-data-s,#c27c12);stroke-width:1.5}
.d-checkout .k-actor{fill:var(--d-actor,#f3f4f6);stroke:var(--d-actor-s,#8a94a3);stroke-width:1.5}
.d-checkout .k-final{fill:var(--d-final,#eef7ee);stroke:var(--d-final-s,#2f8a3e);stroke-width:1.5}
.d-checkout .k-bad{fill:var(--d-bad,#fdeeee);stroke:var(--d-bad-s,#c2410c);stroke-width:1.5}
