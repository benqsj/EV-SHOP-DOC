<svg xmlns="http://www.w3.org/2000/svg" class="dgm d-arch" viewBox="0 0 920 700" width="920" height="700" role="img" aria-label="System architecture" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>System architecture</title><style>
