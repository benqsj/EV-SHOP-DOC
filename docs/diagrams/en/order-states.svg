<svg xmlns="http://www.w3.org/2000/svg" class="dgm d-states" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="Order statuses" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Order statuses</title><style>
.d-states text{font-family:"Noto Sans Georgian", -apple-system, "Segoe UI", sans-serif;fill:var(--d-text,#1b1f27)}
.d-states .muted{fill:var(--d-muted,#5f6878)}
.d-states .edge{fill:none;stroke:var(--d-edge,#4b5563);stroke-width:1.6}
.d-states .dash{stroke-dasharray:6 5}
.d-states .lbl{fill:var(--d-bg,#ffffff)}
.d-states .grp{fill:var(--d-grp,#f8fafc);stroke:var(--d-grp-s,#cbd5e1);stroke-width:1.2;stroke-dasharray:5 4}
.d-states .life{stroke:var(--d-grp-s,#cbd5e1);stroke-width:1.2;stroke-dasharray:4 4}
.d-states .band{fill:var(--d-band,#f1f5f9)}
.d-states .badge{fill:var(--d-edge,#4b5563)}
.d-states .badge-t{fill:var(--d-bg,#ffffff);font-size:10.5px;font-weight:700}
.d-states .k-ours{fill:var(--d-ours,#e8f5f0);stroke:var(--d-ours-s,#0f7b5f);stroke-width:1.5}
.d-states .k-ext{fill:var(--d-ext,#eef0fe);stroke:var(--d-ext-s,#5b5fd6);stroke-width:1.5}
.d-states .k-data{fill:var(--d-data,#fff5e6);stroke:var(--d-data-s,#c27c12);stroke-width:1.5}
.d-states .k-actor{fill:var(--d-actor,#f3f4f6);stroke:var(--d-actor-s,#8a94a3);stroke-width:1.5}
.d-states .k-final{fill:var(--d-final,#eef7ee);stroke:var(--d-final-s,#2f8a3e);stroke-width:1.5}
.d-states .k-bad{fill:var(--d-bad,#fdeeee);stroke:var(--d-bad-s,#c2410c);stroke-width:1.5}
</style><defs><marker id="d-states-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-edge,#4b5563)"/></marker></defs>
<text x="135" y="22" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central" class="muted">checkout</text>
