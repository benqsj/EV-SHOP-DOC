<svg xmlns="http://www.w3.org/2000/svg" class="dgm d-reval" viewBox="0 0 1064 132" width="1064" height="132" role="img" aria-label="Automatic Storefront refresh" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Automatic Storefront refresh</title><style>
