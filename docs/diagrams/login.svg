<svg xmlns="http://www.w3.org/2000/svg" class="dgm d-login" viewBox="0 0 852 190" width="852" height="190" role="img" aria-label="Login" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Login</title><style>
.d-login text{font-family:"Noto Sans Georgian", -apple-system, "Segoe UI", sans-serif;fill:var(--d-text,#1b1f27)}
.d-login .muted{fill:var(--d-muted,#5f6878)}
.d-login .edge{fill:none;stroke:var(--d-edge,#4b5563);stroke-width:1.6}
.d-login .dash{stroke-dasharray:6 5}
.d-login .lbl{fill:var(--d-bg,#ffffff)}
.d-login .grp{fill:var(--d-grp,#f8fafc);stroke:var(--d-grp-s,#cbd5e1);stroke-width:1.2;stroke-dasharray:5 4}
.d-login .life{stroke:var(--d-grp-s,#cbd5e1);stroke-width:1.2;stroke-dasharray:4 4}
.d-login .band{fill:var(--d-band,#f1f5f9)}
.d-login .badge{fill:var(--d-edge,#4b5563)}
.d-login .badge-t{fill:var(--d-bg,#ffffff);font-size:10.5px;font-weight:700}
.d-login .k-ours{fill:var(--d-ours,#e8f5f0);stroke:var(--d-ours-s,#0f7b5f);stroke-width:1.5}
.d-login .k-ext{fill:var(--d-ext,#eef0fe);stroke:var(--d-ext-s,#5b5fd6);stroke-width:1.5}
.d-login .k-data{fill:var(--d-data,#fff5e6);stroke:var(--d-data-s,#c27c12);stroke-width:1.5}
.d-login .k-actor{fill:var(--d-actor,#f3f4f6);stroke:var(--d-actor-s,#8a94a3);stroke-width:1.5}
.d-login .k-final{fill:var(--d-final,#eef7ee);stroke:var(--d-final-s,#2f8a3e);stroke-width:1.5}
.d-login .k-bad{fill:var(--d-bad,#fdeeee);stroke:var(--d-bad-s,#c2410c);stroke-width:1.5}
</style><defs><marker id="d-login-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-edge,#4b5563)"/></marker></defs>
<rect class="k-ext" x="20" y="20" width="240" height="150" rx="12"/>
<circle class="badge" cx="44" cy="46" r="12"/>
<text x="44" y="46" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central" class="badge-t">1</text>
<text x="64" y="46" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="central" class="">შესვლა</text>
<text x="36" y="74" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="central" class="muted">ბრაუზერი → Identity</text>
<text x="36" y="100" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="central" class="">მომხმარებელი აჭერს „შესვლას“</text>
<text x="36" y="120" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="central" class="">და Identity-ის გვერდზე</text>
<text x="36" y="140" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="central" class="">შეჰყავს მონაცემები</text>
<path class="edge" d="M264,95.0 L302,95.0" marker-end="url(#d-login-arr)"/>
<rect class="k-ours" x="306" y="20" width="240" height="150" rx="12"/>
<circle class="badge" cx="330" cy="46" r="12"/>
<text x="330" y="46" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central" class="badge-t">2</text>
<text x="350" y="46" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="central" class="">ტოკენი</text>
<text x="322" y="74" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="central" class="muted">Identity → Next.js</text>
<text x="322" y="100" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="central" class="">Next.js-ის სერვერი იღებს</text>
<text x="322" y="120" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="central" class="">ტოკენს და ინახავს.</text>
<text x="322" y="140" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="central" class="">ბრაუზერს აძლევს cookie-ს</text>
<path class="edge" d="M550,95.0 L588,95.0" marker-end="url(#d-login-arr)"/>
<rect class="k-ours" x="592" y="20" width="240" height="150" rx="12"/>
<circle class="badge" cx="616" cy="46" r="12"/>
<text x="616" y="46" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central" class="badge-t">3</text>
<text x="636" y="46" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="central" class="">მოთხოვნები</text>
<text x="608" y="74" font-size="11.5" font-weight="700" text-anchor="start" dominant-baseline="central" class="muted">ბრაუზერი → Next.js → API</text>
<text x="608" y="100" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="central" class="">ბრაუზერი აგზავნის cookie-ს,</text>
<text x="608" y="120" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="central" class="">Next.js API-ს უგზავნის ტოკენს,</text>
<text x="608" y="140" font-size="12.5" font-weight="400" text-anchor="start" dominant-baseline="central" class="">API ამოწმებს ტოკენს</text>
</svg>
