<svg xmlns="http://www.w3.org/2000/svg" class="dgm d-states" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="შეკვეთის სტატუსები" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>შეკვეთის სტატუსები</title><style>
.d-states text{font-family:"Noto Sans Georgian", -apple-system, "Segoe UI", sans-serif;fill:var(--d-text,#1b1f27)}
