<svg xmlns="http://www.w3.org/2000/svg" class="dgm d-outbox" viewBox="0 0 1192 132" width="1192" height="132" role="img" aria-label="Outbox pattern" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Outbox pattern</title><style>
.d-outbox text{font-family:"Noto Sans Georgian", -apple-system, "Segoe UI", sans-serif;fill:var(--d-text,#1b1f27)}
.d-outbox .muted{fill:var(--d-muted,#5f6878)}
.d-outbox .edge{fill:none;stroke:var(--d-edge,#4b5563);stroke-width:1.6}
.d-outbox .dash{stroke-dasharray:6 5}
.d-outbox .lbl{fill:var(--d-bg,#ffffff)}
.d-outbox .grp{fill:var(--d-grp,#f8fafc);stroke:var(--d-grp-s,#cbd5e1);stroke-width:1.2;stroke-dasharray:5 4}
.d-outbox .life{stroke:var(--d-grp-s,#cbd5e1);stroke-width:1.2;stroke-dasharray:4 4}
.d-outbox .band{fill:var(--d-band,#f1f5f9)}
.d-outbox .badge{fill:var(--d-edge,#4b5563)}
.d-outbox .badge-t{fill:var(--d-bg,#ffffff);font-size:10.5px;font-weight:700}
.d-outbox .k-ours{fill:var(--d-ours,#e8f5f0);stroke:var(--d-ours-s,#0f7b5f);stroke-width:1.5}
.d-outbox .k-ext{fill:var(--d-ext,#eef0fe);stroke:var(--d-ext-s,#5b5fd6);stroke-width:1.5}
.d-outbox .k-data{fill:var(--d-data,#fff5e6);stroke:var(--d-data-s,#c27c12);stroke-width:1.5}
.d-outbox .k-actor{fill:var(--d-actor,#f3f4f6);stroke:var(--d-actor-s,#8a94a3);stroke-width:1.5}
.d-outbox .k-final{fill:var(--d-final,#eef7ee);stroke:var(--d-final-s,#2f8a3e);stroke-width:1.5}
.d-outbox .k-bad{fill:var(--d-bad,#fdeeee);stroke:var(--d-bad-s,#c2410c);stroke-width:1.5}
</style><defs><marker id="d-outbox-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-edge,#4b5563)"/></marker></defs>
<rect class="k-ours" x="20" y="40" width="168" height="62" rx="10"/>
<text x="104.0" y="62.0" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="central" class="">Shop API / Worker</text>
<text x="104.0" y="81.0" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="central" class="muted">ბიზნეს-ოპერაცია</text>
<path class="edge" d="M190,71.0 L264,71.0" marker-end="url(#d-outbox-arr)"/>
<text x="227.0" y="22" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="central" class="muted">① ერთი ტრანზაქცია</text>
<path class="k-data" d="M266,47 a84.0,7 0 0,1 168,0 v48 a84.0,7 0 0,1 -168,0 z"/>
<path class="k-data" style="fill:none" d="M266,47 a84.0,7 0 0,0 168,0"/>
<text x="350.0" y="66.0" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="central" class="">PostgreSQL</text>
<text x="350.0" y="85.0" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="central" class="muted">ცვლილება + outbox_events</text>
<path class="edge" d="M436,71.0 L510,71.0" marker-end="url(#d-outbox-arr)"/>
<text x="473.0" y="15" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="central" class="muted">② კითხულობს</text>
<text x="473.0" y="29" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="central" class="muted">გაუგზავნელს</text>
<rect class="k-ours" x="512" y="40" width="168" height="62" rx="10"/>
<text x="596.0" y="62.0" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="central" class="">Outbox Relay</text>
<text x="596.0" y="81.0" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="central" class="muted">Worker, ყოველ ~1 წამში</text>
<path class="edge" d="M682,71.0 L756,71.0" marker-end="url(#d-outbox-arr)"/>
<text x="719.0" y="15" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="central" class="muted">③ publish</text>
<text x="719.0" y="29" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="central" class="muted">(Nats-Msg-Id)</text>
<path class="k-data" d="M758,47 a84.0,7 0 0,1 168,0 v48 a84.0,7 0 0,1 -168,0 z"/>
<path class="k-data" style="fill:none" d="M758,47 a84.0,7 0 0,0 168,0"/>
<text x="842.0" y="66.0" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="central" class="">NATS JetStream</text>
<text x="842.0" y="85.0" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="central" class="muted">shop.* ივენთები</text>
<path class="edge" d="M928,71.0 L1002,71.0" marker-end="url(#d-outbox-arr)"/>
<text x="965.0" y="22" font-size="11.5" font-weight="600" text-anchor="middle" dominant-baseline="central" class="muted">④ მიწოდება</text>
<rect class="k-ext" x="1004" y="40" width="168" height="62" rx="10"/>
<text x="1088.0" y="62.0" font-size="13.5" font-weight="600" text-anchor="middle" dominant-baseline="central" class="">Consumers</text>
<text x="1088.0" y="81.0" font-size="11.5" font-weight="400" text-anchor="middle" dominant-baseline="central" class="muted">Fiscal, SSE, შეტყობინებები</text>
</svg>
