<svg xmlns="http://www.w3.org/2000/svg" class="dgm d-refund" viewBox="0 0 822 166" width="822" height="166" role="img" aria-label="გაუქმება და Refund" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>გაუქმება და Refund</title><style>
.d-refund text{font-family:"Noto Sans Georgian", -apple-system, "Segoe UI", sans-serif;fill:var(--d-text,#1b1f27)}
.d-refund .muted{fill:var(--d-muted,#5f6878)}
.d-refund .edge{fill:none;stroke:var(--d-edge,#4b5563);stroke-width:1.6}
.d-refund .dash{stroke-dasharray:6 5}
.d-refund .lbl{fill:var(--d-bg,#ffffff)}
.d-refund .grp{fill:var(--d-grp,#f8fafc);stroke:var(--d-grp-s,#cbd5e1);stroke-width:1.2;stroke-dasharray:5 4}
.d-refund .life{stroke:var(--d-grp-s,#cbd5e1);stroke-width:1.2;stroke-dasharray:4 4}
.d-refund .band{fill:var(--d-band,#f1f5f9)}
.d-refund .badge{fill:var(--d-edge,#4b5563)}
.d-refund .badge-t{fill:var(--d-bg,#ffffff);font-size:10.5px;font-weight:700}
.d-refund .k-ours{fill:var(--d-ours,#e8f5f0);stroke:var(--d-ours-s,#0f7b5f);stroke-width:1.5}
.d-refund .k-ext{fill:var(--d-ext,#eef0fe);stroke:var(--d-ext-s,#5b5fd6);stroke-width:1.5}
.d-refund .k-data{fill:var(--d-data,#fff5e6);stroke:var(--d-data-s,#c27c12);stroke-width:1.5}
.d-refund .k-actor{fill:var(--d-actor,#f3f4f6);stroke:var(--d-actor-s,#8a94a3);stroke-width:1.5}
.d-refund .k-final{fill:var(--d-final,#eef7ee);stroke:var(--d-final-s,#2f8a3e);stroke-width:1.5}
.d-refund .k-bad{fill:var(--d-bad,#fdeeee);stroke:var(--d-bad-s,#c2410c);stroke-width:1.5}
</style><defs><marker id="d-refund-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--d-edge,#4b5563)"/></marker></defs>
