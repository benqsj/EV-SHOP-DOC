<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>icomers — დოკუმენტაცია</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>:root {
  --bg: #f7f8fa; --surface: #ffffff; --surface-2: #f1f3f6; --border: #e3e6eb;
  --text: #1b1f27; --muted: #5f6878; --accent: #0f7b5f; --accent-2: #e6f4ef;
  --warn: #b25e09; --warn-bg: #fff4e5; --ok: #1a7f37; --ok-bg: #e7f6ec;
  --code-bg: #f3f4f6; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --sidebar-w: 290px; --topbar-h: 58px;
  --font: "Noto Sans Georgian", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216; --surface: #161a20; --surface-2: #1d222a; --border: #2a313b;
    --text: #e6e9ee; --muted: #9aa4b2; --accent: #3ccf9f; --accent-2: #12302a;
    --warn: #f0a24b; --warn-bg: #33240f; --ok: #56d37a; --ok-bg: #12301d;
    --code-bg: #1d222a; --shadow: none;
  }
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--topbar-h) + 16px); }
body { margin: 0; font-family: var(--font); font-size: 15.5px; line-height: 1.7; color: var(--text); background: var(--bg); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* topbar */
.topbar { position: fixed; inset: 0 0 auto 0; height: var(--topbar-h); z-index: 30; display: flex; align-items: center; gap: 14px;
  padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
.brand { font-weight: 700; font-size: 17px; color: var(--text); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.brand:hover { text-decoration: none; }
.brand-mark { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 15px; }
.brand-sub { font-weight: 400; color: var(--muted); font-size: 14px; }
.status-pill { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); font-weight: 600; white-space: nowrap; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 18px; }
.progress { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; white-space: nowrap; }
.progress-bar { width: 110px; height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.progress-bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; }
.lang-switch { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.lang-switch button { font: inherit; font-size: 12.5px; font-weight: 700; padding: 4px 10px; border: 0; background: var(--surface); color: var(--muted); cursor: pointer; }
.lang-switch button.active { background: var(--accent); color: #fff; }
.me { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.me input { width: 190px; }
.menu-btn { display: none; border: 0; background: none; font-size: 22px; color: var(--text); cursor: pointer; }

input, textarea { font: inherit; font-size: 14px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; }
input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }

/* layout */
.layout { padding-top: var(--topbar-h); }
.sidebar { position: fixed; top: var(--topbar-h); bottom: 0; left: 0; width: var(--sidebar-w); overflow-y: auto; padding: 16px 12px 24px;
  background: var(--surface); border-right: 1px solid var(--border); z-index: 20; }
.content { margin-left: var(--sidebar-w); padding: 36px 56px 120px; max-width: calc(var(--sidebar-w) + 1000px); }
.nav-filter { width: 100%; margin-bottom: 12px; }
.nav-group { margin: 14px 0 4px; padding: 0 10px; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.nav-doc > a { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 7px; color: var(--text); font-weight: 500; font-size: 14.5px; }
.nav-doc > a:hover { background: var(--surface-2); text-decoration: none; }
.nav-doc.active > a { background: var(--accent-2); color: var(--accent); }
.nav-sub { list-style: none; margin: 2px 0 6px 12px; padding: 0 0 0 10px; border-left: 1px solid var(--border); display: none; }
.nav-doc.active .nav-sub, .sidebar.filtering .nav-sub { display: block; }
.nav-sub a { display: block; padding: 3px 8px; font-size: 13.5px; color: var(--muted); border-radius: 6px; line-height: 1.45; }
.nav-sub a:hover { color: var(--text); text-decoration: none; background: var(--surface-2); }
.nav-sub a.active { color: var(--accent); font-weight: 600; }
.nav-count { font-size: 11px; min-width: 20px; text-align: center; padding: 0 6px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); font-weight: 700; }
.nav-count.done { background: var(--ok-bg); color: var(--ok); }
.hidden { display: none !important; }
.link-btn { font: inherit; font-size: 13px; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.link-btn:hover { text-decoration: underline; }
.foot-note { font-size: 12px; color: var(--muted); line-height: 1.45; }
.doc details { margin: 14px 0; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 0 14px; max-width: 900px; }
.doc details[open] { padding-bottom: 8px; }
.doc summary { cursor: pointer; padding: 10px 0; font-weight: 600; font-size: 14px; color: var(--muted); }
.doc summary:hover { color: var(--text); }
.mode-banner { margin-top: 12px; font-size: 13.5px; color: var(--warn); background: var(--warn-bg); border-radius: 8px; padding: 8px 12px; max-width: 860px; }
.sidebar-foot { margin-top: 22px; padding: 12px 10px 0; border-top: 1px solid var(--border); display: grid; gap: 6px; font-size: 13px; }

/* content */
.intro { padding-bottom: 8px; }
.intro h1 { font-size: 30px; line-height: 1.25; margin: 0 0 10px; }
.intro p { color: var(--muted); max-width: 760px; }
.howto { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; font-size: 14.5px; max-width: 860px; }
.doc { padding-top: 34px; margin-top: 34px; border-top: 1px solid var(--border); }
.doc-group { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.doc h1 { font-size: 27px; margin: 2px 0 16px; line-height: 1.3; }
.doc h2 { font-size: 21px; margin: 38px 0 12px; line-height: 1.35; }
.doc h3 { font-size: 17px; margin: 28px 0 8px; }
.doc h4 { font-size: 15.5px; margin: 20px 0 6px; }
.doc h1 a.anchor, .doc h2 a.anchor, .doc h3 a.anchor { opacity: 0; margin-left: 6px; font-weight: 400; }
.doc h1:hover a.anchor, .doc h2:hover a.anchor, .doc h3:hover a.anchor { opacity: .6; }
.doc p, .doc li { max-width: 860px; }
.doc code { font-family: var(--mono); font-size: .86em; background: var(--code-bg); padding: 1px 5px; border-radius: 5px; }
.doc pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; overflow-x: auto; line-height: 1.5; }
.doc pre code { background: none; padding: 0; font-size: 13px; overflow-wrap: normal; }
.doc p code, .doc li code, .q-text code { overflow-wrap: anywhere; }
.doc blockquote { margin: 16px 0; padding: 10px 16px; border-left: 3px solid var(--accent); background: var(--surface); border-radius: 0 10px 10px 0; color: var(--text); }
.doc blockquote p { margin: 4px 0; }
.table-wrap { overflow-x: auto; margin: 14px 0; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.doc table { border-collapse: collapse; width: 100%; font-size: 14px; }
.doc th, .doc td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
.doc th { background: var(--surface-2); font-weight: 600; white-space: nowrap; }
.doc tr:last-child td { border-bottom: 0; }
figure.diagram { margin: 18px 0 22px; padding: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow-x: auto; }
figure.diagram svg { display: block; width: 100%; height: auto; min-width: 640px; max-width: 100%; margin: 0 auto; }
figure.diagram figcaption { margin-top: 10px; text-align: center; font-size: 13px; color: var(--muted); }
:root { --d-bg: var(--surface); --d-text: var(--text); --d-muted: var(--muted); --d-edge: #4b5563; --d-grp: #f8fafc; --d-grp-s: #cbd5e1; --d-band: #f1f5f9; }
@media (prefers-color-scheme: dark) {
  :root { --d-edge: #9aa4b2; --d-grp: #12161b; --d-grp-s: #364150; --d-band: #1b2128;
    --d-ours: #10302a; --d-ours-s: #3ccf9f; --d-ext: #1d1f3d; --d-ext-s: #8b8ff0; --d-data: #33260f; --d-data-s: #e0a64b;
    --d-actor: #20252c; --d-actor-s: #6b7685; --d-final: #12301d; --d-final-s: #56d37a; --d-bad: #3a1a12; --d-bad-s: #f08a5d; }
}

/* question cards */
.q { margin: 18px 0; border: 1px solid var(--border); border-left: 4px solid var(--warn); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); max-width: 900px; }
.q.answered { border-left-color: var(--ok); }
.q-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 16px 0; font-size: 12.5px; color: var(--muted); }
.q-chip { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 9px; border-radius: 999px; }
.q-chip.open { background: var(--warn-bg); color: var(--warn); }
.q-chip.done { background: var(--ok-bg); color: var(--ok); }
.q-id { font-family: var(--mono); font-size: 12px; }
.q-to { margin-left: auto; }
.q-text { padding: 4px 16px 4px; font-weight: 500; }
.q-text p { margin: 6px 0; }
.q-answers { padding: 0 16px; }
.q-answer { border-top: 1px dashed var(--border); padding: 10px 0; }
.q-answer-meta { font-size: 12.5px; color: var(--muted); }
.q-answer-meta b { color: var(--text); }
.q-answer-text { white-space: pre-wrap; margin-top: 2px; }
.q-form { display: grid; gap: 8px; padding: 12px 16px 14px; border-top: 1px solid var(--border); background: var(--surface-2); border-radius: 0 0 12px 12px; }
.q-form textarea { width: 100%; min-height: 64px; resize: vertical; }
.q-form-row { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.q-form-hint { font-size: 12.5px; color: var(--muted); }
button.primary { font: inherit; font-size: 14px; font-weight: 600; border: 0; border-radius: 8px; padding: 7px 16px; background: var(--accent); color: #fff; cursor: pointer; }
button.primary:disabled { opacity: .55; cursor: default; }

/* additions (+ დამატება) */
:root { --add: #7c3aed; --add-bg: #f5f0ff; --add-border: #ddd0fb; }
@media (prefers-color-scheme: dark) { :root { --add: #b794f6; --add-bg: #221a33; --add-border: #3e2f5c; } }
.add-block { margin: 10px 0 6px; max-width: 900px; }
.add-btn { font: inherit; font-size: 13px; font-weight: 600; color: var(--add); background: none; border: 1px dashed var(--add-border); border-radius: 8px; padding: 4px 12px; cursor: pointer; opacity: .75; }
.add-btn:hover { opacity: 1; background: var(--add-bg); }
.addition { margin: 10px 0; padding: 10px 14px; background: var(--add-bg); border: 1px solid var(--add-border); border-left: 4px solid var(--add); border-radius: 10px; }
.addition-meta { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.addition-meta b { color: var(--text); }
.addition-tag { font-size: 11px; font-weight: 700; color: #fff; background: var(--add); padding: 1px 8px; border-radius: 999px; }
.addition-text { white-space: pre-wrap; margin-top: 4px; }
.add-form { display: grid; gap: 8px; margin-top: 8px; padding: 12px 14px; background: var(--add-bg); border: 1px solid var(--add-border); border-radius: 10px; }
.add-form-title { font-size: 13px; color: var(--muted); }
.add-form textarea { width: 100%; min-height: 80px; resize: vertical; }
.add-form .primary { background: var(--add); }
button.ghost { font: inherit; font-size: 14px; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; padding: 6px 14px; cursor: pointer; }
.nav-badges { display: flex; gap: 4px; }
.nav-adds { font-size: 11px; padding: 0 6px; border-radius: 999px; background: var(--add-bg); color: var(--add); font-weight: 700; }

.edit-btn { font: inherit; font-size: 12px; color: var(--muted); background: none; border: 0; padding: 0 0 0 6px; cursor: pointer; text-decoration: underline dotted; }
.edit-btn:hover { color: var(--text); }
.edited { font-style: italic; }
.edit-form { display: grid; gap: 8px; margin-top: 6px; }
.edit-form textarea { width: 100%; min-height: 70px; resize: vertical; }
.edit-actions { display: flex; justify-content: flex-end; gap: 6px; }
.addition .edit-form .primary { background: var(--add); }

.del-btn:hover { color: #c2410c; }
.del-confirm { display: inline-flex; gap: 6px; align-items: center; margin-left: 8px; font-weight: 600; color: var(--text); }
.del-confirm button { font: inherit; font-size: 12px; border-radius: 6px; padding: 2px 10px; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
.del-confirm .del-yes { background: #c2410c; border-color: #c2410c; color: #fff; }

/* question index */
.q-index-tools { display: flex; gap: 14px; align-items: center; font-size: 14px; margin: 8px 0; }
.q-index td:first-child { white-space: nowrap; }

.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
  background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 14px; transition: .25s; z-index: 50; }
.toast.show { opacity: 1; transform: translateX(-50%); }
.loading { color: var(--muted); }

@media (max-width: 1100px) { .brand-sub, .me span { display: none; } .content { padding: 28px 32px 100px; } }
@media (max-width: 520px) { .progress { display: none; } }
@media (max-width: 820px) {
  .menu-btn { display: block; }
  .status-pill, .progress-bar { display: none; }
  .sidebar { transform: translateX(-100%); transition: transform .2s; width: min(86vw, 320px); box-shadow: var(--shadow); }
  .sidebar.open { transform: none; }
  .content { margin-left: 0; padding: 20px 16px 90px; }
  .topbar { padding: 0 12px; gap: 10px; }
  .me input { width: 120px; }
  .topbar-right { gap: 10px; }
  .brand-mark + * { }
  .intro h1 { font-size: 24px; }
  .q-to { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="მენიუ">☰</button>
    <a class="brand" href="#top"><span class="brand-mark">⚡</span> icomers <span class="brand-sub" data-i18n="brandSub">ტექნიკური დოკუმენტაცია</span></a>
    <span class="status-pill" data-i18n="status">დასამტკიცებელი</span>
    <div class="topbar-right">
      <div class="lang-switch" role="group" aria-label="Language"><button type="button" data-lang="ka">KA</button><button type="button" data-lang="en">EN</button></div>
      <a class="progress" href="#12-roadmap" id="progress">
        <span class="progress-bar"><span id="progressFill"></span></span>
        <span id="progressText">…</span>
      </a>
      <label class="me">
        <span data-i18n="yourName">თქვენი სახელი</span>
        <input id="authorInput" placeholder="მაგ. გიორგი (Billing)" maxlength="80">
      </label>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="სარჩევი">
      <input class="nav-filter" id="navFilter" type="search" placeholder="ძებნა სარჩევში…">
      <div id="nav"></div>
      <div class="sidebar-foot">
        <button type="button" class="link-btn" id="downloadBtn" data-i18n="download">⬇ პასუხების და დამატებების ჩამოტვირთვა</button>
        <span class="foot-note" id="modeNote"></span>
      </div>
    </nav>
    <main class="content" id="top">
      <section class="intro">
        <h1 data-i18n="introTitle">icomers — ონლაინ მაღაზია</h1>
        <p data-i18n="introText">კომპანიის საკუთარი პროდუქციის (EV დამტენების ნაწილები და აქსესუარები) ონლაინ მაღაზიის არქიტექტურა და ტექნიკური დოკუმენტაცია: backend, frontend, admin panel, API, ინტეგრაციები და deploy.</p>
      </section>
      <div id="docs"><p class="loading">იტვირთება…</p></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>window.ICOMERS_DOCS = {"docs":{"ka":{"00-overview":"# 00 — Overview\n\n## 1. მიზანი\n\nონლაინ მაღაზია, სადაც კომპანია ყიდის **მხოლოდ საკუთარ პროდუქციას**: ელექტრომობილის დამტენების სათადარიგო ნაწილებს, კაბელებს, კონექტორებს, აქსესუარებს და ა.შ.\n\nმაღაზიის მთავარი ფუნქცია **თავსებადობის ფილტრია**. მომხმარებელი ირჩევს თავის დამტენს (ბრენდი → მოდელი) და ხედავს მხოლოდ იმ ნაწილებს, რომლებიც ამ მოდელს ერგება. ამისთვის მას კონექტორის ტიპის ან ტექნიკური მახასიათებლების ცოდნა არ სჭირდება.\n\n## 2. Scope\n\nპროექტის ფარგლები: რა შედის პირველ ვერსიაში (MVP) და რა დაემატება მოგვიანებით.\n\n### პირველ ვერსიაში (MVP) შედის\n- პროდუქტების კატალოგი კატეგორიებით, ძებნით და ფილტრებით\n- თავსებადობის ფილტრი (დამტენის ბრენდი → მოდელი)\n- ორი ენა: ქართული (ნაგულისხმევი) და ინგლისური\n- ვალუტა: მხოლოდ **GEL**\n- რეგისტრაცია / ავტორიზაცია არსებული **Identity** სერვისით (OAuth2 / OIDC)\n- კალათა, checkout, ონლაინ გადახდა **TBC / BOG** ბარათით (**Billing** სერვისი)\n- ფისკალური ჩეკი RS.ge-ზე (**Fiscal** სერვისი)\n- მომხმარებლის კაბინეტი: შეკვეთები, მისამართები, პროფილი\n- Admin panel: პროდუქტები, კატეგორიები, თავსებადობა, მარაგი, შეკვეთები, მომხმარებლები, live dashboard\n- მიღება: **ოფისიდან გატანა** და/ან **მიწოდება, რომელსაც ადმინი ხელით მართავს** (კურიერულ სერვისთან ინტეგრაციის გარეშე)\n\n:::question id=\"biz-fulfillment\" to=\"ბიზნესი\"\nმიღების რომელი მეთოდები გვინდა MVP-ში: მხოლოდ **ოფისიდან გატანა**, თუ **ხელით მართული მიწოდებაც**? თუ მიწოდებაც, რა ღირს (ფიქსირებული / ქალაქის მიხედვით / უფასო X ₾-დან)? გატანის მისამართი და სამუშაო საათები?\n:::\n\n\n### პირველ ვერსიაში არ შედის (მოგვიანებით)\n- B2B / კომპანიები (სპეციალური ფასები, ინვოისით გადახდა). **სქემა ისეა აგებული, რომ მოგვიანებით დაემატოს**\n- კურიერულ კომპანიებთან ინტეგრაცია\n- მობილური აპი და push შეტყობინებები\n- რამდენიმე საწყობი\n- ERP / ბუღალტრულ პროგრამასთან სინქრონიზაცია\n- პრომო-კოდები, ფასდაკლების წესები, ლოიალობა\n- შეფასებები და კომენტარები\n\n## 3. მომხმარებლები და როლები\n\n| როლი | ვინ არის | სად მუშაობს |\n|---|---|---|\n| Guest | არაავტორიზებული ვიზიტორი | Storefront: ათვალიერებს, ამატებს პროდუქტს კალათაში |\n| Customer (Individual) | რეგისტრირებული ფიზიკური პირი | Storefront: ყიდულობს, ხედავს შეკვეთებს |\n| Customer (Business) | კომპანია — **მოგვიანებით** | — |\n| Admin | სრული წვდომა | Admin panel |\n| Manager | შეკვეთების მართვა | Admin panel |\n| Content Editor | კატალოგი და თავსებადობა | Admin panel |\n| Warehouse | მარაგი და შეკვეთების მომზადება | Admin panel |\n\nდეტალური უფლებები: [08-admin-panel.md](08-admin-panel.md#3-როლები-და-უფლებები).\n\n## 4. ძირითადი სცენარები\n\n1. მომხმარებელი ირჩევს „ჩემი დამტენი: ბრენდი X, მოდელი Y“ და ხედავს მხოლოდ თავსებად ნაწილებს.\n2. მომხმარებელი ეძებს ნაწილს სახელით, SKU-ით ან ქარხნული (OEM) ნომრით.\n3. მომხმარებელი ამატებს ნაწილს კალათაში, გადის checkout-ს, იხდის TBC/BOG-ით და იღებს დადასტურებას.\n4. გადახდის შემდეგ ავტომატურად გამოიწერება ფისკალური ჩეკი.\n5. ადმინი live რეჟიმში ხედავს ახალ შეკვეთას, ამზადებს და ცვლის სტატუსს.\n6. ადმინი ამატებს პროდუქტს, ტვირთავს ფოტოებს და უთითებს, რომელ მოდელებს ერგება.\n7. ადმინი აფორმებს მარაგის მიღებას (stock receipt) ან მის კორექტირებას (adjustment). ყველა ცვლილება ინახება ისტორიაში.\n8. ადმინი აუქმებს გადახდილ შეკვეთას: refund ხდება Billing-ით, დაბრუნების ჩეკი კი Fiscal-ით.\n\n## 5. არაფუნქციური მოთხოვნები\n\n| თემა | მოთხოვნა |\n|---|---|\n| ენები | ka (default), en. URL: `/ka/...`, `/en/...` |\n| ვალუტა | GEL. ფასები ინახება **თეთრებში (integer)** |\n| დღგ | ფასები მოიცავს დღგ-ს (18%), იხ. კითხვა ქვემოთ |\n| Mobile | Mobile-first დიზაინი |\n| სიჩქარე | პროდუქტის გვერდი: LCP < 2.5s; API p95 < 300ms (კატალოგი) |\n| SEO | SSR/ISR, sitemap, hreflang, Product JSON-LD |\n| საიმედოობა | გადახდილი შეკვეთა და ჩეკი არ უნდა დაიკარგოს, თუნდაც რომელიმე სერვისი დროებით გაითიშოს |\n| მარაგი | ბოლო ერთეული ორ სხვადასხვა მყიდველს არ უნდა მიეყიდოს |\n| აუდიტი | Admin-ის ყველა ცვლილება იწერება audit log-ში |\n\n:::question id=\"biz-vat\" to=\"ბუღალტერია\"\nპროდუქტის ფასები **დღგ-ის (18%) ჩათვლით** ინახება და ჩანს საიტზე? არის თუ არა დღგ-ისგან გათავისუფლებული პროდუქტი?\n:::\n\n:::question id=\"biz-guest-checkout\" to=\"ბიზნესი\"\nშეიძლება თუ არა ყიდვა **რეგისტრაციის გარეშე** (guest checkout)? შემოთავაზება: MVP-ში checkout მოითხოვს login-ს, კალათაში დამატება კი რეგისტრაციის გარეშეც შეიძლება.\n:::\n\n## 6. ტერმინები\n\n| ტერმინი | მნიშვნელობა |\n|---|---|\n| SKU | პროდუქტის უნიკალური შიდა კოდი |\n| OEM ნომერი | მწარმოებლის ქარხნული ნაწილის ნომერი |\n| Charger model | დამტენის მოდელი, რომელსაც ნაწილი შეიძლება ერგებოდეს |\n| Compatibility | კავშირი „ნაწილი ↔ დამტენის მოდელი“ |\n| Reservation | მარაგის დროებითი დაკავება checkout-ისას, სანამ გადახდა დასრულდება |\n| Outbox | ბაზის ცხრილი, საიდანაც ივენთები საიმედოდ იგზავნება NATS-ში |\n| BFF | Backend-for-Frontend. Next.js-ის სერვერული ნაწილი, რომელიც ტოკენებს ინახავს |\n| SSE | Server-Sent Events, სერვერიდან ბრაუზერისკენ ცალმხრივი live ნაკადი |\n| Minor units / თეთრი | 1 GEL = 100 თეთრი; ყველა თანხა ინახება მთელ რიცხვად |\n","01-tech-stack":"# 01 — Tech Stack\n\n> ყველა გადაწყვეტილება ამ დოკუმენტის დამტკიცებამდე **შემოთავაზებულია**.\n\n## 1. ტექნოლოგიები\n\n| ფენა | ტექნოლოგია | რატომ |\n|---|---|---|\n| ენა | **TypeScript** (Node.js 24 LTS) | ერთი ენა ფრონტსა და ბექზე, საერთო ტიპები |\n| Storefront | **Next.js** (App Router), Tailwind CSS, next-intl | SEO: გვერდები სერვერზე რენდერდება; ISR: კატალოგი cache-დან იხსნება და პროდუქტის შეცვლისას ახლდება; ka / en |\n| Admin Panel | **Next.js**, shadcn/ui, TanStack Query + Table | იგივე ტექნოლოგია, რაც storefront-ში; მზა ცხრილები, ფორმები და cache |\n| Backend | **NestJS** | gRPC client ჩაშენებულია; მოდულები და DI მკაფიო სტრუქტურას იძლევა; `@nestjs/swagger`-ით OpenAPI ავტომატურად გენერირდება |\n| Worker | იგივე NestJS კოდი, ცალკე პროცესი | ფონური სამუშაო (ივენთები, ჩეკები, cron) HTTP API-ს არ ანელებს |\n| API | **REST + OpenAPI**, ველები `snake_case` | ნაცნობი მიდგომაა; Swagger UI ტესტირებისთვის; კომპანიის სხვა API-ების კონვენცია |\n| API client | **openapi-typescript + openapi-fetch** | ფრონტის ტიპები backend-ის კოდიდან გენერირდება, ხელით არ იწერება (იხ. [REST API](05-api.md#5-ფრონტის-api-client)) |\n| Database | **PostgreSQL 16+** | ტრანზაქციები (შეკვეთა + მარაგი ერთად); JSONB მახასიათებლებისთვის; full-text search და `pg_trgm` |\n| ORM | **Prisma** | ტიპიზებული client, მიგრაციები, Prisma Studio; საჭიროებისას raw SQL |\n| gRPC | `@grpc/grpc-js` + Buf + ts-proto | `.proto` კონტრაქტიდან TypeScript client-ები |\n| Messaging | **NATS JetStream** (nats.js) | კომპანიის სერვისები უკვე იყენებს (Billing); ივენთები ინახება და არ იკარგება; dedupe და retry |\n| Real-time | **SSE** | გვჭირდება მხოლოდ სერვერი → ბრაუზერი მიმართულება; მუშაობს ჩვეულებრივ HTTP-ზე |\n| ფაილები | S3 (usectl-ის S3 addon) | პროდუქტის სურათები, ატვირთვა პირდაპირ ადმინიდან (presigned URL) |\n| რეპოები | 3 ცალკე რეპო (api, storefront, admin), pnpm | კომპანიის სტილი; დამოუკიდებელი deploy; ტიპები OpenAPI-დან გენერირდება ([Repo & Dev](09-repo-and-dev.md#1-რეპოზიტორიები)) |\n| ტესტები | Vitest / Jest, Testcontainers, Playwright | რეალური Postgres და NATS ტესტებში; E2E ბრაუზერში |\n| Deploy | **usectl** (Kubernetes) | push-to-deploy, Postgres / NATS / S3 addon-ები, domain-ები, ლოგები და alert-ები ერთ ადგილას |\n\n**Redis პირველ ვერსიაში არ გვჭირდება.** კალათა Postgres-ში ინახება, queue-ს როლს NATS ასრულებს, cache-ს კი Next.js. საჭიროებისას მოგვიანებით დაემატება.\n\n## 2. ძირითადი გადაწყვეტილებები\n\n| # | გადაწყვეტილება | მიზეზი |\n|---|---|---|\n| D1 | Shop backend არის **modular monolith**: ერთი NestJS აპი, შიგნით მოდულებად დაყოფილი | მაღაზიის დომენი ერთიანია; შეკვეთა და მარაგი ერთ ტრანზაქციაში; მარტივი deploy. მოდული საჭიროებისას ცალკე სერვისად შეიძლება გამოიყოს ([არქიტექტურა](02-architecture.md#3-nestjs-მოდულები-modular-monolith)) |\n| D2 | ფრონტი მხოლოდ REST-სა და SSE-ს იყენებს; gRPC და NATS მხოლოდ backend-შია | ფრონტი შიდა სისტემებზე არ არის დამოკიდებული |\n| D3 | ავტორიზაცია: Identity (OAuth2 / OIDC), ტოკენები httpOnly cookie-ში (BFF) | ტოკენი JavaScript-ში არ ჩანს; SSE მარტივად მუშაობს ([ინტეგრაციები](03-integrations.md#1-identity--oauth2--oidc)) |\n| D4 | ასინქრონული პროცესები: NATS JetStream + Outbox pattern | ივენთი არ იკარგება, თუნდაც სერვისი დროებით გაითიშოს |\n| D5 | API-ში და ივენთებში ველები `snake_case` | კომპანიის სხვა სერვისებთან ერთიანი სტილი |\n| D6 | ფასები მთელ რიცხვად, თეთრებში | დამრგვალების შეცდომების გარეშე |\n\n## 3. განხილული ალტერნატივები\n\n| ალტერნატივა | რატომ არ შევარჩიეთ |\n|---|---|\n| **Drizzle** (ORM) | Prisma-ს ინსტრუმენტები (Studio, მიგრაციები) ამ პროექტისთვის უფრო მოსახერხებელია |\n| **Shop-ის დაყოფა რამდენიმე მიკროსერვისად** | კატალოგი, მარაგი და შეკვეთები მჭიდროდაა დაკავშირებული და ერთ ბაზაში ლოკალური ტრანზაქციით მუშაობს. ცალკე სერვისებად დაყოფის შემთხვევაში მათ შორის განაწილებული ტრანზაქცია (saga) დაგვჭირდებოდა, რაც ამ ეტაპზე საჭირო არ არის. დაყოფა აქტუალური გახდება, თუ კატალოგს კომპანიის სხვა პროდუქტებიც გამოიყენებს ან ცალკე გუნდები გაჩნდება |\n","02-architecture":"# 02 — Architecture\n\n## 1. სისტემის სქემა\n\n![სისტემის არქიტექტურა](diagrams/architecture.svg)\n\n## 2. კომპონენტები\n\n| კომპონენტი | პასუხისმგებლობა |\n|---|---|\n| **Storefront** | საჯარო საიტი: რენდერი (SSR/ISR), login (BFF), API-ს გამოძახება |\n| **Admin Panel** | შიდა პანელი: იგივე login, მხოლოდ ადმინის როლებისთვის |\n| **Shop API** | REST API: კატალოგი, კალათა, checkout, შეკვეთები, admin ოპერაციები, SSE ნაკადები |\n| **Shop Worker** | ფონური სამუშაო: NATS ივენთები, outbox, ვადაგასული რეზერვაციები, ფისკალური ჩეკები |\n| **PostgreSQL** | მაღაზიის ყველა საკუთარი მონაცემი |\n| **NATS JetStream** | ივენთები სერვისებს შორის |\n| **S3** | პროდუქტის სურათები (usectl-ის S3 addon) |\n| **Identity** | კომპანიის მიკროსერვისი: მომხმარებლები, login, ტოკენები, როლები |\n| **Billing** | კომპანიის მიკროსერვისი: გადახდა TBC / BOG-ით, refund, გადახდის ივენთები |\n| **Fiscal** | კომპანიის მიკროსერვისი: ფისკალური ჩეკები RS.ge-ზე |\n\nAPI და Worker **ერთი კოდბაზაა** (`icomers-api` რეპო) ორი გამშვები ფაილით. Deploy ცალ-ცალკე ხდება, რომ HTTP მოთხოვნებმა და ფონურმა სამუშაომ ერთმანეთს არ შეუშალონ ხელი.\n\n## 3. NestJS მოდულები (modular monolith)\n\nShop backend არის **ერთი აპლიკაცია, შიგნით მკაცრად დაყოფილი მოდულებად**. კომპანიის მიკროსერვისების სისტემაში ის ერთი სერვისია, რომელიც დანარჩენებს gRPC-ით და NATS-ით ესაუბრება.\n\n```\nicomers-api/src/\n  modules/\n    auth/            # JWT ვალიდაცია (JWKS), Guards, @CurrentUser, @Roles\n    catalog/         # კატეგორიები, პროდუქტები, სურათები, ძებნა\n    compatibility/   # დამტენის ბრენდები, მოდელები, product ↔ model კავშირი\n    inventory/       # მარაგი, მოძრაობები, რეზერვაციები\n    customers/       # პროფილი, მისამართები\n    cart/            # კალათა (guest + user), შერწყმა login-ისას\n    orders/          # შეკვეთები, სტატუსები, state machine\n    checkout/        # checkout: ფასი → რეზერვაცია → გადახდა\n    payments/        # Billing adapter, გადახდის ივენთები\n    fiscal/          # Fiscal adapter, ჩეკები\n    admin-events/    # SSE ნაკადები\n    audit/           # admin audit log\n  infra/             # prisma, nats, outbox, grpc, storage\n  main.ts            # HTTP API\n  worker.ts          # Worker\n```\n\n**წესები მოდულებს შორის:**\n- მოდული სხვა მოდულის ცხრილებს პირდაპირ არ ეხება. სხვა მოდულის მონაცემს მხოლოდ მისი service-ით იღებს. ამის წყალობით, საჭიროებისას ნებისმიერი მოდული შეიძლება ცალკე სერვისად გამოიყოს.\n- კომპანიის მიკროსერვისებთან (Billing, Fiscal, Identity) ინტეგრაცია ხდება **adapter-ის** მეშვეობით (`PaymentGateway`, `FiscalGateway`, `IdentityGateway` ინტერფეისები). Adapter-ს ორი იმპლემენტაცია აქვს: **gRPC** (რეალური სერვისი) და **mock** (ლოკალური დეველოპმენტი და ავტომატური ტესტები). ასე ბიზნეს-ლოგიკა gRPC კონტრაქტის დეტალებზე არ არის დამოკიდებული და კონტრაქტის ცვლილება მხოლოდ adapter-ს ეხება.\n\n## 4. როდის sync, როდის async\n\n| სიტუაცია | გზა | მაგალითი |\n|---|---|---|\n| პასუხი **ახლავე** გვჭირდება | **gRPC** | გადახდის შექმნა და redirect URL-ის მიღება |\n| რაღაც „მოხდა“ და სხვებმა უნდა გაიგონ | **NATS** | `shop.order.paid` |\n| ერთად უნდა მოხდეს ან საერთოდ არ მოხდეს | **Postgres ტრანზაქცია** | შეკვეთა + მარაგის რეზერვაცია + outbox ჩანაწერი |\n| ბრაუზერმა live უნდა დაინახოს | **SSE** | ახალი შეკვეთა ადმინის dashboard-ზე |\n\n### ძირითადი წესები\n- **ბიზნეს-ლოგიკა მხოლოდ NestJS-შია.** Next.js მხოლოდ რენდერისა და login-ის (BFF) ფუნქციას ასრულებს.\n- ფრონტი gRPC-ს და NATS-ს არ ეხება, მხოლოდ REST-ს და SSE-ს.\n- **მარაგი ყოველთვის ტრანზაქციაში იცვლება**, შეკვეთასთან ერთად. ასინქრონულად არასდროს.\n- ფასი, დღგ და ჯამი ყოველთვის სერვერზე ითვლება.\n- ყველა NATS consumer **idempotent** არის: ერთი ივენთი შეიძლება ორჯერ მოვიდეს და შედეგი ერთი უნდა იყოს.\n\n### შეკვეთის პროცესი და saga\n\n- **მაღაზიის შიგნით** (შეკვეთა + მარაგი): ლოკალური Postgres ტრანზაქცია, რადგან ეს მონაცემები ერთ ბაზაშია.\n- **კომპანიის სერვისებთან** (Billing → Fiscal → refund): განაწილებული პროცესი კომპენსაციებით, რომელიც ივენთებით იმართება (choreography saga). მაგალითად, გადახდა ჩავარდა → რეზერვაცია თავისუფლდება; შეკვეთა გაუქმდა → refund → დაბრუნების ჩეკი.\n- კომპანიას უკვე აქვს saga orchestrator (Charging), სადაც ეს მიდგომა დატენვის სესიებისთვის სწორი არჩევანია: სესია რამდენიმე დამოუკიდებელ სისტემას მოიცავს და დიდხანს გრძელდება.\n\n:::question id=\"saga-orchestrator\" to=\"Backend გუნდი (Charging saga)\"\nმართოს თუ არა მაღაზიის შეკვეთის პროცესი (გადახდა → ფისკალური ჩეკი → refund) კომპანიის არსებულმა saga orchestrator-მა, ივენთებზე დაფუძნებული პროცესის ნაცვლად? თუ კი, რა სჭირდება მასთან ინტეგრაციას?\n:::\n\n## 5. Outbox pattern\n\nპრობლემა: შეკვეთა ბაზაში ჩაიწერა, მაგრამ NATS-ში ივენთის გაგზავნამდე სერვერი გაითიშა და ივენთი დაიკარგა.\n\nგამოსავალი: ივენთი ჯერ ბაზაში იწერება, იმავე ტრანზაქციაში, შემდეგ კი Worker მას NATS-ში აგზავნის.\n\n![Outbox pattern](diagrams/outbox.svg)\n\n<details>\n<summary>ტექნიკური დეტალები</summary>\n\n- `Nats-Msg-Id` = ივენთის id. თუ relay ერთ ივენთს ორჯერ გააგზავნის, JetStream მეორეს უგულებელყოფს.\n- Relay კითხულობს `SELECT … WHERE published_at IS NULL FOR UPDATE SKIP LOCKED`-ით, რომ რამდენიმე Worker-მა ერთი ივენთი ერთდროულად არ აიღოს.\n- Idempotent consumer:\n  ```\n  BEGIN\n    INSERT INTO processed_events(event_id, consumer) … ON CONFLICT DO NOTHING\n    -- უკვე არსებობდა → უკვე დამუშავებულია → ack და გასვლა\n    … ბიზნეს-ლოგიკა …\n  COMMIT\n  ack()\n  ```\n\n</details>\n\n## 6. SSE (live განახლებები)\n\nSSE გამოიყენება ორ ადგილას: **ადმინის dashboard** (ახალი შეკვეთები, გადახდები, გაფრთხილებები) და **checkout-ის შედეგის გვერდი** (შეკვეთის სტატუსი გადახდის შემდეგ).\n\n![SSE რამდენიმე replica-ზე](diagrams/sse-fanout.svg)\n\nთითოეული API pod NATS-ის ივენთებს თავად იღებს და თავის ბრაუზერებს გადასცემს. ასე ყველა ადმინი ყველა ივენთს ხედავს, მიუხედავად იმისა, თუ რომელ pod-ს დაუკავშირდა.\n\n### SSE-ის წესები\n- **ივენთი შეიძლება დაიკარგოს.** კავშირის გაწყვეტისას გამოტოვებული ივენთები აღარ ბრუნდება. ამიტომ ყოველი ხელახლა დაკავშირების შემდეგ კლიენტი ერთხელ REST-იდან ხელახლა ტვირთავს მონაცემებს (reconcile). Polling არ გამოიყენება.\n- **Reconnect:** ექსპონენციალური backoff 1 წამიდან 30 წამამდე, jitter-ით.\n- **Heartbeat:** სერვერი ყოველ 15 წამში აგზავნის `: ping` კომენტარს, რომ proxy-მ კავშირი არ გათიშოს.\n- **Cache-ის განახლება:** ივენთი პირდაპირ აახლებს TanStack Query-ის cache-ს (`setQueriesData`), ამიტომ დამატებითი request არ ხდება.\n- **Optimistic update არ ხდება.** მოქმედება (მაგ. გადახდა) აბრუნებს „მიღებულია“ პასუხს, ხოლო რეალური სტატუსი მხოლოდ SSE-ით ან REST-ით მოდის.\n- **Proxy:** usectl-ზე ტრაფიკი Cloudflare-ით და Traefik-ით გადის. Heartbeat კავშირს ღიად ინახავს; დეტალები: [Deployment](10-deployment.md#4-sse-usectl-ზე).\n- ივენთების სახელები `snake_case`-ითაა: `order_created`, `order_paid`, `order_status_changed`, `inventory_low_stock`.\n\n### SSE და ავტორიზაცია: ორი ვარიანტი\n\nბრაუზერის ჩვეულებრივი `EventSource` ვერ აგზავნის `Authorization` header-ს. ამის გადასაჭრელად ორი გზა არსებობს:\n\n| | **ვარიანტი A: BFF + cookie** (რეკომენდებული) | **ვარიანტი B: Bearer token + polyfill** (როგორც ev-charger-admin-შია) |\n|---|---|---|\n| როგორ მუშაობს | ტოკენი Next.js-ის სერვერზე ინახება, ბრაუზერს კი მხოლოდ httpOnly cookie აქვს. SSE ჩვეულებრივი `EventSource`-ით მიდის Next.js-ზე, რომელიც მას API-ზე გადასცემს ტოკენით | ტოკენი ბრაუზერშია. SSE `event-source-polyfill`-ით იხსნება, რომელიც `Authorization: Bearer` header-ს აგზავნის |\n| ტოკენის განახლება | Next.js-ის სერვერი აკეთებს, ერთ ადგილას, ყველა request-ისთვის | SSE სერვისს საკუთარი 401 → refresh ლოგიკა სჭირდება, axios interceptor-ისგან ცალკე |\n| უსაფრთხოება | ტოკენი JavaScript-ისთვის მიუწვდომელია, ამიტომ XSS-ით ვერ მოიპარება | ტოკენი JavaScript-ისთვის ხელმისაწვდომია, ამიტომ XSS-ის რისკი მეტია |\n| დამატებითი ბიბლიოთეკა | არ სჭირდება | polyfill |\n\n**რეკომენდაცია: ვარიანტი A.** მიზეზები:\n1. **მაღაზია საჯარო საიტია**, სადაც მომხმარებლები ბარათით იხდიან. ტოკენის httpOnly cookie-ში შენახვა XSS-ისგან იცავს.\n2. **ტოკენის განახლება ერთ ადგილასაა.** ვარიანტ B-ში ის ორ ადგილას უნდა დაიწეროს (ჩვეულებრივი request-ები და SSE) და ზედმეტი refresh-ებისგან დაცვაც სჭირდება.\n3. **კოდი მარტივია:** ჩვეულებრივი `EventSource` ავტომატური reconnect-ით, polyfill-ის გარეშე.\n4. Next.js უკვე გვაქვს სერვერად, ამიტომ BFF დამატებით ინფრასტრუქტურას არ მოითხოვს.\n\nვარიანტი B ბუნებრივი არჩევანია ისეთი აპისთვის, რომელიც მხოლოდ ბრაუზერში მუშაობს და სერვერული ნაწილი არ აქვს (მაგ. Vite SPA). ჩვენს შემთხვევაში Next.js-ის სერვერი ამ პრობლემას ხსნის.\n\n## 7. gRPC client-ის წესები\n\n- ყველა call-ს აქვს **deadline** (3–5 წამი). უსასრულო ლოდინი დაუშვებელია.\n- Retry მხოლოდ წაკითხვაზე ან იმ call-ებზე, რომლებიც idempotency key-ს იღებენ (მაგ. გადახდის შექმნა `order_id`-ით).\n- gRPC შეცდომები HTTP სტატუსებად გარდაიქმნება: `UNAVAILABLE` → 503, `INVALID_ARGUMENT` → 422, `NOT_FOUND` → 404.\n","03-integrations":"# 03 — Integrations\n\nქვემოთ მოცემული gRPC მეთოდები აღწერს, რა ფუნქციონალი სჭირდება მაღაზიას. ზუსტი სახელები და ველები შეთანხმდება შესაბამისი სერვისის `.proto` კონტრაქტის მიხედვით.\n\n## სერვისების გამოყენება\n\n| სერვისი | როგორ ვიყენებთ |\n|---|---|\n| **Identity** | Login და რეგისტრაცია (OAuth2 / OIDC), ტოკენის შემოწმება, ადმინის როლები |\n| **Billing** | gRPC: გადახდის შექმნა, refund. NATS: გადახდის შედეგი |\n| **Fiscal** | gRPC Worker-იდან: გაყიდვისა და დაბრუნების ჩეკები |\n| **Notification** | მოგვიანებით. ამჟამად push შეტყობინებებისთვისაა, მობილური აპი კი არ იგეგმება |\n\n---\n\n## 1. Identity — OAuth2 / OIDC\n\n**რაც უკვე ვიცით** (კომპანიის სხვა პროექტებიდან): Identity იყენებს OAuth2-ს, access token არის **JWT**, მომხმარებლის ID არის `sub` claim (UUID), refresh token მხარდაჭერილია. მაღაზიაში `customers.identity_user_id = sub`.\n\n**რაც დამატებით გვჭირდება:** OAuth2 გვეუბნება, რა უფლება აქვს ტოკენს. იმის გასაგებად, **ვინ არის მომხმარებელი** (სახელი, email), საჭიროა **OpenID Connect (OIDC)**, რომელიც OAuth2-ის თავზე დგას.\n\n| საჭიროება | რატომ |\n|---|---|\n| OIDC Discovery / issuer URL | endpoint-ების ავტომატური აღმოჩენა |\n| Authorization Code + PKCE | ბრაუზერისთვის უსაფრთხო login flow |\n| JWKS endpoint | Shop API ტოკენს თავად ამოწმებს, ყოველ request-ზე Identity-სთან მიმართვის გარეშე |\n| `roles` claim | ადმინის როლები: `admin`, `manager`, `content_editor`, `warehouse` |\n| ორი client | `icomers-storefront` და `icomers-admin`, თავ-თავისი redirect URI-ებით |\n| Audience (`aud`) | `icomers-api`, რომ სხვა სერვისის ტოკენი ჩვენთან არ იმუშაოს |\n\n:::question id=\"identity-oidc\" to=\"Identity გუნდი\"\nზემოთ ცხრილში ჩამოთვლილთაგან რომელია მხარდაჭერილი (OIDC discovery, PKCE, JWKS, `roles` claim, audience)? შეგიძლიათ დაარეგისტრიროთ ორი client (`icomers-storefront`, `icomers-admin`) და შექმნათ ადმინის როლები? გთხოვთ, მიუთითოთ issuer URL (dev / staging / prod).\n:::\n\n:::question id=\"identity-login-ui\" to=\"Identity გუნდი\"\nLogin / რეგისტრაციის გვერდი Identity-ის hosted გვერდია? აქვს ქართული ენის მხარდაჭერა და ბრენდინგის შეცვლის შესაძლებლობა? რეგისტრაცია email-ით, ტელეფონით (SMS) თუ ორივეთი?\n:::\n\n:::question id=\"platform-s2s-auth\" to=\"Platform / Backend გუნდი\"\nService-to-service ავთენტიფიკაცია gRPC-ზე როგორ ხდება: **mTLS**, **service token**, თუ შიდა ქსელში ავთენტიფიკაციის გარეშე?\n:::\n\n### Login flow (BFF)\n\n![Login flow](diagrams/login.svg)\n\n- ტოკენები ინახება Next.js-ის სერვერზე. ბრაუზერს მხოლოდ httpOnly cookie აქვს, `localStorage` არ გამოიყენება. რატომ: იხ. [SSE და ავტორიზაცია](02-architecture.md#sse-და-ავტორიზაცია-ორი-ვარიანტი).\n- Shop API ამოწმებს JWT-ს (ხელმოწერა JWKS-ით, `iss`, `aud`, `exp`) და როლებს (`RolesGuard`).\n- პირველი login-ისას Shop API ქმნის `customers` ჩანაწერს `sub`-ით.\n- Checkout მოითხოვს login-ს. კალათა login-ის გარეშეც მუშაობს და login-ისას ერწყმის. საბოლოო გადაწყვეტილება: კითხვა `biz-guest-checkout`.\n\n---\n\n## 2. Billing — TBC / BOG\n\n### gRPC მეთოდები\n\n| მეთოდი | შემავალი | გამომავალი |\n|---|---|---|\n| `CreatePayment` | `idempotency_key` (= `order_id`), `amount_minor`, `currency`, `provider` (TBC / BOG), `return_url` | `payment_id`, `status`, `redirect_url` |\n| `GetPayment` | `payment_id` | `status`, `amount_minor` |\n| `RefundPayment` | `payment_id`, `amount_minor`, `idempotency_key` | `refund_id`, `status` |\n\n### ივენთები (Billing → NATS)\n\nBilling უკვე აქვეყნებს გადახდის შედეგს NATS-ში. მაღაზია ამ ივენთებს მუდმივი (durable) consumer-ით იღებს:\n\n| ივენთი | მაღაზიის რეაქცია |\n|---|---|\n| გადახდა წარმატებულია | შეკვეთა → `PAID`, მარაგი ჩამოიწერება, ჩეკი გამოიწერება |\n| გადახდა ჩავარდა | შეკვეთა → `PAYMENT_FAILED`, მარაგი თავისუფლდება |\n| refund დასრულდა | refund → `SUCCEEDED`, დაბრუნების ჩეკი |\n\n:::question id=\"billing-events\" to=\"Billing გუნდი\"\nგადახდის ივენთების **ზუსტი subject-ები და payload-ის სქემა** (წარმატებული / წარუმატებელი / refund)? როგორ გადავცეთ `order_id`, რომ ივენთში დაგვიბრუნდეს? ბანკის callback-ს Billing იღებს?\n:::\n\n:::question id=\"billing-idempotency\" to=\"Billing გუნდი\"\n`CreatePayment` არის idempotent? ანუ ერთი და იმავე `idempotency_key`-ით ორი გამოძახება ერთ გადახდას ქმნის?\n:::\n\n:::question id=\"billing-refund\" to=\"Billing გუნდი\"\nშესაძლებელია **ნაწილობრივი refund**? დაახლოებით რამდენ დღეში ბრუნდება თანხა ბარათზე (მომხმარებლისთვის ტექსტში დასაწერად)?\n:::\n\n:::question id=\"billing-expiry\" to=\"Billing გუნდი\"\nრა დროის შემდეგ ითვლება გადაუხდელი გადახდა **ვადაგასულად**? ამაზეა დამოკიდებული მარაგის რეზერვაციის ვადა (ახლა 15 წუთი).\n:::\n\n:::question id=\"billing-sandbox\" to=\"Billing გუნდი\"\nარსებობს **sandbox / test** გარემო TBC-სა და BOG-ისთვის staging-ზე გამოსაყენებლად?\n:::\n\n:::question id=\"billing-methods\" to=\"Billing გუნდი / ბიზნესი\"\nგადახდის რომელი მეთოდებია ხელმისაწვდომი: მხოლოდ ბარათი, თუ Apple Pay / Google Pay / განვადებაც? რომელი გვინდა პირველ ვერსიაში?\n:::\n\n---\n\n## 3. Fiscal — RS.ge\n\n| მეთოდი | რისთვის |\n|---|---|\n| `IssueReceipt` | გაყიდვის ჩეკი: ხაზები (სახელი, რაოდენობა, ფასი, დღგ), ჯამი, გადახდის ტიპი |\n| `IssueRefundReceipt` | დაბრუნების ჩეკი, ორიგინალ ჩეკზე მითითებით |\n\n**როდის იძახება:** Worker იღებს `shop.order.paid` ივენთს და იძახებს `IssueReceipt`-ს. შეცდომის შემთხვევაში ხელახლა ცდის; თუ რამდენიმე მცდელობა ჩავარდა, ჩეკი `FAILED` ხდება და ადმინი იღებს გაფრთხილებას „თავიდან ცდის“ ღილაკით.\n\n:::question id=\"fiscal-sync\" to=\"Fiscal გუნდი\"\nFiscal ჩეკის ნომერს **სინქრონულად** აბრუნებს gRPC პასუხში, თუ **ასინქრონულად** (საკუთარი NATS ივენთით)?\n:::\n\n:::question id=\"fiscal-when\" to=\"ბუღალტერია\"\nფისკალური ჩეკი **გადახდის მომენტში** უნდა გამოიწეროს, თუ **ნივთის გადაცემისას**?\n:::\n\n:::question id=\"fiscal-fields\" to=\"Fiscal გუნდი\"\nრა ველებს ითხოვს `IssueReceipt` (საქონლის კოდები, ერთეულები, დღგ-ის კოდები, გადახდის ტიპი)? შეიძლება მომხმარებელს ჩეკის ბმული ან PDF ვაჩვენოთ? გთხოვთ, მოგვაწოდოთ მაგალითი.\n:::\n\n---\n\n## 4. შეტყობინებები (email / SMS)\n\nშეკვეთის დადასტურება და სტატუსის ცვლილება მომხმარებელს ორი გზით შეიძლება მივაწოდოთ:\n- **A:** Notification სერვისს დაემატება email/SMS არხი (ცენტრალიზებული, კომპანიის ყველა სერვისისთვის)\n- **B:** Worker პირდაპირ იყენებს email provider-ს და ქართულ SMS provider-ს\n\nორივე შემთხვევაში წყარო ივენთია: `shop.order.paid`, `shop.order.status_changed`.\n\n:::question id=\"notif-channel\" to=\"Backend გუნდი / ბიზნესი\"\nშეკვეთის შეტყობინებები რომელი არხით გაიგზავნოს (email, SMS, ორივე) და საიდან: Notification სერვისი გაფართოვდება (A), თუ მაღაზია პირდაპირ provider-ს გამოიყენებს (B)?\n:::\n\n---\n\n## 5. NATS JetStream\n\nStream: `SHOP`, subjects `shop.>`. მაღაზიის მიერ გამოქვეყნებული ივენთები:\n\n| Subject | როდის | ვინ ისმენს |\n|---|---|---|\n| `shop.order.created` | შეკვეთა შეიქმნა (გადახდამდე) | admin SSE |\n| `shop.order.paid` | გადახდა დადასტურდა | Worker (ჩეკი), შეტყობინებები, admin SSE |\n| `shop.order.status_changed` | ადმინმა სტატუსი შეცვალა | შეტყობინებები, admin SSE |\n| `shop.order.cancelled` | შეკვეთა გაუქმდა | Worker (refund), admin SSE |\n| `shop.order.refunded` | თანხა დაბრუნდა | Worker (დაბრუნების ჩეკი), admin SSE |\n| `shop.inventory.low_stock` | მარაგი ზღვარს ქვემოთ ჩავიდა | admin SSE |\n| `shop.product.updated` | პროდუქტი შეიცვალა | storefront-ის განახლება |\n\nყველა ივენთის ფორმატი (ველები `snake_case`):\n\n```json\n{\n  \"id\": \"0192f3c4-…\",\n  \"type\": \"shop.order.paid\",\n  \"version\": 1,\n  \"occurred_at\": \"2026-10-13T10:15:00Z\",\n  \"source\": \"icomers-api\",\n  \"data\": { \"order_id\": \"…\", \"order_number\": \"ICM-000123\", \"total_minor\": 15900, \"currency\": \"GEL\" }\n}\n```\n\nივენთის სტრუქტურის ცვლილებისას `version` იზრდება, ძველი ველები კი არ იშლება.\n\n<details>\n<summary>ტექნიკური დეტალები: consumer-ის პარამეტრები და proto ფაილები</summary>\n\n| პარამეტრი | მნიშვნელობა |\n|---|---|\n| ტიპი | durable, pull |\n| `ack_policy` | explicit |\n| `ack_wait` | 30s |\n| `max_deliver` | 10 |\n| `backoff` | 1s, 5s, 30s, 2m, 10m … |\n| ამოწურვის შემდეგ | `failed_events` ცხრილი + გაფრთხილება ადმინში |\n\n`.proto` კონტრაქტები ინახება `icomers-api/proto/`-ში, TypeScript კოდი მათგან Buf + ts-proto-ით გენერირდება. ივენთების სქემები `icomers-api/src/contracts/`-შია (zod), რომ publisher-იც და consumer-იც ერთსა და იმავე სქემებს იყენებდნენ.\n\n</details>\n\n:::question id=\"proto-source\" to=\"Backend გუნდი\"\nსად ინახება Identity / Billing / Fiscal სერვისების `.proto` კონტრაქტები და როგორ მივიღოთ მათზე წვდომა (რეპო, Buf registry)?\n:::\n\nNATS-თან და კომპანიის სერვისებთან ქსელური კავშირი: იხ. კითხვა `platform-company-services` ([Deployment](10-deployment.md#11-platform-თან-დასაზუსტებელი)).\n","04-data-model":"# 04 — Data Model (PostgreSQL)\n\n## 1. კონვენციები\n\n| წესი | მნიშვნელობა |\n|---|---|\n| Primary key | `uuid` (`gen_random_uuid()`), გარდა join ცხრილებისა |\n| სახელები | `snake_case` (ბაზაშიც და API-შიც) |\n| დრო | `timestamptz`, UTC. ყველა ცხრილს აქვს `created_at`, `updated_at` |\n| თანხა | `integer`, **თეთრებში** (`*_minor`). ვალუტა `GEL` |\n| ენები | თარგმნადი ტექსტი ინახება `*_translations` ცხრილებში (`locale` = `ka` / `en`) |\n| წაშლა | პროდუქტი არ იშლება, არამედ გადადის `ARCHIVED` სტატუსში (ის შეკვეთებს სჭირდება). დანარჩენი: hard delete, სადაც ეს უსაფრთხოა |\n| Snapshot | შეკვეთა ინახავს პროდუქტის სახელს, ფასს და მისამართს **შეკვეთის მომენტის მდგომარეობით**. შემდგომი ცვლილებები ძველ შეკვეთებზე არ აისახება |\n| Extensions | `pgcrypto`, `pg_trgm`, `citext` |\n\n## 2. დომენები და კავშირები\n\n![მონაცემთა მოდელი](diagrams/data-model.svg)\n\n## 3. ცხრილები\n\n### კატალოგი\n\n**`categories`**\n| სვეტი | ტიპი | შენიშვნა |\n|---|---|---|\n| id | uuid PK | |\n| parent_id | uuid FK → categories, null | ხე (მაგ. „კაბელები“ → „Type 2 კაბელები“) |\n| slug | text UNIQUE | URL-ისთვის; ერთი და იგივე ორივე ენისთვის (ლათინური ასოებით) |\n| sort_order | int | |\n| is_active | bool | |\n\n**`category_translations`**: `(category_id, locale)` PK, `name`, `description`, `seo_title`, `seo_description`\n\n**`products`**\n| სვეტი | ტიპი | შენიშვნა |\n|---|---|---|\n| id | uuid PK | |\n| sku | text UNIQUE | შიდა კოდი |\n| slug | text UNIQUE | |\n| category_id | uuid FK | |\n| status | enum `DRAFT` / `ACTIVE` / `ARCHIVED` | storefront-ზე ჩანს მხოლოდ `ACTIVE` |\n| price_minor | int CHECK ≥ 0 | დღგ-ის ჩათვლით |\n| compare_at_price_minor | int null | „ძველი ფასი“ (გადახაზული) |\n| vat_rate_bp | int default 1800 | დღგ basis points-ში (18.00%) |\n| oem_part_numbers | text[] | ქარხნული ნომრები, ძებნისთვის |\n| attributes | jsonb | თავისუფალი მახასიათებლები: `{ \"voltage\": \"400V\", \"current\": \"32A\", \"connector\": \"Type 2\" }` |\n| weight_g | int null | მომავალში, მიწოდებისთვის |\n| is_featured | bool | ჩანს მთავარ გვერდზე |\n| created_at, updated_at | timestamptz | |\n\n**`product_translations`**\n| სვეტი | ტიპი | შენიშვნა |\n|---|---|---|\n| product_id, locale | PK | |\n| name | text | |\n| short_description | text | |\n| description | text | Markdown / rich text |\n| seo_title, seo_description | text | |\n| search_vector | tsvector GENERATED | `to_tsvector('simple', name ‖ short_description)` |\n\n**`product_images`**: `id`, `product_id`, `storage_key`, `alt` (jsonb `{ka,en}`), `sort_order`, `width`, `height`\n\n**`attribute_definitions`** *(სურვილისამებრ, ფილტრებისთვის)*: `key`, `label` (jsonb), `type` (`text`/`number`/`enum`), `options`, `is_filterable`. საშუალებას აძლევს ადმინს, თავად განსაზღვროს, რომელი `attributes` გამოჩნდეს ფილტრად.\n\n### თავსებადობა\n\n**`charger_brands`**: `id`, `slug` UNIQUE, `name`, `logo_key`, `sort_order`, `is_active`\n\n**`charger_models`**\n| სვეტი | ტიპი | შენიშვნა |\n|---|---|---|\n| id | uuid PK | |\n| brand_id | uuid FK | |\n| slug | text | UNIQUE `(brand_id, slug)` |\n| name | text | მაგ. „Wallbox Pulsar Plus“ |\n| revision | text null | ვერსია / რევიზია / თაობა |\n| power_kw | numeric null | |\n| image_key | text null | რათა მომხმარებელმა მოდელი ვიზუალურად ამოიცნოს |\n| is_active | bool | |\n\n**`product_compatibility`**\n| სვეტი | ტიპი | შენიშვნა |\n|---|---|---|\n| product_id | uuid FK | PK `(product_id, charger_model_id)` |\n| charger_model_id | uuid FK | |\n| note | text null | მაგ. „მხოლოდ 2023 წლის შემდეგ გამოშვებულ ვერსიაზე“ |\n\nინდექსი: `(charger_model_id, product_id)`, რადგან ფილტრი სწორედ ამ მიმართულებით მუშაობს.\n\n> **უნივერსალური ნაწილები** (რომლებიც ყველა მოდელს ერგება): `products.is_universal bool`. ფილტრი აბრუნებს `compatible OR universal`.\n\n### მარაგი (ერთი საწყობი)\n\n**`inventory_items`**\n| სვეტი | ტიპი | შენიშვნა |\n|---|---|---|\n| product_id | uuid PK FK | |\n| on_hand | int | ფიზიკურად არის საწყობში |\n| reserved | int | დაკავებულია გადაუხდელი შეკვეთებით |\n| low_stock_threshold | int default 2 | |\n| | CHECK | `on_hand >= 0 AND reserved >= 0 AND reserved <= on_hand` |\n\nხელმისაწვდომი რაოდენობა = `on_hand - reserved`.\n\n**`stock_movements`** (ledger, მხოლოდ INSERT)\n| სვეტი | ტიპი | შენიშვნა |\n|---|---|---|\n| id | uuid | |\n| product_id | uuid | |\n| type | enum `RECEIPT` / `SALE` / `RETURN` / `ADJUSTMENT` / `DAMAGE` | |\n| quantity | int | + ან − |\n| order_id | uuid null | |\n| reason | text null | |\n| actor_id | text null | ადმინის identity id |\n| created_at | timestamptz | |\n\n**`stock_reservations`**: `id`, `order_id`, `product_id`, `quantity`, `status` (`ACTIVE` / `COMMITTED` / `RELEASED`), `expires_at`, ინდექსი `(status, expires_at)`\n\n### მომხმარებლები\n\n**`customers`** (Identity-ის მონაცემების ლოკალური ასლი + მაღაზიის მონაცემები)\n| სვეტი | ტიპი | შენიშვნა |\n|---|---|---|\n| id | uuid | |\n| identity_user_id | text UNIQUE | `sub` ტოკენიდან |\n| type | enum `INDIVIDUAL` / `BUSINESS` | `BUSINESS` დაემატება მოგვიანებით |\n| email | citext null | |\n| phone | text null | |\n| first_name, last_name | text | |\n| preferred_locale | text default `ka` | |\n| created_at, updated_at | | |\n\n**`addresses`**: `id`, `customer_id`, `label`, `recipient_name`, `phone`, `city`, `address_line`, `notes`, `is_default`\n\n> **B2B მომავლისთვის:** დაემატება `business_profiles` (`customer_id`, `company_name`, `tax_id`, `legal_address`), `price_lists` და `price_list_items`. ახლანდელი სქემა ამას არ ეწინააღმდეგება.\n\n### კალათა\n\n**`carts`**: `id`, `customer_id` UNIQUE null, `guest_token` UNIQUE null, `updated_at`, `expires_at`. CHECK: ერთ-ერთი მაინც უნდა იყოს შევსებული.\n\n**`cart_items`**: `(cart_id, product_id)` PK, `quantity` CHECK > 0, `added_at`\n\nფასი კალათაში **არ ინახება**: ის ყოველთვის `products`-იდან იკითხება.\n\n### შეკვეთები\n\n**`orders`**\n| სვეტი | ტიპი | შენიშვნა |\n|---|---|---|\n| id | uuid | |\n| number | text UNIQUE | ადამიანისთვის წაკითხვადი: `ICM-000123` (sequence) |\n| customer_id | uuid FK | |\n| status | enum | იხ. [06-order-flow](06-order-flow.md#1-შეკვეთის-სტატუსები) |\n| fulfillment_method | enum `PICKUP` / `DELIVERY` | `DELIVERY`-ს ადმინი ხელით მართავს |\n| contact | jsonb | snapshot: სახელი, ტელეფონი, email |\n| shipping_address | jsonb null | snapshot |\n| subtotal_minor | int | |\n| shipping_minor | int default 0 | |\n| discount_minor | int default 0 | |\n| total_minor | int | |\n| vat_minor | int | ჯამში შემავალი დღგ |\n| currency | char(3) default `GEL` | |\n| locale | text | რა ენაზე გაფორმდა შეკვეთა (შეტყობინებებისთვის) |\n| customer_note | text null | |\n| internal_note | text null | მხოლოდ ადმინისთვის |\n| placed_at, paid_at, completed_at, cancelled_at | timestamptz null | |\n\n**`order_items`**: `id`, `order_id`, `product_id`, `sku`, `name` (jsonb `{ka,en}` snapshot), `unit_price_minor`, `quantity`, `vat_rate_bp`, `line_total_minor`\n\n**`order_status_history`**: `id`, `order_id`, `from_status`, `to_status`, `actor_type` (`SYSTEM` / `CUSTOMER` / `ADMIN`), `actor_id`, `comment`, `created_at`\n\n### გადახდა და ჩეკები\n\n**`payments`**: `id`, `order_id`, `provider` (`TBC` / `BOG`), `billing_payment_id` UNIQUE, `status` (`PENDING` / `SUCCEEDED` / `FAILED` / `EXPIRED`), `amount_minor`, `redirect_url`, `last_event` jsonb, timestamps\n\n**`refunds`**: `id`, `payment_id`, `billing_refund_id`, `amount_minor`, `status`, `reason`, `actor_id`, timestamps\n\n**`fiscal_receipts`**: `id`, `order_id`, `type` (`SALE` / `REFUND`), `status` (`PENDING` / `ISSUED` / `FAILED`), `external_id`, `receipt_url`, `error`, `attempts`, `issued_at`\n\n### ტექნიკური ცხრილები\n\n| ცხრილი | რისთვის |\n|---|---|\n| `outbox_events` | `id`, `aggregate_type`, `aggregate_id`, `event_type`, `payload` jsonb, `created_at`, `published_at` null, `attempts`. ინდექსი: `WHERE published_at IS NULL` |\n| `processed_events` | `(event_id, consumer)` PK, `processed_at`. Idempotent consumer |\n| `failed_events` | ივენთები, რომლებმაც `max_deliver` ლიმიტი ამოწურეს |\n| `idempotency_keys` | `key`, `customer_id`, `request_hash`, `response` jsonb, `created_at`. `POST /checkout`-ისთვის |\n| `admin_audit_log` | `id`, `actor_id`, `actor_email`, `action`, `entity_type`, `entity_id`, `diff` jsonb, `ip`, `created_at` |\n\n## 4. მნიშვნელოვანი query-ები\n\n### თავსებადობის ფილტრი\n```sql\nSELECT p.*\nFROM products p\nWHERE p.status = 'ACTIVE'\n  AND (p.is_universal\n       OR EXISTS (SELECT 1 FROM product_compatibility pc\n                  WHERE pc.product_id = p.id AND pc.charger_model_id = $1));\n```\n\n### ძებნა (ქართული + ინგლისური + SKU / OEM)\nძებნა იყენებს Postgres-ის full-text search-ს (`simple` კონფიგურაცია) და `pg_trgm`-ს (მსგავსი და შეცდომით აკრეფილი სიტყვებისთვის), ასევე ეძებს SKU-ითა და OEM ნომრით.\n\n<details>\n<summary>ტექნიკური დეტალები: ინდექსები და query</summary>\n\n```sql\n-- ინდექსები\nCREATE INDEX ON product_translations USING gin (search_vector);\nCREATE INDEX ON product_translations USING gin (name gin_trgm_ops);\nCREATE INDEX ON products USING gin (sku gin_trgm_ops);\nCREATE INDEX ON products USING gin (oem_part_numbers);\n\n-- query (მარტივი ვერსია)\nSELECT p.id, similarity(t.name, $q) AS score\nFROM products p\nJOIN product_translations t ON t.product_id = p.id AND t.locale = $locale\nWHERE p.status = 'ACTIVE'\n  AND ( t.search_vector @@ plainto_tsquery('simple', $q)\n     OR t.name % $q\n     OR p.sku ILIKE $q || '%'\n     OR $q = ANY(p.oem_part_numbers) )\nORDER BY score DESC\nLIMIT 20;\n```\n\n</details>\n\n### მარაგის უსაფრთხო რეზერვაცია (race condition-ის გარეშე)\n```sql\nUPDATE inventory_items\nSET reserved = reserved + $qty, updated_at = now()\nWHERE product_id = $id\n  AND on_hand - reserved >= $qty\nRETURNING product_id;\n-- 0 row → მარაგი არ არის → მთელი checkout ტრანზაქციის rollback\n```\n","05-api":"# 05 — REST API\n\n## 1. კონვენციები\n\n| თემა | წესი |\n|---|---|\n| Base URL | `https://api.<domain>/v1` |\n| ფორმატი | JSON, ველები **`snake_case`** (კომპანიის სხვა API-ების მსგავსად) |\n| ენა | `Accept-Language: ka` / `en` (ნაგულისხმევი `ka`). თარგმნადი ველები ამ ენაზე ბრუნდება |\n| Auth | `Authorization: Bearer <access_token>`. ამ header-ს Next.js-ის სერვერი ამატებს (BFF) |\n| Guest კალათა | `X-Cart-Token: <uuid>` (cookie-დან BFF ამატებს) |\n| თანხა | `{ \"amount_minor\": 15900, \"currency\": \"GEL\" }`. ფრონტი აჩვენებს როგორც `159.00 ₾` |\n| თარიღი | ISO 8601, UTC |\n| Pagination | `?page=1&page_size=24` → `{ items, page, page_size, total }` |\n| სორტირება | `?sort=price_asc` / `price_desc` / `newest` / `relevance` |\n| შეცდომა | `application/problem+json` (იხ. ქვემოთ) |\n| Idempotency | `Idempotency-Key` header, `POST /checkout`-ზე სავალდებულო |\n| დოკუმენტაცია | Swagger UI: `/docs` (მხოლოდ dev / staging) |\n| ვერსია | URL-ში `/v1`. Breaking change → `/v2` |\n\n### შეცდომის ფორმატი\n```json\n{\n  \"type\": \"https://icomers.ge/errors/out-of-stock\",\n  \"title\": \"Out of stock\",\n  \"status\": 409,\n  \"code\": \"OUT_OF_STOCK\",\n  \"detail\": \"ზოგიერთი პროდუქტი აღარ არის მარაგში\",\n  \"errors\": [{ \"product_id\": \"…\", \"requested\": 3, \"available\": 1 }],\n  \"trace_id\": \"4bf92f3577b34da6\"\n}\n```\n`code` მუდმივია და ფრონტი გადაწყვეტილებას მასზე დაყრდნობით იღებს. ტექსტი შეიძლება შეიცვალოს.\n\n| HTTP | როდის |\n|---|---|\n| 400 / 422 | ვალიდაციის შეცდომა |\n| 401 | ტოკენი არ არის ან ვადაგასულია |\n| 403 | როლს არ აქვს საკმარისი უფლებები |\n| 404 | ვერ მოიძებნა |\n| 409 | კონფლიქტი: მარაგი, სტატუსის არასწორი ცვლილება, ფასის ცვლილება |\n| 429 | ძალიან ბევრი მოთხოვნა |\n| 503 | კომპანიის მიკროსერვისი (Billing / Identity) დროებით მიუწვდომელია |\n\n---\n\n## 2. Public (ავტორიზაციის გარეშე)\n\n| Method | Path | აღწერა |\n|---|---|---|\n| GET | `/catalog/categories` | კატეგორიების ხე |\n| GET | `/catalog/products` | სია + ფილტრები (იხ. ქვემოთ) |\n| GET | `/catalog/products/{slug}` | დეტალები, სურათები, თავსებადი მოდელები, მარაგის სტატუსი |\n| GET | `/catalog/products/{slug}/related` | მსგავსი პროდუქტები |\n| GET | `/catalog/filters` | ხელმისაწვდომი ფილტრები და რაოდენობები მიმდინარე შერჩევისთვის |\n| GET | `/search/suggest?q=` | autocomplete: პროდუქტები, კატეგორიები, მოდელები |\n| GET | `/compatibility/brands` | დამტენის ბრენდები |\n| GET | `/compatibility/brands/{brand_slug}/models` | ბრენდის მოდელები |\n| GET | `/compatibility/models/{id}` | მოდელის ინფორმაცია |\n| GET | `/health/live`, `/health/ready` | Kubernetes |\n\n### `GET /catalog/products` ფილტრები\n| პარამეტრი | მაგალითი |\n|---|---|\n| `category` | `cables` (ქვეკატეგორიებიც შედის) |\n| `charger_model` | `uuid`: მხოლოდ თავსებადი + უნივერსალური |\n| `charger_brand` | `wallbox` |\n| `q` | ტექსტური ძებნა (სახელი, SKU, OEM ნომერი) |\n| `min_price`, `max_price` | თეთრებში |\n| `in_stock` | `true` |\n| `attr[connector]` | `Type 2` (დინამიური ატრიბუტები) |\n| `sort`, `page`, `page_size` | |\n\nპასუხი:\n```json\n{\n  \"items\": [{\n    \"id\": \"…\", \"slug\": \"type2-cable-32a-5m\", \"sku\": \"CBL-T2-32-5\",\n    \"name\": \"Type 2 კაბელი 32A, 5მ\",\n    \"price\": { \"amount_minor\": 32900, \"currency\": \"GEL\" },\n    \"compare_at_price\": null,\n    \"image\": { \"url\": \"https://cdn…/p/…/1.webp\", \"alt\": \"…\" },\n    \"stock_status\": \"IN_STOCK\",\n    \"is_compatible\": true\n  }],\n  \"page\": 1, \"page_size\": 24, \"total\": 87\n}\n```\n`stock_status`: `IN_STOCK` / `LOW_STOCK` / `OUT_OF_STOCK`. ზუსტი რაოდენობა საჯაროდ არ ჩანს.\n\n---\n\n## 3. Customer (ავტორიზებული; კალათა login-ის გარეშეც მუშაობს)\n\n| Method | Path | აღწერა |\n|---|---|---|\n| GET / PATCH | `/me` | პროფილი: სახელი, ტელეფონი, ენა |\n| GET / POST | `/me/addresses` | მისამართები |\n| PATCH / DELETE | `/me/addresses/{id}` | |\n| GET | `/cart` | კალათა მიმდინარე ფასებით, ხელმისაწვდომობითა და ჯამით |\n| POST | `/cart/items` | `{ product_id, quantity }` |\n| PATCH / DELETE | `/cart/items/{product_id}` | |\n| POST | `/cart/merge` | login-ის შემდეგ guest კალათის შერწყმა |\n| POST | `/checkout/preview` | საბოლოო ჯამი, მარაგის შემოწმება, ფასის ცვლილებები |\n| POST | `/checkout` | შეკვეთის შექმნა + გადახდის დაწყება (`Idempotency-Key`) |\n| GET | `/orders` | ჩემი შეკვეთები |\n| GET | `/orders/{id}` | დეტალები, სტატუსის ისტორია, ჩეკი |\n| GET | `/orders/{id}/stream` | SSE: სტატუსის ცვლილება (გადახდის შედეგის გვერდისთვის) |\n| POST | `/orders/{id}/cancel` | მხოლოდ `PENDING_PAYMENT` სტატუსში |\n| POST | `/orders/{id}/retry-payment` | წარუმატებელი გადახდის ხელახლა ცდა |\n\n### `POST /checkout`\nRequest:\n```json\n{\n  \"fulfillment_method\": \"PICKUP\",\n  \"address_id\": null,\n  \"contact\": { \"name\": \"გიორგი\", \"phone\": \"+995 5xx xx xx xx\", \"email\": \"g@example.com\" },\n  \"payment_provider\": \"BOG\",\n  \"customer_note\": \"\",\n  \"expected_total_minor\": 32900\n}\n```\n`expected_total_minor`: თუ ფასი შეიცვალა მას შემდეგ, რაც მომხმარებელმა ის ნახა, ბრუნდება `409 PRICE_CHANGED` და მომხმარებელი ახალ ჯამს ხედავს.\n\nResponse `201`:\n```json\n{\n  \"order_id\": \"…\",\n  \"order_number\": \"ICM-000123\",\n  \"status\": \"PENDING_PAYMENT\",\n  \"payment\": { \"redirect_url\": \"https://…\" },\n  \"reservation_expires_at\": \"2026-10-13T10:30:00Z\"\n}\n```\n\n---\n\n## 4. Admin (`/admin/*`, საჭიროა ადმინის როლი)\n\n### კატალოგი\n| Method | Path | როლი |\n|---|---|---|\n| GET / POST | `/admin/products` | editor+ |\n| GET / PATCH | `/admin/products/{id}` | editor+ |\n| POST | `/admin/products/{id}/archive` | editor+ |\n| POST | `/admin/products/{id}/images/presign` | editor+ → `{ upload_url, storage_key }` |\n| POST / DELETE | `/admin/products/{id}/images` | editor+ |\n| PUT | `/admin/products/{id}/compatibility` | editor+ `{ model_ids: [], is_universal }` |\n| POST | `/admin/products/import` | admin (CSV / XLSX) |\n| GET | `/admin/products/export` | editor+ |\n| CRUD | `/admin/categories`, `/admin/charger-brands`, `/admin/charger-models` | editor+ |\n| POST | `/admin/charger-models/{id}/products` | editor+ (ერთ მოდელზე ბევრი პროდუქტის მიბმა) |\n\n### მარაგი\n| Method | Path | როლი |\n|---|---|---|\n| GET | `/admin/inventory?low_stock=true` | warehouse+ |\n| POST | `/admin/inventory/{product_id}/movements` | warehouse+ `{ type, quantity, reason }` |\n| GET | `/admin/inventory/{product_id}/movements` | warehouse+ |\n\n### შეკვეთები\n| Method | Path | როლი |\n|---|---|---|\n| GET | `/admin/orders?status=&from=&to=&q=` | manager+, warehouse |\n| GET | `/admin/orders/{id}` | manager+, warehouse |\n| POST | `/admin/orders/{id}/transition` | manager+ / warehouse `{ to, comment }` |\n| POST | `/admin/orders/{id}/cancel` | manager+ (გადახდილ შეკვეთაზე refund ავტომატურად ხდება) |\n| POST | `/admin/orders/{id}/refund` | admin `{ amount_minor, reason }` |\n| POST | `/admin/orders/{id}/fiscal/retry` | admin |\n\n### სხვა\n| Method | Path | როლი |\n|---|---|---|\n| GET | `/admin/customers`, `/admin/customers/{id}` | manager+ |\n| GET | `/admin/dashboard/summary?period=today` | ყველა ადმინი |\n| GET | `/admin/events/stream` | SSE, ყველა ადმინი |\n| GET | `/admin/audit-log` | admin |\n\n### Admin SSE ფორმატი\n```\nevent: order_paid\nid: 0192f3c4-…\ndata: {\"order_id\":\"…\",\"order_number\":\"ICM-000123\",\"total_minor\":32900}\n\nevent: inventory_low_stock\ndata: {\"product_id\":\"…\",\"sku\":\"CBL-T2-32-5\",\"available\":1}\n```\nSSE-ის წესები (reconnect, heartbeat, reconcile): იხ. [არქიტექტურა](02-architecture.md#6-sse-live-განახლებები).\n\n<details>\n<summary>ტექნიკური დეტალები: rate limiting</summary>\n\n| Endpoint ჯგუფი | ლიმიტი |\n|---|---|\n| Public catalog | 120 / წთ / IP |\n| `/search/suggest` | 60 / წთ / IP |\n| `/checkout` | 10 / წთ / user |\n| Admin | 600 / წთ / user |\n\nპირველ ვერსიაში გამოიყენება `@nestjs/throttler` ან ingress-ის rate limit.\n\n</details>\n\n---\n\n## 5. ფრონტის API client\n\nფრონტის კოდი API-ს გამოსაძახებლად და მისი ტიპები **ხელით არ იწერება**: ისინი backend-ის კოდიდან ავტომატურად გენერირდება.\n\n```\nNestJS კოდი  ──►  openapi.json  ──►  TypeScript ტიპები  ──►  ფრონტი\n (backend)       (API-ს აღწერა)     (ავტომატურად)          (autocomplete-ით)\n```\n\n| ნაბიჯი | ინსტრუმენტი | რას აკეთებს |\n|---|---|---|\n| 1 | `@nestjs/swagger` | backend-ის კოდიდან ქმნის API-ს სრულ აღწერას (`openapi.json`): ყველა URL, პარამეტრი, პასუხის ფორმა. Swagger UI-იც მასზე მუშაობს |\n| 2 | `openapi-typescript` | ამ აღწერიდან ქმნის TypeScript ტიპებს |\n| 3 | `openapi-fetch` | მცირე `fetch`-wrapper, რომელიც ამ ტიპებს იყენებს |\n\n```ts\nconst { data } = await api.GET('/catalog/products', {\n  params: { query: { category: 'cables', in_stock: true } },\n});\n\ndata.items[0].price.amount_minor  // ✅ editor თავად გთავაზობს ველებს\ndata.items[0].prise               // ❌ შეცდომა: ასეთი ველი არ არსებობს\napi.GET('/catalog/prodcts')       // ❌ შეცდომა: ასეთი URL არ არსებობს\n```\n\n**რატომ:** როცა backend-ში რაიმე იცვლება (მაგ. ფასის სტრუქტურა), ტიპები ხელახლა გენერირდება და TypeScript ფრონტში **ყველა ადგილას აჩვენებს შეცდომას**, სადაც ძველი სტრუქტურაა გამოყენებული. ფრონტისა და ბექის შეუსაბამობა ჩანს კოდის წერისას და არა მაშინ, როცა მომხმარებელი გაფუჭებულ გვერდს დაინახავს.\n\n```bash\n# icomers-api:  ქმნის openapi.json-ს (CI ავტომატურად)\npnpm openapi:export\n# icomers-storefront / icomers-admin:  აგენერირებს ტიპებს\npnpm api:generate\n```\n","06-order-flow":"# 06 — Order Flow (Checkout, გადახდა, ჩეკი)\n\n## 1. შეკვეთის სტატუსები\n\n![შეკვეთის სტატუსები](diagrams/order-states.svg)\n\n- დასაშვები გადასვლები აღწერილია **ერთ ადგილას** (`orders/order-state-machine.ts`). ყველა სხვა გადასვლა → `409 INVALID_TRANSITION`.\n- ყოველი გადასვლა იწერება `order_status_history`-ში და outbox-ში (`shop.order.status_changed`).\n\n## 2. Checkout — ნაბიჯ-ნაბიჯ\n\n![Checkout და გადახდა](diagrams/checkout.svg)\n\n### მნიშვნელოვანი დეტალები\n1. **ფასი ყოველთვის სერვერზე ითვლება.** კლიენტიდან მოსული ფასი არასდროს გამოიყენება. `expectedTotalMinor` მხოლოდ შედარებისთვისაა.\n2. **რეზერვაცია ტრანზაქციაშია.** თუ ერთ-ერთ ხაზზე მარაგი არ ჰყოფნის, მთელ ტრანზაქციას უკეთდება rollback → `409 OUT_OF_STOCK` დეტალებით.\n3. **თუ `CreatePayment` ჩავარდა** (Billing მიუწვდომელია): შეკვეთა რჩება `PENDING_PAYMENT`, მომხმარებელი ხედავს „სცადეთ თავიდან“ (`retry-payment`). რეზერვაცია ძალაში რჩება ვადის გასვლამდე.\n4. **Idempotency-Key:** იგივე key-ით მეორე request (ორმაგი დაწკაპუნება, refresh) აბრუნებს იმავე პასუხს და ახალ შეკვეთას არ ქმნის.\n5. **დაბრუნების გვერდი** არ ენდობა URL-ის პარამეტრებს („success=true“). სტატუსს იღებს ჩვენი API-დან: ჯერ REST-ით, შემდეგ ელოდება ცვლილებას SSE-ით. ხელახლა დაკავშირებისას სტატუსს ისევ REST-ით ამოწმებს.\n\n## 3. რეზერვაციის ვადა\n\n- `RESERVATION_TTL` = 15 წუთი (კონფიგურირებადი; Billing-ის გადახდის ვადაზე ოდნავ მეტი უნდა იყოს).\n- Worker-ის cron ყოველ წუთს:\n  ```sql\n  SELECT ... FROM stock_reservations\n  WHERE status = 'ACTIVE' AND expires_at < now()\n  FOR UPDATE SKIP LOCKED\n  ```\n  → `reserved -= qty`, reservation → `RELEASED`, შეკვეთა → `CANCELLED` (reason: `PAYMENT_TIMEOUT`).\n\n### Edge case: გადახდა მოვიდა რეზერვაციის ვადის გასვლის შემდეგ\n1. თუ მარაგი ჯერ კიდევ ხელმისაწვდომია → შეკვეთა აღდგება და ხდება `PAID` (ჩვეულებრივი გზა).\n2. თუ მარაგი აღარ არის → შეკვეთა `PAID`, მაგრამ მოინიშნება როგორც `needs_attention`. ადმინი SSE-ით იღებს გაფრთხილებას და წყვეტს, დაელოდოს მარაგს თუ დააბრუნოს თანხა.\n\n## 4. გაუქმება და Refund\n\n![გაუქმება და Refund](diagrams/refund.svg)\n\n- მარაგი ავტომატურად ბრუნდება მხოლოდ მაშინ, თუ ნივთი ჯერ არ გაცემულა (`PAID` / `PROCESSING`). `COMPLETED`-ის შემდეგ დაბრუნებისას ადმინი ნივთის შემოწმების შემდეგ ხელით აფორმებს `RETURN` მოძრაობას.\n- ნაწილობრივი refund: მხოლოდ admin როლით და მხოლოდ იმ შემთხვევაში, თუ Billing ამას მხარს უჭერს.\n\n## 5. ფისკალური ჩეკი\n\n| სიტუაცია | ქმედება |\n|---|---|\n| `shop.order.paid` | `IssueReceipt` (SALE) |\n| `shop.order.refunded` | `IssueRefundReceipt` (REFUND) |\n| Fiscal მიუწვდომელია | JetStream retry backoff-ით |\n| `max_deliver` ამოიწურა | `fiscal_receipts.status = FAILED`, ადმინს ეგზავნება გაფრთხილება, ჩნდება ღილაკი „თავიდან ცდა“ |\n\nჩეკის გამოწერის მომენტი (გადახდისას თუ გადაცემისას) დამოკიდებულია `fiscal-when` კითხვის პასუხზე, იხ. [03 §3](03-integrations.md#3-fiscal--rsge).\n\n## 6. შეტყობინებები მომხმარებელს (როცა არხი გადაწყდება)\n\n| ივენთი | შეტყობინება |\n|---|---|\n| `shop.order.paid` | „შეკვეთა ICM-000123 მიღებულია“ + ჩეკის ბმული |\n| `status_changed → READY_FOR_PICKUP` | „შეკვეთა მზადაა, შეგიძლიათ წაიღოთ“ + მისამართი/საათები |\n| `status_changed → SHIPPED` | „შეკვეთა გზაშია“ |\n| `shop.order.cancelled` | „შეკვეთა გაუქმდა, თანხა დაგიბრუნდებათ X დღეში“ |\n","07-storefront":"# 07 — Storefront (Next.js)\n\n## 1. ტექნოლოგიები\n- Next.js App Router, React Server Components\n- Tailwind CSS (+ shadcn/ui საბაზისო კომპონენტებისთვის)\n- **next-intl**: ka / en, locale URL-ში\n- API client: `openapi-fetch` + `icomers-api`-ის `openapi.json`-იდან გენერირებული ტიპები\n- Auth: Auth.js (OIDC) ან `openid-client`, BFF pattern (იხ. [03 §1](03-integrations.md#1-identity--oauth2--oidc))\n- ფორმები: react-hook-form + zod\n- Client state: მინიმალური. header-ში კალათის ნივთების რაოდენობა → TanStack Query ან Server Actions + `revalidatePath`\n\n## 2. გვერდები (routes)\n\n| Route | გვერდი | Rendering |\n|---|---|---|\n| `/[locale]` | მთავარი: hero, „აირჩიე შენი დამტენი“, კატეგორიები, featured | ISR (5 წთ + on-demand) |\n| `/[locale]/catalog` | ყველა პროდუქტი + ფილტრები | SSR (ფილტრები URL-შია) |\n| `/[locale]/c/[...slug]` | კატეგორია | ISR + SSR ფილტრებით |\n| `/[locale]/p/[slug]` | პროდუქტის გვერდი | **ISR**, `revalidateTag('product:{id}')` |\n| `/[locale]/chargers` | ბრენდების სია | ISR |\n| `/[locale]/chargers/[brand]` | ბრენდის მოდელები | ISR |\n| `/[locale]/chargers/[brand]/[model]` | ამ მოდელის თავსებადი ნაწილები (**SEO-სთვის ძალიან მნიშვნელოვანი**) | ISR |\n| `/[locale]/search?q=` | ძებნის შედეგები | SSR, `noindex` |\n| `/[locale]/cart` | კალათა | Dynamic |\n| `/[locale]/checkout` | მიღების მეთოდი, კონტაქტი, გადახდის მეთოდი | Dynamic, login აუცილებელია |\n| `/[locale]/checkout/result/[orderId]` | გადახდის შედეგი (SSE ელოდება სტატუსს) | Dynamic |\n| `/[locale]/account` | პროფილი | Dynamic, protected |\n| `/[locale]/account/orders` | შეკვეთები | Dynamic |\n| `/[locale]/account/orders/[id]` | შეკვეთის დეტალები, სტატუსის timeline, ჩეკი | Dynamic |\n| `/[locale]/account/addresses` | მისამართები | Dynamic |\n| `/[locale]/pages/[slug]` | წესები და პირობები, კონფიდენციალურობა, დაბრუნების პოლიტიკა, მიწოდება/გატანა, კონტაქტი | Static |\n| `/api/auth/*` | login / callback / logout (BFF) | Route handlers |\n| `/api/revalidate` | API-დან on-demand revalidation (secret-ით) | Route handler |\n| `/sitemap.xml`, `/robots.txt` | | generated |\n\n> ⚖️ **სამართლებრივი გვერდები** (წესები, კონფიდენციალურობა, დაბრუნების უფლება) ონლაინ ვაჭრობისთვის აუცილებელია.\n\n:::question id=\"biz-legal\" to=\"იურისტი / ბიზნესი\"\nვინ მოგვაწვდის სამართლებრივ ტექსტებს (წესები და პირობები, კონფიდენციალურობის პოლიტიკა, დაბრუნების პოლიტიკა) ქართულად და ინგლისურად? როდისთვის?\n:::\n\n\n## 3. „ჩემი დამტენი“ (თავსებადობის UX)\n\n1. მთავარ გვერდზე და header-ში: **„აირჩიე შენი დამტენი“** → ბრენდი → მოდელი (სურათებით).\n2. არჩეული მოდელი ინახება **cookie-ში** (`my_charger=<modelId>`); ავტორიზებული მომხმარებლისთვის მომავალში შესაძლებელია პროფილშიც შენახვა (რამდენიმე დამტენი).\n3. როცა მოდელი არჩეულია:\n   - კატალოგი ავტომატურად იფილტრება (chip: „ნაჩვენებია: Wallbox Pulsar Plus ✕“)\n   - პროდუქტის ბარათზე badge: ✅ „ერგება შენს დამტენს“ / ⚠️ „არ ერგება“\n   - პროდუქტის გვერდზე: სრული სია „თავსებადია შემდეგ მოდელებთან“\n4. თუ მომხმარებელმა თავისი მოდელი ვერ იპოვა → ფორმა/ბმული „ვერ იპოვე? დაგვიკავშირდი“.\n\n## 4. ფილტრები (კატალოგი)\n\n| ფილტრი | UI |\n|---|---|\n| დამტენის მოდელი | ზემოთ ცალკე (იხ. §3) |\n| კატეგორია | ხე / chips |\n| ფასი | range slider |\n| მარაგშია | toggle |\n| დინამიური ატრიბუტები (კონექტორი, დენი, სიგრძე...) | checkbox-ები `/catalog/filters`-იდან, რაოდენობებით |\n| სორტირება | პოპულარული, ფასი ↑↓, ახალი |\n\nყველა ფილტრი **URL-შია** (`?category=cables&in_stock=true&attr[connector]=Type+2`), რათა ბმულის გაზიარება და უკან დაბრუნება სწორად მუშაობდეს.\n\n## 5. i18n\n\n- `ka` ნაგულისხმევია: `/` → `/ka`.\n- UI ტექსტები: `messages/ka.json`, `messages/en.json`.\n- პროდუქტის კონტენტი API-დან მოდის `Accept-Language`-ით.\n- თუ ინგლისური თარგმანი აკლია → ნაჩვენებია ქართული (fallback API-ის მხარესაა).\n- ფასის ფორმატი: `Intl.NumberFormat('ka-GE', { style: 'currency', currency: 'GEL' })`.\n- შრიფტი უნდა უჭერდეს მხარს ქართულ ანბანს (მაგ. Noto Sans Georgian, FiraGO, BPG სერია).\n\n## 6. SEO\n\n- `generateMetadata`: title, description, canonical, **hreflang** (`ka`, `en`, `x-default`)\n- Open Graph სურათები პროდუქტებისთვის\n- JSON-LD: `Product` (`offers`, `price`, `priceCurrency: GEL`, `availability`), `BreadcrumbList`, `Organization`\n- `sitemap.xml`: პროდუქტები, კატეგორიები, დამტენის მოდელების გვერდები, ორივე ენაზე\n- ძებნისა და ფილტრების კომბინაციების გვერდები: `noindex` ან canonical მთავარ კატეგორიაზე\n- სურათები: `next/image`, WebP/AVIF, სწორი `sizes`\n\n## 7. Caching და revalidation\n\n![Storefront-ის განახლება](diagrams/revalidation.svg)\n\n- `fetch(..., { next: { tags: ['product:123'] } })` თითოეულ API call-ზე.\n- **ფასი და მარაგი** პროდუქტის გვერდზე ISR-იდან მოდის, მაგრამ კალათასა და checkout-ში **ყოველთვის თავიდან** მოწმდება.\n\n## 8. ხარისხი\n\nმიზნები: Core Web Vitals-ის „კარგი“ ზონა (LCP < 2.5s), კლავიატურით ნავიგაცია და საკმარისი კონტრასტი (WCAG AA). ანალიტიკა ირთვება მხოლოდ cookie consent-ის შემდეგ.\n\n:::question id=\"biz-analytics\" to=\"ბიზნესი / მარკეტინგი\"\nრომელი ანალიტიკა გამოვიყენოთ: **GA4**, **Plausible**, თუ სხვა? საჭიროა თუ არა Meta Pixel ან სხვა სარეკლამო tracking?\n:::\n\n","08-admin-panel":"# 08 — Admin Panel (Next.js)\n\n## 1. ზოგადი\n- ცალკე Next.js აპი, ცალკე domain (`admin.<domain>`), SEO არ სჭირდება (`noindex`)\n- Auth: იგივე Identity, client `icomers-admin`. შესვლა შესაძლებელია მხოლოდ ადმინის როლით, სხვა შემთხვევაში ნაჩვენებია 403 გვერდი\n- UI: **shadcn/ui** + Tailwind, **TanStack Table** (სორტირება, ფილტრები, server-side pagination), **TanStack Query** (cache, mutations, optimistic updates)\n- ფორმები: react-hook-form + zod\n- ენა: ძირითადად ქართული (en მოგვიანებით, საჭიროების შემთხვევაში)\n- Live: `EventSource(\"/api/admin/events\")`. Next.js (BFF) მას Shop API-ის `/admin/events/stream`-ზე გადაამისამართებს. წესები: [SSE](02-architecture.md#6-sse-live-განახლებები)\n\n## 2. მოდულები\n\n### 2.1 Dashboard\n- დღევანდელი / კვირის / თვის მონაცემები: გაყიდვები (₾), შეკვეთების რაოდენობა, საშუალო კალათა\n- **Live feed (SSE):** ახალი შეკვეთები და გადახდები. ახალი გადახდილი შეკვეთისას — ხმოვანი/ვიზუალური შეტყობინება\n- გაფრთხილებები: დაბალი მარაგი, ჩავარდნილი ფისკალური ჩეკები, `needs_attention` შეკვეთები\n- ყველაზე გაყიდვადი პროდუქტები\n\n### 2.2 შეკვეთები\n- სია: ფილტრები (სტატუსი, თარიღი, მიღების მეთოდი), ძებნა (ნომერი, ტელეფონი, სახელი)\n- Live განახლება: ახალი შეკვეთა სიაში ავტომატურად ჩნდება\n- დეტალები: ხაზები, ჯამი, კონტაქტი, მისამართი, გადახდის სტატუსი, ჩეკის სტატუსი, სტატუსის timeline\n- ქმედებები: სტატუსის შეცვლა (მხოლოდ დასაშვები გადასვლები ჩანს), გაუქმება, refund, შიდა შენიშვნა, ბეჭდვა (picking list / ქვითარი)\n\n### 2.3 პროდუქტები\n- სია: სურათი, SKU, სახელი, ფასი, მარაგი, სტატუსი; bulk ქმედებები (გააქტიურება, დაარქივება)\n- რედაქტორი ტაბებით:\n  - **ძირითადი:** SKU, slug, კატეგორია, ფასი, ძველი ფასი, სტატუსი, featured\n  - **კონტენტი:** სახელი და აღწერა **ka / en** გვერდიგვერდ; SEO ველები\n  - **სურათები:** drag & drop ატვირთვა (presigned S3), რიგის შეცვლა, alt ტექსტი\n  - **მახასიათებლები:** დინამიური ატრიბუტები\n  - **თავსებადობა:** ბრენდი → მოდელების multi-select, „უნივერსალური“ checkbox, შენიშვნა მოდელზე\n  - **მარაგი:** მიმდინარე რაოდენობა + მოძრაობების ისტორია\n- Import/Export: CSV/XLSX (კატალოგის საწყისი შევსებისთვის ძალიან საჭიროა)\n\n### 2.4 კატეგორიები\n- ხის რედაქტორი (რიგის შეცვლა drag & drop-ით), თარგმანები\n\n### 2.5 თავსებადობა (დამტენები)\n- ბრენდები და მოდელები: CRUD, სურათები\n- **მოდელის გვერდი:** ყველა თავსებადი პროდუქტი + „დაამატე პროდუქტები“ ძებნით (bulk მიბმა)\n- **მატრიცის ხედი** (სურვილისამებრ): პროდუქტები × მოდელები, checkbox-ებით\n\n### 2.6 მარაგი\n- სია: ხელმისაწვდომი / დაკავებული / სულ, დაბალი მარაგის ფილტრი\n- ქმედებები: **შემოსვლა** (RECEIPT), **კორექტირება** (ADJUSTMENT, მიზეზი სავალდებულოა), **დაზიანება** (DAMAGE)\n- ისტორია: ვინ, როდის, რამდენი, რატომ\n\n### 2.7 მომხმარებლები\n- სია, ძებნა, შეკვეთების ისტორია, მისამართები\n- რედაქტირება შეზღუდულია: ძირითადი მონაცემები Identity-შია\n\n### 2.8 სისტემა (მხოლოდ admin)\n- Audit log: ფილტრები ადმინის, ობიექტისა და თარიღის მიხედვით\n- Failed events: სია + „თავიდან გაგზავნა“\n- პარამეტრები: გატანის მისამართი და საათები, მიწოდების ფასი, რეზერვაციის TTL, low-stock ზღვარი\n\n## 3. როლები და უფლებები\n\n| ქმედება | admin | manager | content_editor | warehouse |\n|---|:-:|:-:|:-:|:-:|\n| Dashboard | ✅ | ✅ | ✅ | ✅ |\n| შეკვეთების ნახვა | ✅ | ✅ | ❌ | ✅ |\n| სტატუსის შეცვლა | ✅ | ✅ | ❌ | ✅ (PROCESSING → READY / SHIPPED) |\n| გაუქმება | ✅ | ✅ | ❌ | ❌ |\n| Refund | ✅ | ❌ | ❌ | ❌ |\n| პროდუქტები / კატეგორიები / თავსებადობა | ✅ | 👁 | ✅ | 👁 |\n| ფასის შეცვლა | ✅ | ✅ | ✅ | ❌ |\n| მარაგის მოძრაობა | ✅ | ❌ | ❌ | ✅ |\n| მომხმარებლები | ✅ | ✅ | ❌ | ❌ |\n| Import | ✅ | ❌ | ❌ | ❌ |\n| Audit log, სისტემა, პარამეტრები | ✅ | ❌ | ❌ | ❌ |\n\n👁 = მხოლოდ ნახვა\n\n- როლები მოდის Identity-ის ტოკენის `roles` claim-იდან.\n- **შემოწმება ხდება Nest-ში** (`@Roles()` + `RolesGuard`). Admin UI ღილაკებს მხოლოდ მალავს — ეს უსაფრთხოების მექანიზმი არ არის.\n- ყოველი ქმედება, რომელიც მონაცემებს ცვლის, → `admin_audit_log` (Nest interceptor-ით ავტომატურად).\n","09-repo-and-dev":"# 09 — Repo სტრუქტურა და დეველოპმენტი\n\n## 1. რეპოზიტორიები\n\nკოდი იყოფა **სამ ცალკე რეპოდ**, როგორც კომპანიის სხვა პროექტებში (მაგ. ev-charger-admin). თითოეულს თავისი Dockerfile, CI და deploy აქვს.\n\n| რეპო | რა არის | usectl აპები |\n|---|---|---|\n| `icomers-api` | NestJS: REST API, worker, მიგრაციები | `api`, `worker`, `migrate` |\n| `icomers-storefront` | Next.js: საჯარო საიტი | `storefront` |\n| `icomers-admin` | Next.js: ადმინ-პანელი | `admin` |\n\nდოკუმენტაცია (ეს ფოლდერი) ცალკე ინახება; დამტკიცების შემდეგ კოდის რეპოები მასზე მიუთითებენ.\n\n### `icomers-api`\n```\nicomers-api/\n├─ src/\n│  ├─ modules/            # catalog, cart, orders, payments, … (იხ. არქიტექტურა)\n│  ├─ infra/              # prisma, nats, outbox, grpc, storage\n│  ├─ contracts/          # NATS ივენთების სქემები (zod)\n│  ├─ main.ts             # HTTP API\n│  └─ worker.ts           # Worker\n├─ proto/                 # კომპანიის სერვისების .proto კონტრაქტები + გენერირებული კოდი\n├─ prisma/\n│  ├─ schema.prisma\n│  ├─ migrations/\n│  └─ seed.ts             # სატესტო კატალოგი, ბრენდები, მოდელები\n├─ dev/                   # NATS-ის setup, Billing / Fiscal / Identity mock-ები\n├─ openapi.json           # API-ს აღწერა (CI განაახლებს); ფრონტები მისგან აგენერირებენ client-ს\n├─ docker-compose.yml     # ლოკალური ინფრასტრუქტურა\n├─ Dockerfile\n└─ .env.example\n```\n\n### `icomers-storefront` და `icomers-admin`\n```\nicomers-storefront/\n├─ src/\n│  ├─ app/                # Next.js გვერდები\n│  ├─ components/\n│  ├─ api/schema.ts       # API-ს ტიპები, გენერირებული openapi.json-იდან\n│  └─ messages/           # ka.json, en.json\n├─ Dockerfile\n└─ .env.example\n```\nადმინს იგივე სტრუქტურა აქვს.\n\n### როგორ იღებს ფრონტი API-ს ტიპებს\n`icomers-api`-ის CI ყოველი ცვლილებისას განაახლებს `openapi.json`-ს. ფრონტის რეპოში ერთი ბრძანება აგენერირებს ტიპებს:\n```bash\npnpm api:generate   # openapi-typescript <api-ს openapi.json> -o src/api/schema.ts\n```\nწყარო შეიძლება იყოს ლოკალური API (`http://localhost:4000/docs-json`) ან staging. თუ backend-ში რამე შეიცვალა, ტიპების განახლების შემდეგ TypeScript ფრონტში ყველა შეუსაბამო ადგილს აჩვენებს.\n\n## 2. ლოკალური გარემო\n\n`icomers-api`-ის `docker-compose.yml` უშვებს ინფრასტრუქტურას. აპები ლოკალურად ეშვება `pnpm dev`-ით, თითოეული თავის რეპოში:\n\n| სერვისი | Image | Port |\n|---|---|---|\n| postgres | `postgres:16` | 5432 |\n| nats | `nats:2` (`-js` JetStream-ით) | 4222, 8222 (monitoring) |\n| minio | `minio/minio` (ლოკალური S3) | 9000, 9001 (console) |\n| mailpit | `axllent/mailpit` (email-ის ტესტირება) | 1025, 8025 |\n| identity | Keycloak ან თქვენი Identity-ის dev ინსტანსი | 8080 |\n\n### Mock-ები\nსანამ არსებული სერვისების dev ინსტანსებზე წვდომა არ გვაქვს:\n- `PAYMENT_GATEWAY=mock`: `CreatePayment` აბრუნებს ლოკალურ „ბანკის“ გვერდს (`/dev/fake-bank`), რომელზეც „გადახდა“ / „უარყოფა“ ღილაკები აქვეყნებს `billing.payment.*` ივენთს NATS-ში\n- `FISCAL_GATEWAY=mock`: აბრუნებს ჩეკის ყალბ ნომერს\n- Identity: ლოკალური Keycloak realm (`dev/keycloak/realm.json`) იგივე როლებით\n\n### ბრძანებები\n```bash\n# icomers-api\ndocker compose up -d\ncp .env.example .env\npnpm install\npnpm prisma migrate dev\npnpm prisma db seed\npnpm dev            # api :4000\npnpm dev:worker     # worker\n\n# icomers-storefront / icomers-admin\npnpm install\npnpm dev            # storefront :3000 / admin :3001\n```\n\n## 3. კონფიგურაცია და კოდის წესები\n\n<details>\n<summary>Environment ცვლადები</summary>\n\n| ცვლადი | მაგალითი |\n|---|---|\n| `DATABASE_URL` | `postgresql://icomers:icomers@localhost:5432/icomers` |\n| `NATS_URL` | `nats://localhost:4222` |\n| `OIDC_ISSUER` | `https://id.example.ge/realms/main` |\n| `OIDC_AUDIENCE` | `icomers-api` |\n| `GRPC_BILLING_URL` / `GRPC_FISCAL_URL` / `GRPC_IDENTITY_URL` | `billing:50051` |\n| `PAYMENT_GATEWAY` / `FISCAL_GATEWAY` | `grpc` / `mock` |\n| `S3_ENDPOINT`, `S3_BUCKET`, `S3_ACCESS_KEY`, `S3_SECRET_KEY`, `S3_PUBLIC_URL` | |\n| `RESERVATION_TTL_MINUTES` | `15` |\n| `STOREFRONT_URL`, `STOREFRONT_REVALIDATE_SECRET` | |\n| `CORS_ORIGINS` | `http://localhost:3000,http://localhost:3001` |\n| `LOG_LEVEL` | `info` |\n\nNext.js აპებისთვის: `API_URL`, `OIDC_ISSUER`, `OIDC_CLIENT_ID`, `OIDC_CLIENT_SECRET`, `SESSION_SECRET`, `NEXT_PUBLIC_SITE_URL`, `REVALIDATE_SECRET`.\n\nConfig ვალიდირდება გაშვებისას (zod / `@nestjs/config`). არასწორი config-ის შემთხვევაში აპი არ გაეშვება.\n\n</details>\n\n<deta
