ils>\n<summary>კოდის წესები</summary>\n\n- TypeScript `strict: true`\n- ESLint + Prettier, `lint-staged` + `husky` pre-commit\n- Conventional Commits (`feat:`, `fix:`, `docs:`...)\n- ბიზნეს-ლოგიკა service-ებშია, controller-ები თხელია\n- ყველა DTO აღწერილია `@nestjs/swagger` დეკორატორებით, რომ OpenAPI სრული იყოს\n- ფული ინახება მხოლოდ `*_minor` integer-ებით; ფორმატირება ხდება ერთი დამხმარე ფუნქციით\n\n</details>\n\n## 4. ტესტები\n\n| დონე | ინსტრუმენტი | რას ვტესტავთ |\n|---|---|---|\n| Unit | Vitest / Jest | ფასის გამოთვლა, დღგ, state machine, ვალიდაცია |\n| Integration | Jest + **Testcontainers** (Postgres, NATS) | checkout ტრანზაქცია, მარაგის race condition (პარალელური request-ები), outbox relay, idempotent consumers |\n| Contract | gRPC mock სერვერები | Billing/Fiscal adapter-ები |\n| E2E | **Playwright** | კატალოგი → კალათა → checkout → (mock) გადახდა → შეკვეთა PAID; admin: სტატუსის შეცვლა |\n\n**სავალდებულო ტესტი:** 10 პარალელური checkout ერთსა და იმავე ბოლო ერთეულზე → წარმატებით მხოლოდ 1 უნდა დასრულდეს.\n\n## 5. CI\n\nყოველ რეპოს საკუთარი CI აქვს:\n\n| ეტაპი | რა მოწმდება |\n|---|---|\n| Pull request | lint, typecheck, ტესტები, build. `icomers-api`-ში დამატებით: Prisma სქემის შემოწმება და OpenAPI-ის breaking change-ებზე გაფრთხილება |\n| Merge `develop`-ში | usectl ავტომატურად აწყობს და აახლებს staging-ს |\n| Merge `main`-ში | production |\n","10-deployment":"# 10 — Deployment (usectl)\n\nმაღაზია ეშვება **usectl**-ზე. GitHub-ზე push-ის შემდეგ usectl თავად აწყობს image-ს, უშვებს მიგრაციებს და აახლებს აპებს. ბაზა, NATS, S3, domain-ები და მონიტორინგი usectl-შივეა.\n\n## 1. აპები\n\nყველა აპი ერთ usectl **Machine**-შია (`icomers`). თითოეული აპი თავისი რეპოდან ეშვება.\n\n| App | რეპო | ტიპი (kind) | რას აკეთებს | Port | Domain |\n|---|---|---|---|---|---|\n| `storefront` | `icomers-storefront` | `web` | საჯარო საიტი | 3000 | `shop.<domain>` |\n| `admin` | `icomers-admin` | `web` | ადმინ-პანელი | 3001 | `admin.<domain>` |\n| `api` | `icomers-api` | `web` | REST API + SSE | 4000 | `api.<domain>` |\n| `worker` | `icomers-api` | `worker` | NATS ივენთები, outbox, ჩეკები, cron | — | — (`--private`) |\n| `migrate` | `icomers-api` | `release` | `prisma migrate deploy`, ყოველი deploy-ის წინ | — | — |\n\n- **`release`** აპი ყოველ deploy-ზე **web აპების განახლებამდე** ეშვება. ამიტომ ახალი კოდი ყოველთვის უკვე განახლებულ ბაზასთან მუშაობს.\n- **`worker`**-ს HTTP ტრაფიკი არ აქვს და domain არ სჭირდება.\n- Deploy ავტომატურია GitHub push-ზე (`--auto-deploy`). ხელით: `usectl machines deploy icomers`.\n\n## 2. Dockerfile-ები\n\nყოველ რეპოს root-ში თავისი `Dockerfile` აქვს და usectl მას ავტომატურად იყენებს.\n\n| რეპო | Image | usectl აპები |\n|---|---|---|\n| `icomers-storefront` | Next.js `standalone` build | `storefront` |\n| `icomers-admin` | Next.js `standalone` build | `admin` |\n| `icomers-api` | NestJS build + Prisma | `api` (ნაგულისხმევი ბრძანება), `worker` (`--command \"node dist/worker.js\"`), `migrate` (`--command \"npx prisma migrate deploy\"`) |\n\nმეხსიერების ლიმიტი ერთ pod-ზე მაქსიმუმ 1 GiB-ია, რაც ამ აპებისთვის საკმარისია.\n\n<details>\n<summary>Dockerfile-ების საწყისი ვერსია</summary>\n\n`icomers-api`:\n```dockerfile\nFROM node:24-alpine AS build\nRUN corepack enable\nWORKDIR /app\nCOPY package.json pnpm-lock.yaml ./\nRUN pnpm install --frozen-lockfile\nCOPY . .\nRUN pnpm prisma generate && pnpm build && pnpm prune --prod\n\nFROM node:24-alpine\nWORKDIR /app\nENV NODE_ENV=production\nCOPY --from=build /app/node_modules ./node_modules\nCOPY --from=build /app/dist ./dist\nCOPY --from=build /app/prisma ./prisma\nUSER node\nEXPOSE 4000\nCMD [\"node\", \"dist/main.js\"]\n```\n\n`icomers-storefront` / `icomers-admin` (`next.config.ts`-ში `output: 'standalone'`):\n```dockerfile\nFROM node:24-alpine AS build\nRUN corepack enable\nWORKDIR /app\nCOPY package.json pnpm-lock.yaml ./\nRUN pnpm install --frozen-lockfile\nCOPY . .\nRUN pnpm build\n\nFROM node:24-alpine\nWORKDIR /app\nENV NODE_ENV=production\nCOPY --from=build /app/.next/standalone ./\nCOPY --from=build /app/.next/static ./.next/static\nCOPY --from=build /app/public ./public\nUSER node\nEXPOSE 3000\nCMD [\"node\", \"server.js\"]\n```\n\n</details>\n\n## 3. Addon-ები\n\n| რა | usectl addon | აპს ავტომატურად ეძლევა |\n|---|---|---|\n| **PostgreSQL** | Postgres. Production-ში `dedicated`, ავტომატური ბექაპით | `DATABASE_URL` |\n| **NATS JetStream** | Billing-ის NATS-თან კავშირი (იხ. კითხვა `platform-company-services`). JetStream მხოლოდ `dedicated` NATS-ზე მუშაობს | `NATS_URL`, `NATS_USER`, `NATS_PASSWORD` |\n| **S3** | S3 addon (managed). პროდუქტის სურათებისთვის public CDN | `S3_ENDPOINT`, `S3_BUCKET`, `S3_ACCESS_KEY`, `S3_SECRET_KEY`, `S3_REGION` |\n| **შეცდომები** | GlitchTip (Sentry-თავსებადი) | `SENTRY_DSN` |\n\n- addon-ი თითოეულ აპს ცალკე უნდა მიუერთდეს (`attach-addon`). `DATABASE_URL` სჭირდება `api`-ს, `worker`-ს და `migrate`-ს.\n- addon-ის ცვლადები ხელით არ ემატება.\n- S3 client-ში საჭიროა `forcePathStyle: true`.\n\n## 4. SSE usectl-ზე\n\nტრაფიკის გზა: ბრაუზერი → **Cloudflare** → **Traefik** → `api`. SSE კავშირი დიდხანს რჩება ღია. მის შესანარჩუნებლად:\n- სერვერი ყოველ 15 წამში აგზავნის heartbeat-ს. Cloudflare უმოქმედო კავშირს ~100 წამში თიშავს, heartbeat კი ამას თავიდან აგვაცილებს.\n- პასუხს აქვს `Cache-Control: no-cache` და `X-Accel-Buffering: no`.\n- კავშირის გაწყვეტისას კლიენტი ხელახლა უერთდება და REST-ით ამოწმებს მონაცემებს (იხ. [SSE-ის წესები](02-architecture.md#sse-ის-წესები)).\n\nusectl-ის დოკუმენტაცია SSE-ს ცალკე არ აღწერს, ამიტომ ეს staging-ზე უნდა შემოწმდეს (კითხვა `usectl-sse`).\n\n## 5. Env ცვლადები და secrets\n\n- **Machine-ის დონეზე** საერთო ცვლადები (მაგ. `OIDC_ISSUER`), **აპის დონეზე** კი მხოლოდ ერთი აპის ცვლადები (მაგ. `API_URL` ფრონტებისთვის).\n- საიდუმლოები (`OIDC_CLIENT_SECRET`, `SESSION_SECRET`) მონიშნულია **protected**-ად: მათი წაკითხვა შეუძლებელია, მხოლოდ ჩაწერა.\n- `NEXT_PUBLIC_*` ცვლადები Next.js-ს build-ის დროს სჭირდება: `usectl vars expose … --build-target build_arg`.\n- ცვლადის შეცვლა ახალ deploy-ს მოითხოვს.\n\nცვლადების სრული სია: [Repo & Dev](09-repo-and-dev.md#3-კონფიგურაცია-და-კოდის-წესები).\n\n## 6. Domain-ები\n\nDNS-ში `CNAME → custom.usectl.com`, შემდეგ `usectl domains verify` და `attach-app` შესაბამის აპზე. TLS სერტიფიკატს Cloudflare ავტომატურად გასცემს.\n\n`*.usectl.com` მისამართზე (staging-ისთვის) გამოიყენება მხოლოდ **ერთდონიანი** სახელი, მაგ. `icomers-api.usectl.com`. `api.icomers.usectl.com`-ის მსგავსი მრავალდონიანი სახელისთვის Cloudflare სერტიფიკატს ვერ გასცემს და ბრაუზერი აჩვენებს `ERR_SSL_VERSION_OR_CIPHER_MISMATCH`-ს.\n\n## 7. გარემოები\n\n| გარემო | სად | Branch | Billing / Fiscal |\n|---|---|---|---|\n| local | docker-compose | — | mock |\n| staging | Machine group `stage` (ცალკე namespace და ცალკე addon-ები) | `develop` | TBC / BOG sandbox, test |\n| production | Machine `icomers` | `main` | live |\n\nPR preview გარემოები თავიდან გამორთულია: ისინი მშობლის ბაზას იზიარებენ და მიგრაციებმა შეიძლება staging-ის ბაზა შეცვალონ.\n\n## 8. Health და მასშტაბირება\n\n| Endpoint | რას ამოწმებს |\n|---|---|\n| `/health/live` | პროცესი ცოცხალია |\n| `/health/ready` | Postgres და NATS კავშირი. კომპანიის მიკროსერვისები არ მოწმდება, რათა მათი დროებითი გათიშვისას კატალოგი მაინც მუშაობდეს |\n\n- `storefront` და `api`: 2+ replica, ავტოსკალირება (usectl მხოლოდ web აპებს ასკალირებს).\n- `worker`: 1–2 replica. Outbox რამდენიმე replica-ზეც უსაფრთხოდ მუშაობს.\n- `SIGTERM`-ზე აპი ახალ მოთხოვნებს აღარ იღებს, ხურავს SSE კავშირებს და ასრულებს მიმდინარე ივენთებს.\n\n## 9. მონიტორინგი\n\nყველაფერი usectl-შია ჩაშენებული:\n\n| რა | სად |\n|---|---|\n| ლოგები | Loki: `usectl machines logs icomers api -f` |\n| Metrics | მოთხოვნები, p95, 5xx, CPU და მეხსიერება. ჩვენი `/metrics` (outbox backlog, failed events) — მას შემდეგ, რაც usectl მის მხარდაჭერას ჩართავს |\n| Tracing | OpenTelemetry → Tempo (HTTP, gRPC და NATS) |\n| შეცდომები | GlitchTip (`SENTRY_DSN`), ფრონტიც და ბექიც |\n| Alert-ები | Slack ან webhook (email არ მუშაობს): 5xx %, p95, crash loop, OOM, ჩავარდნილი ჩეკები |\n\n## 10. ბექაპები და rollback\n\n- **Postgres:** `dedicated` addon-ზე ყოველდღიური `pg_dump`, 30 დღის შენახვით.\n- **Rollback:** `usectl machines rollback icomers <deployment>`, ან ავტომატური, თუ deploy-ის შემდეგ 5xx გაიზარდა. Rollback ბაზას უკან არ აბრუნებს, ამიტომ მიგრაციები ყოველთვის უკუთავსებადად იწერება: ჯერ ემატება ახალი სვეტი, ძველი კი მოგვიანებით იშლება.\n\n## 11. Platform-თან დასაზუსტებელი\n\n:::question id=\"platform-company-services\" to=\"Platform / Backend გუნდი\"\nBilling, Fiscal და Identity usectl-ზეა? usectl-ის Machine-ები ერთმანეთისგან იზოლირებულია და შიდა IP-ებზე წვდომა დაბლოკილია. როგორ მივწვდეთ ამ სერვისებს gRPC-ით და Billing-ის NATS-ს (მაგ. addon-ის გაზიარებით, `--shared-from`)?\n:::\n\n:::question id=\"usectl-sse\" to=\"Platform (usectl)\"\nSSE (დიდხანს ღია HTTP კავშირი, heartbeat ყოველ 15 წამში) Cloudflare-სა და Traefik-ზე შეზღუდვის გარეშე მუშაობს? როგორ კონფიგურირდება health check-ების path და port?\n:::\n\n:::question id=\"platform-envs\" to=\"Platform / ბიზნესი\"\nრა domain-ები გამოვიყენოთ (`shop.…`, `admin.…`, `api.…`)? Staging-ისთვის Machine group `stage` გამოდგება, თუ ცალკე Machine ჯობია? Production-ის ბაზისთვის ყოველდღიური ბექაპი საკმარისია?\n:::\n","11-security":"# 11 — Security\n\n## Auth\n- ტოკენები მხოლოდ **httpOnly, Secure, SameSite=Lax** cookie-ში (BFF). `localStorage` აკრძალულია\n- Nest ამოწმებს JWT-ს: ხელმოწერა (JWKS), `iss`, `aud`, `exp`\n- Admin endpoint-ები: `JwtAuthGuard` + `RolesGuard` **ყველა** `/admin/*` route-ზე (global guard + `@Public()` გამონაკლისები)\n- Session-ის ხანგრძლივობა admin-ში უფრო მოკლეა\n\n## მონაცემები და ბიზნეს-ლოგიკა\n- **ფასი, დღგ და ჯამი მხოლოდ სერვერზე ითვლება**\n- რაოდენობის ვალიდაცია (`1..99`), მარაგის შემოწმება ტრანზაქციაში\n- შეკვეთა/მისამართი მხოლოდ მფლობელს უჩანს (ყოველ query-ში `customer_id = currentUser`)\n- გადახდის სტატუსი მხოლოდ Billing-ის ივენთიდან იცვლება, არასდროს ბრაუზერის redirect-იდან\n- ID-ები uuid-ია; შეკვეთის ნომრით საჯარო წვდომა არ არსებობს\n\n## Web\n- CSRF: SameSite cookie + Origin/Referer შემოწმება mutation-ებზე BFF-ში\n- CORS: მხოლოდ ჩვენი domain-ები\n- Security headers: CSP, HSTS, `X-Content-Type-Options`, `Referrer-Policy`, `frame-ancestors 'none'`\n- პროდუქტის აღწერის rich text: sanitize (XSS)\n- ფაილის ატვირთვა: მხოლოდ presigned URL, content-type და ზომის ლიმიტი, მხოლოდ სურათები\n- Rate limiting (იხ. [05 §5](05-api.md#admin-sse-ფორმატი))\n- Import (CSV/XLSX): ზომის ლიმიტი, ვალიდაცია ხაზ-ხაზ, formula injection-ისგან დაცვა export-ში\n\n## Service-to-service\n- gRPC: mTLS ან service token (იხ. კითხვა `platform-s2s-auth`)\n- NATS: საკუთარი user/credentials; უფლებები: publish მხოლოდ `shop.>`-ზე, subscribe მხოლოდ საჭირო `billing.*` subject-ებზე\n- `/api/revalidate`: shared secret\n\n## პერსონალური მონაცემები\n- PII: სახელი, ტელეფონი, email, მისამართი. ლოგებში **არ იწერება** (pino redact)\n- კონფიდენციალურობის პოლიტიკა + cookie consent (ანალიტიკისთვის)\n- მომხმარებლის მონაცემების წაშლის მოთხოვნა: შეკვეთები ანონიმიზირდება (ფისკალური/ბუღალტრული ვალდებულებების გამო მთლიანად არ იშლება)\n\n## Audit\n- Admin-ის ყველა ცვლილება → `admin_audit_log` (ვინ, რა, როდის, diff, IP)\n- Audit log-ში დაშვებულია მხოლოდ INSERT, ჩანაწერების რედაქტირება შეუძლებელია\n\n## Dependencies\n- `pnpm audit` / Renovate / Dependabot\n- Docker image: non-root user, მინიმალური base image, სკანირება (Trivy)\n","12-roadmap":"# 12 — Roadmap და ღია კითხვები\n\n## ეტაპები\n\n### ეტაპი 0 — საფუძველი\n- [ ] სამი რეპო: `icomers-api`, `icomers-storefront`, `icomers-admin` (TS, ESLint, Prettier)\n- [ ] docker-compose: Postgres, NATS, MinIO, Keycloak (dev)\n- [ ] NestJS skeleton: config, logging, health, Prisma, OpenAPI\n- [ ] Next.js storefront + admin skeleton, next-intl, Tailwind, shadcn/ui\n- [ ] Auth: OIDC login (BFF) ორივე აპში, JWT guard + roles Nest-ში\n- [ ] CI: lint, typecheck, test, build\n- [ ] Dockerfile-ები + პირველი deploy staging-ზე (usectl)\n- [ ] **proto ფაილების მიღება** Identity / Billing / Fiscal-ისთვის\n\n### ეტაპი 1 — კატალოგი და თავსებადობა\n- [ ] DB სქემა: categories, products, translations, images, attributes, charger brands/models, compatibility, inventory\n- [ ] Admin: კატეგორიები, პროდუქტები (ka/en), სურათები (S3), თავსებადობა, მარაგი\n- [ ] Admin: CSV/XLSX import\n- [ ] API: catalog, filters, search, compatibility\n- [ ] Storefront: მთავარი, კატალოგი, კატეგორია, პროდუქტი, „ჩემი დამტენი“, ძებნა\n- [ ] SEO: metadata, hreflang, sitemap, JSON-LD\n- [ ] ISR + on-demand revalidation\n\n### ეტაპი 2 — კალათა, checkout, გადახდა\n- [ ] კალათა (guest + user, merge)\n- [ ] Checkout: preview, რეზერვაცია, idempotency\n- [ ] Billing adapter (gRPC) + mock\n- [ ] NATS: billing ივენთების consumer, outbox, inbox\n- [ ] რეზერვაციის ვადის cron\n- [ ] Storefront: checkout, შედეგის გვერდი (SSE), ანგარიში, შეკვეთები, მისამართები\n- [ ] Admin: შეკვეთები, სტატუსები, გაუქმება, refund\n\n### ეტაპი 3 — ფისკალიზაცია, live, შეტყობინებები\n- [ ] Fiscal adapter + consumer, retry, FAILED სტატუსის მართვა\n- [ ] Admin dashboard + SSE live feed\n- [ ] Email/SMS შეტყობინებები (არხის შერჩევის შემდეგ)\n- [ ] Audit log, failed events UI\n\n### ეტაპი 4 — გაშვებისთვის მზადება\n- [ ] E2E ტესტები, race condition ტესტები, load test კატალოგზე\n- [ ] Security review, headers, rate limits\n- [ ] Observability: metrics, alerts, backups\n- [ ] სამართლებრივი გვერდები, cookie consent, ანალიტიკა\n- [ ] TBC/BOG production მონაცემები, Fiscal production\n- [ ] კატალოგის შევსება (import)\n- [ ] 🚀 გაშვება\n\n### მომავალი\n- B2B: კომპანიები, ფასების სიები, ინვოისით გადახდა, საიდენტიფიკაციო კოდი ჩეკზე\n- კურიერულ სერვისებთან ინტეგრაცია\n- პრომო-კოდები, ფასდაკლებები\n- რამდენიმე საწყობი\n- ERP / ბუღალტერიასთან სინქრონიზაცია\n- შეფასებები, wishlist, „შემატყობინე, როცა მარაგში გამოჩნდება“\n- „ჩემი დამტენები“ პროფილში\n\n---\n\n## ღია კითხვები\n\nყველა ღია კითხვა დოკუმენტაციის შესაბამის თავშია, პასუხის ველთან ერთად. ქვემოთ მოცემულია მათი სრული სია და სტატუსი.\n\n:::questions-index\n:::\n\n### ზოგადი კითხვები\n\n:::question id=\"biz-catalog-source\" to=\"ბიზნესი\"\nსად ინახება ახლა საწყისი კატალოგი (Excel, 1C, სხვა)? რა ველები აქვს (SKU, სახელი, ფასი, მარაგი, თავსებადი მოდელები, ფოტოები)? დაახლოებით რამდენი პროდუქტია?\n:::\n\n:::question id=\"biz-charger-models\" to=\"ბიზნესი\"\nრომელი დამტენის ბრენდები და მოდელები უნდა იყოს თავსებადობის სიაში? არსებობს მზა სია?\n:::\n\n:::question id=\"docs-approval\" to=\"ყველა\"\nგაქვთ თუ არა დოკუმენტაციასთან დაკავშირებული შენიშვნები ან ცვლილებები, რომლებიც დამტკიცებამდე უნდა გავითვალისწინოთ?\n:::\n"},"en":{"00-overview":"# 00 — Overview\n\n## 1. Goal\n\nAn online shop where the company sells **only its own products**: spare parts for EV chargers, cables, connectors, accessories, etc.\n\nThe shop's key feature is the **compatibility filter**. The customer selects their charger (brand → model) and sees only the parts that fit that model, without needing to know the connector type or technical specifications.\n\n## 2. Scope\n\nProject scope: what is included in the first version (MVP) and what will be added later.\n\n### In the first version (MVP)\n- Product catalog with categories, search and filters\n- Compatibility filter (charger brand → model)\n- Two languages: Georgian (default) and English\n- Currency: **GEL** only\n- Registration / login via the existing **Identity** service (OAuth2 / OIDC)\n- Cart, checkout, online card payment via **TBC / BOG** (**Billing** service)\n- Fiscal receipt on RS.ge (**Fiscal** service)\n- Customer account: orders, addresses, profile\n- Admin Panel: products, categories, compatibility, stock, orders, customers, live dashboard\n- Fulfillment: **pickup from the office** and/or **delivery managed manually by an admin** (no courier service integration)\n\n:::question id=\"biz-fulfillment\" to=\"Business\"\nWhich fulfillment methods do we want in the MVP: only **pickup from the office**, or **manually managed delivery** as well? If delivery, what does it cost (flat fee / by city / free from X ₾)? What are the pickup address and opening hours?\n:::\n\n\n### Not in the first version (later)\n- B2B / companies (special prices, payment by invoice). **The schema is designed so this can be added later**\n- Integration with courier companies\n- Mobile app and push notifications\n- Multiple warehouses\n- Synchronization with ERP / accounting software\n- Promo codes, discount rules, loyalty\n- Ratings and reviews\n\n## 3. Users and roles\n\n| Role | Who | Where they work |\n|---|---|---|\n| Guest | Unauthenticated visitor | Storefront: browses, adds products to the cart |\n| Customer (Individual) | Registered individual | Storefront: buys, views orders |\n| Customer (Business) | Company — **later** | — |\n| Admin | Full access | Admin Panel |\n| Manager | Order management | Admin Panel |\n| Content Editor | Catalog and compatibility | Admin Panel |\n| Warehouse | Stock and order preparation | Admin Panel |\n\nDetailed permissions: [08-admin-panel.md](08-admin-panel.md#3-roles-and-permissions).\n\n## 4. Main scenarios\n\n1. The customer selects \"My charger: brand X, model Y\" and sees only compatible parts.\n2. The customer searches for a part by name, SKU or manufacturer (OEM) number.\n3. The customer adds a part to the cart, goes through checkout, pays with TBC/BOG and receives a confirmation.\n4. After payment, a fiscal receipt is issued automatically.\n5. An admin sees a new order in real time, prepares it and changes its status.\n6. An admin adds a product, uploads photos and specifies which models it fits.\n7. An admin records a stock receipt or a stock adjustment. Every change is kept in the history.\n8. An admin cancels a paid order: the refund goes through Billing, and the return receipt through Fiscal.\n\n## 5. Non-functional requirements\n\n| Topic | Requirement |\n|---|---|\n| Languages | ka (default), en. URL: `/ka/...`, `/en/...` |\n| Currency | GEL. Prices are stored **in tetri (integer)** |\n| VAT | Prices include VAT (18%), see the question below |\n| Mobile | Mobile-first design |\n| Performance | Product page: LCP < 2.5s; API p95 < 300ms (catalog) |\n| SEO | SSR/ISR, sitemap, hreflang, Product JSON-LD |\n| Reliability | A paid order and its receipt must never be lost, even if a service is temporarily down |\n| Stock | The last unit must not be sold to two different buyers |\n| Audit | Every admin change is written to the audit log |\n\n:::question id=\"biz-vat\" to=\"Accounting\"\nAre product prices stored and shown on the site **including VAT (18%)**? Are there any VAT-exempt products?\n:::\n\n:::question id=\"biz-guest-checkout\" to=\"Business\"\nCan customers buy **without registering** (guest checkout)? Proposal: in the MVP, checkout requires login, while adding to the cart works without registration.\n:::\n\n## 6. Glossary\n\n| Term | Meaning |\n|---|---|\n| SKU | Unique internal product code |\n| OEM number | Manufacturer's part number |\n| Charger model | A charger model that a part may fit |\n| Compatibility | The \"part ↔ charger model\" relation |\n| Reservation | Temporary hold of stock during checkout until the payment completes |\n| Outbox | A database table from which events are reliably sent to NATS |\n| BFF | Backend-for-Frontend. The server-side part of Next.js that stores the tokens |\n| SSE | Server-Sent Events, a one-way live stream from the server to the browser |\n| Minor units / tetri | 1 GEL = 100 tetri; all amounts are stored as integers |\n","01-tech-stack":"# 01 — Tech Stack\n\n> All decisions are **proposals** until this document is approved.\n\n## 1. Technologies\n\n| Layer | Technology | Why |\n|---|---|---|\n| Language | **TypeScript** (Node.js 24 LTS) | One language for frontend and backend, shared types |\n| Storefront | **Next.js** (App Router), Tailwind CSS, next-intl | SEO: pages are rendered on the server; ISR: the catalog is served from cache and refreshed when a product changes; ka / en |\n| Admin Panel | **Next.js**, shadcn/ui, TanStack Query + Table | Same technology as the Storefront; ready-made tables, forms and cache |\n| Backend | **NestJS** | Built-in gRPC client; modules and DI give a clear structure; OpenAPI is generated automatically with `@nestjs/swagger` |\n| Worker | Same NestJS code, separate process | Background work (events, receipts, cron) does not slow down the HTTP API |\n| API | **REST + OpenAPI**, `snake_case` fields | A familiar approach; Swagger UI for testing; the convention of the company's other APIs |\n| API client | **openapi-typescript + openapi-fetch** | Frontend types are generated from the backend code, not written by hand (see [REST API](05-api.md#5-frontend-api-client)) |\n| Database | **PostgreSQL 16+** | Transactions (order + stock together); JSONB for attributes; full-text search and `pg_trgm` |\n| ORM | **Prisma** | Typed client, migrations, Prisma Studio; raw SQL when needed |\n| gRPC | `@grpc/grpc-js` + Buf + ts-proto | TypeScript clients from the `.proto` contract |\n| Messaging | **NATS JetStream** (nats.js) | Already used by company microservices (Billing); events are persisted and not lost; dedupe and retry |\n| Real-time | **SSE** | We only need the server → browser direction; works over plain HTTP |\n| Files | S3 (usectl S3 addon) | Product images, uploaded directly from the Admin Panel (presigned URL) |\n| Repos | 3 separate repos (api, storefront, admin), pnpm | Company style; independent deploys; types are generated from OpenAPI ([Repo & Dev](09-repo-and-dev.md#1-repositories)) |\n| Tests | Vitest / Jest, Testcontainers, Playwright | Real Postgres and NATS in tests; E2E in the browser |\n| Deploy | **usectl** (Kubernetes) | Push-to-deploy, Postgres / NATS / S3 addons, domains, logs and alerts in one place |\n\n**We do not need Redis in the first version.** The cart is stored in Postgres, NATS plays the role of the queue, and Next.js handles caching. It can be added later if needed.\n\n## 2. Key decisions\n\n| # | Decision | Reason |\n|---|---|---|\n| D1 | The Shop backend is a **modular monolith**: one NestJS app, split into modules internally | The shop domain is cohesive; order and stock in one transaction; simple deploy. A module can be extracted into a separate service if needed ([Architecture](02-architecture.md#3-nestjs-modules-modular-monolith)) |\n| D2 | The frontend uses only REST and SSE; gRPC and NATS live only in the backend | The frontend does not depend on internal systems |\n| D3 | Authentication: Identity (OAuth2 / OIDC), tokens in an httpOnly cookie (BFF) | The token is not visible to JavaScript; SSE works easily ([Integrations](03-integrations.md#1-identity--oauth2--oidc)) |\n| D4 | Asynchronous processes: NATS JetStream + Outbox pattern | No event is lost, even if a service is temporarily down |\n| D5 | `snake_case` fields in the API and events | A consistent style with the company's other services |\n| D6 | Prices as integers, in tetri | No rounding errors |\n\n## 3. Alternatives considered\n\n| Alternative | Why we did not choose it |\n|---|---|\n| **Drizzle** (ORM) | Prisma's tooling (Studio, migrations) is more convenient for this project |\n| **Splitting the Shop into several microservices** | Catalog, stock and orders are tightly connected and work with a local transaction in one database. Splitting them into separate services would require a distributed transaction (saga) between them, which is not needed at this stage. Splitting becomes relevant if other company products start using the catalog or separate teams appear |\n","02-architecture":"# 02 — Architecture\n\n## 1. System diagram\n\n![System architecture](diagrams/architecture.svg)\n\n## 2. Components\n\n| Component | Responsibility |\n|---|---|\n| **Storefront** | Public site: rendering (SSR/ISR), login (BFF), API calls |\n| **Admin Panel** | Internal panel: same login, admin roles only |\n| **Shop API** | REST API: catalog, cart, checkout, orders, admin operations, SSE streams |\n| **Shop Worker** | Background work: NATS events, outbox, expired reservations, fiscal receipts |\n| **PostgreSQL** | All of the shop's own data |\n| **NATS JetStream** | Events between services |\n| **S3** | Product images (usectl S3 addon) |\n| **Identity** | Company microservice: users, login, tokens, roles |\n| **Billing** | Company microservice: payments via TBC / BOG, refunds, payment events |\n| **Fiscal** | Company microservice: fiscal receipts to RS.ge |\n\nThe API and the Worker are **one codebase** (the `icomers-api` repo) with two entry points. They are deployed separately so that HTTP requests and background work do not interfere with each other.\n\n## 3. NestJS modules (modular monolith)\n\nThe shop backend is **one application, strictly divided into modules internally**. Within the system of company microservices it is a single service that talks to the others over gRPC and NATS.\n\n```\nicomers-api/src/\n  modules/\n    auth/            # JWT validation (JWKS), Guards, @CurrentUser, @Roles\n    catalog/         # categories, products, images, search\n    compatibility/   # charger brands, models, product ↔ model link\n    inventory/       # stock, movements, reservations\n    customers/       # profile, addresses\n    cart/            # cart (guest + user), merge on login\n    orders/          # orders, statuses, state machine\n    checkout/        # checkout: price → reservation → payment\n    payments/        # Billing adapter, payment events\n    fiscal/          # Fiscal adapter, receipts\n    admin-events/    # SSE streams\n    audit/           # admin audit log\n  infra/             # prisma, nats, outbox, grpc, storage\n  main.ts            # HTTP API\n  worker.ts          # Worker\n```\n\n**Rules between modules:**\n- A module never touches another module's tables directly. It gets another module's data only through that module's service. Thanks to this, any module can be split out into a separate service when needed.\n- Integration with company microservices (Billing, Fiscal, Identity) goes through an **adapter** (the `PaymentGateway`, `FiscalGateway`, `IdentityGateway` interfaces). Each adapter has two implementations: **gRPC** (the real service) and **mock** (local development and automated tests). This way business logic does not depend on the details of the gRPC contract, and a contract change only affects the adapter.\n\n## 4. When sync, when async\n\n| Situation | Mechanism | Example |\n|---|---|---|\n| We need the answer **right now** | **gRPC** | Creating a payment and getting the redirect URL |\n| Something \"happened\" and others need to know | **NATS** | `shop.order.paid` |\n| Must happen together or not at all | **Postgres transaction** | Order + stock reservation + outbox record |\n| The browser must see it live | **SSE** | New order on the admin dashboard |\n\n### Core rules\n- **Business logic lives only in NestJS.** Next.js only handles rendering and login (BFF).\n- The frontend never touches gRPC or NATS, only REST and SSE.\n- **Stock always changes inside a transaction**, together with the order. Never asynchronously.\n- Price, VAT and totals are always calculated on the server.\n- Every NATS consumer is **idempotent**: the same event may arrive twice, and the result must be the same.\n\n### Order process and saga\n\n- **Inside the shop** (order + stock): a local Postgres transaction, because this data lives in one database.\n- **With company services** (Billing → Fiscal → refund): a distributed process with compensations, driven by events (choreography saga). For example: payment failed → the reservation is released; order cancelled → refund → refund receipt.\n- The company already has a saga orchestrator (Charging), where this approach is the right choice for charging sessions: a session spans several independent systems and lasts a long time.\n\n:::question id=\"saga-orchestrator\" to=\"Backend team (Charging saga)\"\nShould the shop's order process (payment → fiscal receipt → refund) be managed by the company's existing saga orchestrator instead of an event-driven flow? If so, what does integrating with it require?\n:::\n\n## 5. Outbox pattern\n\nProblem: the order was written to the database, but the server went down before the event was sent to NATS, and the event was lost.\n\nSolution: the event is first written to the database, in the same transaction, and then the Worker publishes it to NATS.\n\n![Outbox pattern](diagrams/outbox.svg)\n\n<details>\n<summary>Technical details</summary>\n\n- `Nats-Msg-Id` = event id. If the relay sends the same event twice, JetStream ignores the second one.\n- The relay reads with `SELECT … WHERE published_at IS NULL FOR UPDATE SKIP LOCKED`, so that several Workers do not pick up the same event at the same time.\n- Idempotent consumer:\n  ```\n  BEGIN\n    INSERT INTO processed_events(event_id, consumer) … ON CONFLICT DO NOTHING\n    -- already existed → already processed → ack and exit\n    … business logic …\n  COMMIT\n  ack()\n  ```\n\n</details>\n\n## 6. SSE (live updates)\n\nSSE is used in two places: the **admin dashboard** (new orders, payments, alerts) and the **checkout result page** (order status after payment).\n\n![SSE across multiple replicas](diagrams/sse-fanout.svg)\n\nEach API pod receives NATS events itself and forwards them to its own browsers. This way every admin sees every event, regardless of which pod they are connected to.\n\n### SSE rules\n- **Events can be lost.** Events missed while the connection is down are not replayed. Therefore, after every reconnect the client reloads the data from REST once (reconcile). Polling is not used.\n- **Reconnect:** exponential backoff from 1 second to 30 seconds, with jitter.\n- **Heartbeat:** the server sends a `: ping` comment every 15 seconds so that the proxy does not close the connection.\n- **Cache updates:** an event updates the TanStack Query cache directly (`setQueriesData`), so no extra request is made.\n- **No optimistic updates.** An action (e.g. payment) returns an \"accepted\" response, and the real status arrives only via SSE or REST.\n- **Proxy:** on usectl, traffic goes through Cloudflare and Traefik. The heartbeat keeps the connection open; details: [Deployment](10-deployment.md#4-sse-on-usectl).\n- Event names are in `snake_case`: `order_created`, `order_paid`, `order_status_changed`, `inventory_low_stock`.\n\n### SSE and authorization: two options\n\nThe browser's standard `EventSource` cannot send an `Authorization` header. There are two ways to solve this:\n\n| | **Option A: BFF + cookie** (recommended) | **Option B: Bearer token + polyfill** (as in ev-charger-admin) |\n|---|---|---|\n| How it works | The token is stored on the Next.js server; the browser only has an httpOnly cookie. SSE goes through a standard `EventSource` to Next.js, which forwards it to the API with the token | The token is in the browser. SSE is opened with `event-source-polyfill`, which sends the `Authorization: Bearer` header |\n| Token refresh | Done by the Next.js server, in one place, for all requests | The SSE service needs its own 401 → refresh logic, separate from the axios interceptor |\n| Security | The token is not accessible to JavaScript, so it cannot be stolen via XSS | The token is accessible to JavaScript, so the XSS risk is higher |\n| Extra library | Not needed | polyfill |\n\n**Recommendation: Option A.** Reasons:\n1. **The shop is a public site** where customers pay by card. Storing the token in an httpOnly cookie protects against XSS.\n2. **Token refresh is in one place.** In Option B it has to be written in two places (regular requests and SSE), and it also needs protection against redundant refreshes.\n3. **The code is simple:** a standard `EventSource` with automatic reconnect, no polyfill.\n4. We already have Next.js as a server, so BFF requires no additional infrastructure.\n\nOption B is a natural choice for an app that runs only in the browser and has no server part (e.g. a Vite SPA). In our case, the Next.js server solves this problem.\n\n## 7. gRPC client rules\n\n- Every call has a **deadline** (3–5 seconds). Waiting indefinitely is not allowed.\n- Retry only on reads or on calls that accept an idempotency key (e.g. creating a payment with `order_id`).\n- gRPC errors are mapped to HTTP statuses: `UNAVAILABLE` → 503, `INVALID_ARGUMENT` → 422, `NOT_FOUND` → 404.\n","03-integrations":"# 03 — Integrations\n\nThe gRPC methods below describe what functionality the shop needs. Exact names and fields will be agreed according to the corresponding service's `.proto` contract.\n\n## Service usage\n\n| Service | How we use it |\n|---|---|\n| **Identity** | Login and registration (OAuth2 / OIDC), token verification, admin roles |\n| **Billing** | gRPC: payment creation, refund. NATS: payment result |\n| **Fiscal** | gRPC from the Worker: sale and refund receipts |\n| **Notification** | Later. It currently handles push notifications, and a mobile app is not planned |\n\n---\n\n## 1. Identity — OAuth2 / OIDC\n\n**What we already know** (from other company projects): Identity uses OAuth2, the access token is a **JWT**, the user ID is the `sub` claim (UUID), and refresh tokens are supported. In the shop, `customers.identity_user_id = sub`.\n\n**What we additionally need:** OAuth2 tells us what the token is allowed to do. To know **who the user is** (name, email), we need **OpenID Connect (OIDC)**, which sits on top of OAuth2.\n\n| Requirement | Why |\n|---|---|\n| OIDC Discovery / issuer URL | Automatic endpoint discovery |\n| Authorization Code + PKCE | Secure login flow for the browser |\n| JWKS endpoint | Shop API verifies tokens itself, without calling Identity on every request |\n| `roles` claim | Admin roles: `admin`, `manager`, `content_editor`, `warehouse` |\n| Two clients | `icomers-storefront` and `icomers-admin`, each with its own redirect URIs |\n| Audience (`aud`) | `icomers-api`, so that another service's token does not work with us |\n\n:::question id=\"identity-oidc\" to=\"Identity team\"\nWhich of the items listed in the table above are supported (OIDC discovery, PKCE, JWKS, `roles` claim, audience)? Can you register two clients (`icomers-storefront`, `icomers-admin`) and create the admin roles? Please provide the issuer URL (dev / staging / prod).\n:::\n\n:::question id=\"identity-login-ui\" to=\"Identity team\"\nIs the login / registration page a hosted Identity page? Does it support Georgian and allow branding customization? Is registration by email, by phone (SMS), or both?\n:::\n\n:::question id=\"platform-s2s-auth\" to=\"Platform / Backend team\"\nHow is service-to-service authentication done over gRPC: **mTLS**, **service token**, or no authentication inside the internal network?\n:::\n\n### Login flow (BFF)\n\n![Login flow](diagrams/login.svg)\n\n- Tokens are stored on the Next.js server. The browser only has an httpOnly cookie; `localStorage` is not used. Why: see [SSE and authorization](02-architecture.md#sse-and-authorization-two-options).\n- Shop API verifies the JWT (signature via JWKS, `iss`, `aud`, `exp`) and roles (`RolesGuard`).\n- On first login, Shop API creates a `customers` record with the `sub`.\n- Checkout requires login. The cart also works without login and is merged on login. Final decision: question `biz-guest-checkout`.\n\n---\n\n## 2. Billing — TBC / BOG\n\n### gRPC methods\n\n| Method | Input | Output |\n|---|---|---|\n| `CreatePayment` | `idempotency_key` (= `order_id`), `amount_minor`, `currency`, `provider` (TBC / BOG), `return_url` | `payment_id`, `status`, `redirect_url` |\n| `GetPayment` | `payment_id` | `status`, `amount_minor` |\n| `RefundPayment` | `payment_id`, `amount_minor`, `idempotency_key` | `refund_id`, `status` |\n\n### Events (Billing → NATS)\n\nBilling already publishes payment results to NATS. The shop receives these events with a durable consumer:\n\n| Event | Shop reaction |\n|---|---|\n| Payment succeeded | Order → `PAID`, stock is written off, receipt is issued |\n| Payment failed | Order → `PAYMENT_FAILED`, stock is released |\n| Refund completed | Refund → `SUCCEEDED`, refund receipt |\n\n:::question id=\"billing-events\" to=\"Billing team\"\nWhat are the **exact subjects and payload schema** of the payment events (succeeded / failed / refund)? How do we pass `order_id` so that it comes back to us in the event? Does Billing receive the bank callback?\n:::\n\n:::question id=\"billing-idempotency\" to=\"Billing team\"\nIs `CreatePayment` idempotent? That is, do two calls with the same `idempotency_key` create a single payment?\n:::\n\n:::question id=\"billing-refund\" to=\"Billing team\"\nAre **partial refunds** possible? Roughly how many days does it take for the money to return to the card (to state in the text for customers)?\n:::\n\n:::question id=\"billing-expiry\" to=\"Billing team\"\nAfter how long is an unpaid payment considered **expired**? The stock reservation timeout depends on this (currently 15 minutes).\n:::\n\n:::question id=\"billing-sandbox\" to=\"Billing team\"\nIs there a **sandbox / test** environment for TBC and BOG to use on staging?\n:::\n\n:::question id=\"billing-methods\" to=\"Billing team / Business\"\nWhich payment methods are available: card only, or also Apple Pay / Google Pay / installments? Which ones do we want in the first version?\n:::\n\n---\n\n## 3. Fiscal — RS.ge\n\n| Method | Purpose |\n|---|---|\n| `IssueReceipt` | Sale receipt: lines (name, quantity, price, VAT), total, payment type |\n| `IssueRefundReceipt` | Refund receipt, referencing the original receipt |\n\n**When it is called:** the Worker receives the `shop.order.paid` event and calls `IssueReceipt`. On error it retries; if several attempts fail, the receipt becomes `FAILED` and the admin gets an alert with a \"Retry\" button.\n\n:::question id=\"fiscal-sync\" to=\"Fiscal team\"\nDoes Fiscal return the receipt number **synchronously** in the gRPC response, or **asynchronously** (via its own NATS event)?\n:::\n\n:::question id=\"fiscal-when\" to=\"Accounting\"\nShould the fiscal receipt be issued **at the moment of payment** or **when the item is handed over**?\n:::\n\n:::question id=\"fiscal-fields\" to=\"Fiscal team\"\nWhich fields does `IssueReceipt` require (product codes, units, VAT codes, payment type)? Can we show the customer a receipt link or PDF? Please provide an example.\n:::\n\n---\n\n## 4. Notifications (email / SMS)\n\nOrder confirmations and status changes can be delivered to the customer in two ways:\n- **A:** An email/SMS channel is added to the Notification service (centralized, for all company services)\n- **B:** The Worker directly uses an email provider and a Georgian SMS provider\n\nIn both cases the source is an event: `shop.order.paid`, `shop.order.status_changed`.\n\n:::question id=\"notif-channel\" to=\"Backend team / Business\"\nWhich channel should order notifications be sent through (email, SMS, both), and from where: will the Notification service be extended (A), or will the shop use a provider directly (B)?\n:::\n\n---\n\n## 5. NATS JetStream\n\nStream: `SHOP`, subjects `shop.>`. Events published by the shop:\n\n| Subject | When | Who listens |\n|---|---|---|\n| `shop.order.created` | Order created (before payment) | admin SSE |\n| `shop.order.paid` | Payment confirmed | Worker (receipt), notifications, admin SSE |\n| `shop.order.status_changed` | Admin changed the status | notifications, admin SSE |\n| `shop.order.cancelled` | Order cancelled | Worker (refund), admin SSE |\n| `shop.order.refunded` | Money refunded | Worker (refund receipt), admin SSE |\n| `shop.inventory.low_stock` | Stock fell below the threshold | admin SSE |\n| `shop.product.updated` | Product changed | Storefront refresh |\n\nFormat of every event (fields in `snake_case`):\n\n```json\n{\n  \"id\": \"0192f3c4-…\",\n  \"type\": \"shop.order.paid\",\n  \"version\": 1,\n  \"occurred_at\": \"2026-10-13T10:15:00Z\",\n  \"source\": \"icomers-api\",\n  \"data\": { \"order_id\": \"…\", \"order_number\": \"ICM-000123\", \"total_minor\": 15900, \"currency\": \"GEL\" }\n}\n```\n\nWhen the event structure changes, `version` is incremented, and old fields are not removed.\n\n<details>\n<summary>Technical details: consumer parameters and proto files</summary>\n\n| Parameter | Value |\n|---|---|\n| Type | durable, pull |\n| `ack_policy` | explicit |\n| `ack_wait` | 30s |\n| `max_deliver` | 10 |\n| `backoff` | 1s, 5s, 30s, 2m, 10m … |\n| After exhaustion | `failed_events` table + alert in the admin panel |\n\n`.proto` contracts are stored in `icomers-api/proto/`, and TypeScript code is generated from them with Buf + ts-proto. Event schemas live in `icomers-api/src/contracts/` (zod), so that the publisher and the consumer use the same schemas.\n\n</details>\n\n:::question id=\"proto-source\" to=\"Backend team\"\nWhere are the `.proto` contracts of the Identity / Billing / Fiscal services stored, and how do we get access to them (repo, Buf registry)?\n:::\n\nNetwork connectivity to NATS and company services: see question `platform-company-services` ([Deployment](10-deployment.md#11-to-clarify-with-platform)).\n","04-data-model":"# 04 — Data Model (PostgreSQL)\n\n## 1. Conventions\n\n| Rule | Value |\n|---|---|\n| Primary key | `uuid` (`gen_random_uuid()`), except for join tables |\n| Names | `snake_case` (in both the database and the API) |\n| Time | `timestamptz`, UTC. Every table has `created_at`, `updated_at` |\n| Amounts | `integer`, **in tetri** (`*_minor`). Currency `GEL` |\n| Languages | Translatable text is stored in `*_translations` tables (`locale` = `ka` / `en`) |\n| Deletion | Products are never deleted; they move to `ARCHIVED` status (orders need them). Everything else: hard delete, where it is safe |\n| Snapshot | An order stores the product name, price and address **as they were at the time of the order**. Later changes are not reflected in old orders |\n| Extensions | `pgcrypto`, `pg_trgm`, `citext` |\n\n## 2. Domains and relationships\n\n![Data model](diagrams/data-model.svg)\n\n## 3. Tables\n\n### Catalog\n\n**`categories`**\n| Column | Type | Note |\n|---|---|---|\n| id | uuid PK | |\n| parent_id | uuid FK → categories, null | Tree (e.g. \"Cables\" → \"Type 2 cables\") |\n| slug | text UNIQUE | For URLs; the same for both languages (Latin characters) |\n| sort_order | int | |\n| is_active | bool | |\n\n**`category_translations`**: `(category_id, locale)` PK, `name`, `description`, `seo_title`, `seo_description`\n\n**`products`**\n| Column | Type | Note |\n|---|---|---|\n| id | uuid PK | |\n| sku | text UNIQUE | Internal code |\n| slug | text UNIQUE | |\n| category_id | uuid FK | |\n| status | enum `DRAFT` / `ACTIVE` / `ARCHIVED` | Only `ACTIVE` is visible on the Storefront |\n| price_minor | int CHECK ≥ 0 | VAT included |\n| compare_at_price_minor | int null | \"Old price\" (struck through) |\n| vat_rate_bp | int default 1800 | VAT in basis points (18.00%) |\n| oem_part_numbers | text[] | Manufacturer part numbers, for search |\n| attributes | jsonb | Free-form attributes: `{ \"voltage\": \"400V\", \"current\": \"32A\", \"connector\": \"Type 2\" }` |\n| weight_g | int null | For future delivery |\n| is_featured | bool | Shown on the home page |\n| created_at, updated_at | timestamptz | |\n\n**`product_translations`**\n| Column | Type | Note |\n|---|---|---|\n| product_id, locale | PK | |\n| name | text | |\n| short_description | text | |\n| description | text | Markdown / rich text |\n| seo_title, seo_description | text | |\n| search_vector | tsvector GENERATED | `to_tsvector('simple', name ‖ short_description)` |\n\n**`product_images`**: `id`, `product_id`, `storage_key`, `alt` (jsonb `{ka,en}`), `sort_order`, `width`, `height`\n\n**`attribute_definitions`** *(optional, for filters)*: `key`, `label` (jsonb), `type` (`text`/`number`/`enum`), `options`, `is_filterable`. Lets the admin decide which `attributes` appear as filters.\n\n### Compatibility\n\n**`charger_brands`**: `id`, `slug` UNIQUE, `name`, `logo_key`, `sort_order`, `is_active`\n\n**`charger_models`**\n| Column | Type | Note |\n|---|---|---|\n| id | uuid PK | |\n| brand_id | uuid FK | |\n| slug | text | UNIQUE `(brand_id, slug)` |\n| name | text | E.g. \"Wallbox Pulsar Plus\" |\n| revision | text null | Version / revision / generation |\n| power_kw | numeric null | |\n| image_key | text null | So the customer can recognize the model visually |\n| is_active | bool | |\n\n**`product_compatibility`**\n| Column | Type | Note |\n|---|---|---|\n| product_id | uuid FK | PK `(product_id, charger_model_id)` |\n| charger_model_id | uuid FK | |\n| note | text null | E.g. \"Only for versions manufactured after 2023\" |\n\nIndex: `(charger_model_id, product_id)`, because the filter works in exactly this direction.\n\n> **Universal parts** (that fit every model): `products.is_universal bool`. The filter returns `compatible OR universal`.\n\n### Inventory (single warehouse)\n\n**`inventory_items`**\n| Column | Type | Note |\n|---|---|---|\n| product_id | uuid PK FK | |\n| on_hand | int | Physically in the warehouse |\n| reserved | int | Held by unpaid orders |\n| low_stock_threshold | int default 2 | |\n| | CHECK | `on_hand >= 0 AND reserved >= 0 AND reserved <= on_hand` |\n\nAvailable quantity = `on_hand - reserved`.\n\n**`stock_movements`** (ledger, INSERT only)\n| Column | Type | Note |\n|---|---|---|\n| id | uuid | |\n| product_id | uuid | |\n| type | enum `RECEIPT` / `SALE` / `RETURN` / `ADJUSTMENT` / `DAMAGE` | |\n| quantity | int | + or − |\n| order_id | uuid null | |\n| reason | text null | |\n| actor_id | text null | Admin's identity id |\n| created_at | timestamptz | |\n\n**`stock_reservations`**: `id`, `order_id`, `product_id`, `quantity`, `status` (`ACTIVE` / `COMMITTED` / `RELEASED`), `expires_at`, index `(status, expires_at)`\n\n### Customers\n\n**`customers`** (local copy of Identity data + shop data)\n| Column | Type | Note |\n|---|---|---|\n| id | uuid | |\n| identity_user_id | text UNIQUE | `sub` from the token |\n| type | enum `INDIVIDUAL` / `BUSINESS` | `BUSINESS` will be added later |\n| email | citext null | |\n| phone | text null | |\n| first_name, last_name | text | |\n| preferred_locale | text default `ka` | |\n| created_at, updated_at | | |\n\n**`addresses`**: `id`, `customer_id`, `label`, `recipient_name`, `phone`, `city`, `address_line`, `notes`, `is_default`\n\n> **For future B2B:** `business_profiles` (`customer_id`, `company_name`, `tax_id`, `legal_address`), `price_lists` and `price_list_items` will be added. The current schema does not conflict with this.\n\n### Cart\n\n**`carts`**: `id`, `customer_id` UNIQUE null, `guest_token` UNIQUE null, `updated_at`, `expires_at`. CHECK: at least one of them must be set.\n\n**`cart_items`**: `(cart_id, product_id)` PK, `quantity` CHECK > 0, `added_at`\n\nThe price is **not stored** in the cart: it is always read from `products`.\n\n### Orders\n\n**`orders`**\n| Column | Type | Note |\n|---|---|---|\n| id | uuid | |\n| number | text UNIQUE | Human-readable: `ICM-000123` (sequence) |\n| customer_id | uuid FK | |\n| status | enum | See [06-order-flow](06-order-flow.md#1-order-statuses) |\n| fulfillment_method | enum `PICKUP` / `DELIVERY` | `DELIVERY` is handled manually by the admin |\n| contact | jsonb | Snapshot: name, phone, email |\n| shipping_address | jsonb null | Snapshot |\n| subtotal_minor | int | |\n| shipping_minor | int default 0 | |\n| discount_minor | int default 0 | |\n| total_minor | int | |\n| vat_minor | int | VAT included in the total |\n| currency | char(3) default `GEL` | |\n| locale | text | Language in which the order was placed (for notifications) |\n| customer_note | text null | |\n| internal_note | text null | Admin only |\n| placed_at, paid_at, completed_at, cancelled_at | timestamptz null | |\n\n**`order_items`**: `id`, `order_id`, `product_id`, `sku`, `name` (jsonb `{ka,en}` snapshot), `unit_price_minor`, `quantity`, `vat_rate_bp`, `line_total_minor`\n\n**`order_status_history`**: `id`, `order_id`, `from_status`, `to_status`, `actor_type` (`SYSTEM` / `CUSTOMER` / `ADMIN`), `actor_id`, `comment`, `created_at`\n\n### Payments and receipts\n\n**`payments`**: `id`, `order_id`, `provider` (`TBC` / `BOG`), `billing_payment_id` UNIQUE, `status` (`PENDING` / `SUCCEEDED` / `FAILED` / `EXPIRED`), `amount_minor`, `redirect_url`, `last_event` jsonb, timestamps\n\n**`refunds`**: `id`, `payment_id`, `billing_refund_id`, `amount_minor`, `status`, `reason`, `actor_id`, timestamps\n\n**`fiscal_receipts`**: `id`, `order_id`, `type` (`SALE` / `REFUND`), `status` (`PENDING` / `ISSUED` / `FAILED`), `external_id`, `receipt_url`, `error`, `attempts`, `issued_at`\n\n### Technical tables\n\n| Table | Purpose |\n|---|---|\n| `outbox_events` | `id`, `aggregate_type`, `aggregate_id`, `event_type`, `payload` jsonb, `created_at`, `published_at` null, `attempts`. Index: `WHERE published_at IS NULL` |\n| `processed_events` | `(event_id, consumer)` PK, `processed_at`. Idempotent consumer |\n| `failed_events` | Events that have exhausted the `max_deliver` limit |\n| `idempotency_keys` | `key`, `customer_id`, `request_hash`, `response` jsonb, `created_at`. For `POST /checkout` |\n| `admin_audit_log` | `id`, `actor_id`, `actor_email`, `action`, `entity_type`, `entity_id`, `diff` jsonb, `ip`, `created_at` |\n\n## 4. Important queries\n\n### Compatibility filter\n```sql\nSELECT p.*\nFROM products p\nWHERE p.status = 'ACTIVE'\n  AND (p.is_universal\n       OR EXISTS (SELECT 1 FROM product_compatibility pc\n                  WHERE pc.product_id = p.id AND pc.charger_model_id = $1));\n```\n\n### Search (Georgian + English + SKU / OEM)\nSearch uses Postgres full-text search (`simple` configuration) and `pg_trgm` (for similar and misspelled words), and also matches by SKU and OEM number.\n\n<details>\n<summary>Technical details: indexes and query</summary>\n\n```sql\n-- indexes\nCREATE INDEX ON product_translations USING gin (search_vector);\nCREATE INDEX ON product_translations USING gin (name gin_trgm_ops);\nCREATE INDEX ON products USING gin (sku gin_trgm_ops);\nCREATE INDEX ON products USING gin (oem_part_numbers);\n\n-- query (simple version)\nSELECT p.id, similarity(t.name, $q) AS score\nFROM products p\nJOIN product_translations t ON t.product_id = p.id AND t.locale = $locale\nWHERE p.status = 'ACTIVE'\n  AND ( t.search_vector @@ plainto_tsquery('simple', $q)\n     OR t.name % $q\n     OR p.sku ILIKE $q || '%'\n     OR $q = ANY(p.oem_part_numbers) )\nORDER BY score DESC\nLIMIT 20;\n```\n\n</details>\n\n### Safe stock reservation (without race conditions)\n```sql\nUPDATE inventory_items\nSET reserved = reserved + $qty, updated_at = now()\nWHERE product_id = $id\n  AND on_hand - reserved >= $qty\nRETURNING product_id;\n-- 0 rows → out of stock → roll back the entire checkout transaction\n```\n","05-api":"# 05 — REST API\n\n## 1. Conventions\n\n| Topic | Rule |\n|---|---|\n| Base URL | `https://api.<domain>/v1` |\n| Format | JSON, fields in **`snake_case`** (like the company's other APIs) |\n| Language | `Accept-Language: ka` / `en` (default `ka`). Translatable fields are returned in this language |\n| Auth | `Authorization: Bearer <access_token>`. This header is added by the Next.js server (BFF) |\n| Guest cart | `X-Cart-Token: <uuid>` (added by the BFF from a cookie) |\n| Amounts | `{ \"amount_minor\": 15900, \"currency\": \"GEL\" }`. The frontend displays it as `159.00 ₾` |\n| Dates | ISO 8601, UTC |\n| Pagination | `?page=1&page_size=24` → `{ items, page, page_size, total }` |\n| Sorting | `?sort=price_asc` / `price_desc` / `newest` / `relevance` |\n| Errors | `application/problem+json` (see below) |\n| Idempotency | `Idempotency-Key` header, required on `POST /checkout` |\n| Documentation | Swagger UI: `/docs` (dev / staging only) |\n| Versioning | `/v1` in the URL. Breaking change → `/v2` |\n\n### Error format\n```json\n{\n  \"type\": \"https://icomers.ge/errors/out-of-stock\",\n  \"title\": \"Out of stock\",\n  \"status\": 409,\n  \"code\": \"OUT_OF_STOCK\",\n  \"detail\": \"Some products are no longer in stock\",\n  \"errors\": [{ \"product_id\": \"…\", \"requested\": 3, \"available\": 1 }],\n  \"trace_id\": \"4bf92f3577b34da6\"\n}\n```\n`code` is stable, and the frontend bases its decisions on it. The text may change.\n\n| HTTP | When |\n|---|---|\n| 400 / 422 | Validation error |\n| 401 | Token missing or expired |\n| 403 | Role lacks sufficient permissions |\n| 404 | Not found |\n| 409 | Conflict: stock, invalid status transition, price change |\n| 429 | Too many requests |\n| 503 | A company microservice (Billing / Identity) is temporarily unavailable |\n\n---\n\n## 2. Public (no authentication)\n\n| Method | Path | Description |\n|---|---|---|\n| GET | `/catalog/categories` | Category tree |\n| GET | `/catalog/products` | List + filters (see below) |\n| GET | `/catalog/products/{slug}` | Details, images, compatible models, stock status |\n| GET | `/catalog/products/{slug}/related` | Similar products |\n| GET | `/catalog/filters` | Available filters and counts for the current selection |\n| GET | `/search/suggest?q=` | Autocomplete: products, categories, models |\n| GET | `/compatibility/brands` | Charger brands |\n| GET | `/compatibility/brands/{brand_slug}/models` | Models of a brand |\n| GET | `/compatibility/models/{id}` | Model information |\n| GET | `/health/live`, `/health/ready` | Kubernetes |\n\n### `GET /catalog/products` filters\n| Parameter | Example |\n|---|---|\n| `category` | `cables` (subcategories included) |\n| `charger_model` | `uuid`: only compatible + universal |\n| `charger_brand` | `wallbox` |\n| `q` | Text search (name, SKU, OEM number) |\n| `min_price`, `max_price` | In tetri |\n| `in_stock` | `true` |\n| `attr[connector]` | `Type 2` (dynamic attributes) |\n| `sort`, `page`, `page_size` | |\n\nResponse:\n```json\n{\n  \"items\": [{\n    \"id\": \"…\", \"slug\": \"type2-cable-32a-5m\", \"sku\": \"CBL-T2-32-5\",\n    \"name\": \"Type 2 cable 32A, 5m\",\n    \"price\": { \"amount_minor\": 32900, \"currency\": \"GEL\" },\n    \"compare_at_price\": null,\n    \"image\": { \"url\": \"https://cdn…/p/…/1.webp\", \"alt\": \"…\" },\n    \"stock_status\": \"IN_STOCK\",\n    \"is_compatible\": true\n  }],\n  \"page\": 1, \"page_size\": 24, \"total\": 87\n}\n```\n`stock_status`: `IN_STOCK` / `LOW_STOCK` / `OUT_OF_STOCK`. The exact quantity is not publicly visible.\n\n---\n\n## 3. Customer (authenticated; the cart also works without login)\n\n| Method | Path | Description |\n|---|---|---|\n| GET / PATCH | `/me` | Profile: name, phone, language |\n| GET / POST | `/me/addresses` | Addresses |\n| PATCH / DELETE | `/me/addresses/{id}` | |\n| GET | `/cart` | Cart with current prices, availability and total |\n| POST | `/cart/items` | `{ product_id, quantity }` |\n| PATCH / DELETE | `/cart/items/{product_id}` | |\n| POST | `/cart/merge` | Merge the guest cart after login |\n| POST | `/checkout/preview` | Final total, stock check, price changes |\n| POST | `/checkout` | Create the order + start payment (`Idempotency-Key`) |\n| GET | `/orders` | My orders |\n| GET | `/orders/{id}` | Details, status history, receipt |\n| GET | `/orders/{id}/stream` | SSE: status changes (for the payment result page) |\n| POST | `/orders/{id}/cancel` | Only in `PENDING_PAYMENT` status |\n| POST | `/orders/{id}/retry-payment` | Retry a failed payment |\n\n### `POST /checkout`\nRequest:\n```json\n{\n  \"fulfillment_method\": \"PICKUP\",\n  \"address_id\": null,\n  \"contact\": { \"name\": \"Giorgi\", \"phone\": \"+995 5xx xx xx xx\", \"email\": \"g@example.com\" },\n  \"payment_provider\": \"BOG\",\n  \"customer_note\": \"\",\n  \"expected_total_minor\": 32900\n}\n```\n`expected_total_minor`: if the price has changed since the customer saw it, `409 PRICE_CHANGED` is returned and the customer is shown the new total.\n\nResponse `201`:\n```json\n{\n  \"order_id\": \"…\",\n  \"order_number\": \"ICM-000123\",\n  \"status\": \"PENDING_PAYMENT\",\n  \"payment\": { \"redirect_url\": \"https://…\" },\n  \"reservation_expires_at\": \"2026-10-13T10:30:00Z\"\n}\n```\n\n---\n\n## 4. Admin (`/admin/*`, admin role required)\n\n### Catalog\n| Method | Path | Role |\n|---|---|---|\n| GET / POST | `/admin/products` | editor+ |\n| GET / PATCH | `/admin/products/{id}` | editor+ |\n| POST | `/admin/products/{id}/archive` | editor+ |\n| POST | `/admin/products/{id}/images/presign` | editor+ → `{ upload_url, storage_key }` |\n| POST / DELETE | `/admin/products/{id}/images` | editor+ |\n| PUT | `/admin/products/{id}/compatibility` | editor+ `{ model_ids: [], is_universal }` |\n| POST | `/admin/products/import` | admin (CSV / XLSX) |\n| GET | `/admin/products/export` | editor+ |\n| CRUD | `/admin/categories`, `/admin/charger-brands`, `/admin/charger-models` | editor+ |\n| POST | `/admin/charger-models/{id}/products` | editor+ (link many products to one model) |\n\n### Inventory\n| Method | Path | Role |\n|---|---|---|\n| GET | `/admin/inventory?low_stock=true` | warehouse+ |\n| POST | `/admin/inventory/{product_id}/movements` | warehouse+ `{ type, quantity, reason }` |\n| GET | `/admin/inventory/{product_id}/movements` | warehouse+ |\n\n### Orders\n| Method | Path | Role |\n|---|---|---|\n| GET | `/admin/orders?status=&from=&to=&q=` | manager+, warehouse |\n| GET | `/admin/orders/{id}` | manager+, warehouse |\n| POST | `/admin/orders/{id}/transition` | manager+ / warehouse `{ to, comment }` |\n| POST | `/admin/orders/{id}/cancel` | manager+ (paid orders are refunded automatically) |\n| POST | `/admin/orders/{id}/refund` | admin `{ amount_minor, reason }` |\n| POST | `/admin/orders/{id}/fiscal/retry` | admin |\n\n### Other\n| Method | Path | Role |\n|---|---|---|\n| GET | `/admin/customers`, `/admin/customers/{id}` | manager+ |\n| GET | `/admin/dashboard/summary?period=today` | All admins |\n| GET | `/admin/events/stream` | SSE, all admins |\n| GET | `/admin/audit-log` | admin |\n\n### Admin SSE format\n```\nevent: order_paid\nid: 0192f3c4-…\ndata: {\"order_id\":\"…\",\"order_number\":\"ICM-000123\",\"total_minor\":32900}\n\nevent: inventory_low_stock\ndata: {\"product_id\":\"…\",\"sku\":\"CBL-T2-32-5\",\"available\":1}\n```\nSSE rules (reconnect, heartbeat, reconcile): see [Architecture](02-architecture.md#6-sse-live-updates).\n\n<details>\n<summary>Technical details: rate limiting</summary>\n\n| Endpoint group | Limit |\n|---|---|\n| Public catalog | 120 / min / IP |\n| `/search/suggest` | 60 / min / IP |\n| `/checkout` | 10 / min / user |\n| Admin | 600 / min / user |\n\nThe first version uses `@nestjs/throttler` or the ingress rate limit.\n\n</details>\n\n---\n\n## 5. Frontend API client\n\nThe frontend code for calling the API and its types are **not written by hand**: they are generated automatically from the backend code.\n\n```\nNestJS code  ──►  openapi.json  ──►  TypeScript types  ──►  frontend\n (backend)       (API description)   (automatically)       (with autocomplete)\n```\n\n| Step | Tool | What it does |\n|---|---|---|\n| 1 | `@nestjs/swagger` | Generates the full API description (`openapi.json`) from the backend code: every URL, parameter and response shape. Swagger UI runs on it as well |\n| 2 | `openapi-typescript` | Generates TypeScript types from this description |\n| 3 | `openapi-fetch` | A small `fetch` wrapper that uses these types |\n\n```ts\nconst { data } = await api.GET('/catalog/products', {\n  params: { query: { category: 'cables', in_stock: true } },\n});\n\ndata.items[0].price.amount_minor  // ✅ the editor suggests the fields for you\ndata.items[0].prise               // ❌ error: no such field exists\napi.GET('/catalog/prodcts')       // ❌ error: no such URL exists\n```\n\n**Why:** when something changes in the backend (e.g. the price structure), the types are regenerated and TypeScript **shows an error in every place** in the frontend where the old structure is used. A mismatch between frontend and backend shows up while writing code, not when a customer sees a broken page.\n\n```bash\n# icomers-api:  generates openapi.json (automatically in CI)\npnpm openapi:export\n# icomers-storefront / icomers-admin:  generates the types\npnpm api:generate\n```\n","06-order-flow":"# 06 — Order Flow (Checkout, Payment, Receipt)\n\n## 1. Order statuses\n\n![Order statuses](diagrams/order-states.svg)\n\n- Allowed transitions are defined in **one place** (`orders/order-state-machine.ts`). Any other transition → `409 INVALID_TRANSITION`.\n- Every transition is written to `order_status_history` and to the outbox (`shop.order.status_changed`).\n\n## 2. Checkout — step by step\n\n![Checkout and payment](diagrams/checkout.svg)\n\n### Important details\n1. **The price is always calculated on the server.** A price sent by the client is never used. `expectedTotalMinor` is only for comparison.\n2. **The reservation happens in a transaction.** If stock is insufficient for any line, the entire transaction is rolled back → `409 OUT_OF_STOCK` with details.\n3. **If `CreatePayment` fails** (Billing is unavailable): the order stays in `PENDING_PAYMENT` and the customer sees \"Try again\" (`retry-payment`). The reservation remains valid until it expires.\n4. **Idempotency-Key:** a second request with the same key (double click, refresh) returns the same response and does not create a new order.\n5. **The return page** does not trust URL parameters (\"success=true\"). It gets the status from our API: first via REST, then it waits for the change via SSE. On reconnect, it checks the status via REST again.\n\n## 3. Reservation expiry\n\n- `RESERVATION_TTL` = 15 minutes (configurable; should be slightly longer than Billing's payment timeout).\n- Worker cron, every minute:\n  ```sql\n  SELECT ... FROM stock_reservations\n  WHERE status = 'ACTIVE' AND expires_at < now()\n  FOR UPDATE SKIP LOCKED\n  ```\n  → `reserved -= qty`, reservation → `RELEASED`, order → `CANCELLED` (reason: `PAYMENT_TIMEOUT`).\n\n### Edge case: payment arrives after the reservation has expired\n1. If the stock is still available → the order is restored and becomes `PAID` (the normal path).\n2. If the stock is no longer available → the order becomes `PAID` but is flagged as `needs_attention`. The admin receives an alert via SSE and decides whether to wait for stock or refund the money.\n\n## 4. Cancellation and Refund\n\n![Cancellation and Refund](diagrams/refund.svg)\n\n- Stock is returned automatically only if the item has not yet been handed over (`PAID` / `PROCESSING`). For a return after `COMPLETED`, the admin inspects the item and then manually records a `RETURN` movement.\n- Partial refund: only with the admin role and only if Billing supports it.\n\n## 5. Fiscal receipt\n\n| Situation | Action |\n|---|---|\n| `shop.order.paid` | `IssueReceipt` (SALE) |\n| `shop.order.refunded` | `IssueRefundReceipt` (REFUND) |\n| Fiscal is unavailable | JetStream retry with backoff |\n| `max_deliver` exhausted | `fiscal_receipts.status = FAILED`, an alert is sent to the admin, a \"Retry\" button appears |\n\nWhen the receipt is issued (at payment or at handover) depends on the answer to the `fiscal-when` question, see [03 §3](03-integrations.md#3-fiscal--rsge).\n\n## 6. Customer notifications (once the channel is decided)\n\n| Event | Notification |\n|---|---|\n| `shop.order.paid` | \"Order ICM-000123 has been received\" + receipt link |\n| `status_changed → READY_FOR_PICKUP` | \"Your order is ready for pickup\" + address/opening hours |\n| `status_changed → SHIPPED` | \"Your order is on its way\" |\n| `shop.order.cancelled` | \"Your order has been cancelled; the money will be refunded within X days\" |\n","07-storefront":"# 07 — Storefront (Next.js)\n\n## 1. Technologies\n- Next.js App Router, React Server Components\n- Tailwind CSS (+ shadcn/ui for base components)\n- **next-intl**: ka / en, locale in the URL\n- API client: `openapi-fetch` + types generated from `icomers-api`'s `openapi.json`\n- Auth: Auth.js (OIDC) or `openid-client`, BFF pattern (see [03 §1](03-integrations.md#1-identity--oauth2--oidc))\n- Forms: react-hook-form + zod\n- Client state: minimal. Cart item count in the header → TanStack Query or Server Actions + `revalidatePath`\n\n## 2. Pages (routes)\n\n| Route | Page | Rendering |\n|---|---|---|\n| `/[locale]` | Home: hero, \"Choose your charger\", categories, featured | ISR (5 min + on-demand) |\n| `/[locale]/catalog` | All products + filters | SSR (filters are in the URL) |\n| `/[locale]/c/[...slug]` | Category | ISR + SSR with filters |\n| `/[locale]/p/[slug]` | Product page | **ISR**, `revalidateTag('product:{id}')` |\n| `/[locale]/chargers` | List of brands | ISR |\n| `/[locale]/chargers/[brand]` | Brand's models | ISR |\n| `/[locale]/chargers/[brand]/[model]` | Parts compatible with this model (**very important for SEO**) | ISR |\n| `/[locale]/search?q=` | Search results | SSR, `noindex` |\n| `/[locale]/cart` | Cart | Dynamic |\n| `/[locale]/checkout` | Fulfillment method, contact details, payment method | Dynamic, login required |\n| `/[locale]/checkout/result/[orderId]` | Payment result (waits for the status via SSE) | Dynamic |\n| `/[locale]/account` | Profile | Dynamic, protected |\n| `/[locale]/account/orders` | Orders | Dynamic |\n| `/[locale]/account/orders/[id]` | Order details, status timeline, receipt | Dynamic |\n| `/[locale]/account/addresses` | Addresses | Dynamic |\n| `/[locale]/pages/[slug]` | Terms and conditions, privacy, return policy, delivery/pickup, contact | Static |\n| `/api/auth/*` | login / callback / logout (BFF) | Route handlers |\n| `/api/revalidate` | On-demand revalidation from the API (with a secret) | Route handler |\n| `/sitemap.xml`, `/robots.txt` | | generated |\n\n> ⚖️ **Legal pages** (terms, privacy, right of return) are mandatory for online commerce.\n\n:::question id=\"biz-legal\" to=\"Lawyer / Business\"\nWho will provide the legal texts (terms and conditions, privacy policy, return policy) in Georgian and English? By when?\n:::\n\n\n## 3. \"My charger\" (compatibility UX)\n\n1. On the home page and in the header: **\"Choose your charger\"** → brand → model (with images).\n2. The selected model is stored in a **cookie** (`my_charger=<modelId>`); for signed-in users it may in the future also be stored in the profile (multiple chargers).\n3. When a model is selected:\n   - The catalog is filtered automatically (chip: \"Showing: Wallbox Pulsar Plus ✕\")\n   - Badge on the product card: ✅ \"Fits your charger\" / ⚠️ \"Does not fit\"\n   - On the product page: the full list \"Compatible with the following models\"\n4. If the user cannot find their model → form/link \"Can't find it? Contact us\".\n\n## 4. Filters (catalog)\n\n| Filter | UI |\n|---|---|\n| Charger model | Separately at the top (see §3) |\n| Category | Tree / chips |\n| Price | range slider |\n| In stock | toggle |\n| Dynamic attributes (connector, current, length...) | Checkboxes from `/catalog/filters`, with counts |\n| Sorting | Popular, price ↑↓, newest |\n\nAll filters are **in the URL** (`?category=cables&in_stock=true&attr[connector]=Type+2`) so that sharing a link and navigating back work correctly.\n\n## 5. i18n\n\n- `ka` is the default: `/` → `/ka`.\n- UI texts: `messages/ka.json`, `messages/en.json`.\n- Product content comes from the API based on `Accept-Language`.\n- If the English translation is missing → Georgian is shown (the fallback is on the API side).\n- Price format: `Intl.NumberFormat('ka-GE', { style: 'currency', currency: 'GEL' })`.\n- The font must support the Georgian alphabet (e.g. Noto Sans Georgian, FiraGO, the BPG series).\n\n## 6. SEO\n\n- `generateMetadata`: title, description, canonical, **hreflang** (`ka`, `en`, `x-default`)\n- Open Graph images for products\n- JSON-LD: `Product` (`offers`, `price`, `priceCurrency: GEL`, `availability`), `BreadcrumbList`, `Organization`\n- `sitemap.xml`: products, categories, charger model pages, in both languages\n- Pages for search and filter combinations: `noindex` or canonical pointing to the main category\n- Images: `next/image`, WebP/AVIF, correct `sizes`\n\n## 7. Caching and revalidation\n\n![Storefront revalidation](diagrams/revalidation.svg)\n\n- `fetch(..., { next: { tags: ['product:123'] } })` on every API call.\n- **Price and stock** on the product page come from ISR, but in the cart and at checkout they are **always re-checked**.\n\n## 8. Quality\n\nGoals: the \"good\" range of Core Web Vitals (LCP < 2.5s), keyboard navigation and sufficient contrast (WCAG AA). Analytics is enabled only after cookie consent.\n\n:::question id=\"biz-analytics\" to=\"Business / Marketing\"\nWhich analytics should we use: **GA4**, **Plausible**, or something else? Do we need Meta Pixel or other advertising tracking?\n:::\n\n","08-admin-panel":"# 08 — Admin Panel (Next.js)\n\n## 1. General\n- A separate Next.js app on a separate domain (`admin.<domain>`); no SEO needed (`noindex`)\n- Auth: the same Identity, client `icomers-admin`. Sign-in is allowed only with an admin role; otherwise a 403 page is shown\n- UI: **shadcn/ui** + Tailwind, **TanStack Table** (sorting, filters, server-side pagination), **TanStack Query** (cache, mutations, optimistic updates)\n- Forms: react-hook-form + zod\n- Language: mainly Georgian (en later, if needed)\n- Live: `EventSource(\"/api/admin/events\")`. Next.js (BFF) forwards it to the Shop API's `/admin/events/stream`. Rules: [SSE](02-architecture.md#6-sse-live-updates)\n\n## 2. Modules\n\n### 2.1 Dashboard\n- Today / this week / this month: sales (₾), number of orders, average cart value\n- **Live feed (SSE):** new orders and payments. An audible/visual notification for each new paid order\n- Alerts: low stock, failed fiscal receipts, `needs_attention` orders\n- Top-selling products\n\n### 2.2 Orders\n- List: filters (status, date, fulfillment method), search (number, phone, name)\n- Live updates: new orders appear in the list automatically\n- Details: lines, total, contact, address, payment status, receipt status, status timeline\n- Actions: change status (only allowed transitions are shown), cancel, refund, internal note, print (picking list / receipt)\n\n### 2.3 Products\n- List: image, SKU, name, price, stock, status; bulk actions (activate, archive)\n- Editor with tabs:\n  - **General:** SKU, slug, category, price, old price, status, featured\n  - **Content:** name and description in **ka / en** side by side; SEO fields\n  - **Images:** drag & drop upload (presigned S3), reordering, alt text\n  - **Specifications:** dynamic attributes\n  - **Compatibility:** brand → multi-select of models, \"Universal\" checkbox, per-model note\n  - **Stock:** current quantity + movement history\n- Import/Export: CSV/XLSX (very much needed for the initial catalog population)\n\n### 2.4 Categories\n- Tree editor (drag & drop reordering), translations\n\n### 2.5 Compatibility (chargers)\n- Brands and models: CRUD, images\n- **Model page:** all compatible products + \"Add products\" with search (bulk linking)\n- **Matrix view** (optional): products × models, with checkboxes\n\n### 2.6 Stock\n- List: available / reserved / total, low-stock filter\n- Actions: **Receipt** (RECEIPT), **Adjustment** (ADJUSTMENT, reason required), **Damage** (DAMAGE)\n- History: who, when, how much, why\n\n### 2.7 Customers\n- List, search, order history, addresses\n- Editing is limited: the core data lives in Identity\n\n### 2.8 System (admin only)\n- Audit log: filters by admin, object and date\n- Failed events: list + \"Resend\"\n- Settings: pickup address and opening hours, delivery price, reservation TTL, low-stock threshold\n\n## 3. Roles and permissions\n\n| Action | admin | manager | content_editor | warehouse |\n|---|:-:|:-:|:-:|:-:|\n| Dashboard | ✅ | ✅ | ✅ | ✅ |\n| View orders | ✅ | ✅ | ❌ | ✅ |\n| Change status | ✅ | ✅ | ❌ | ✅ (PROCESSING → READY / SHIPPED) |\n| Cancel | ✅ | ✅ | ❌ | ❌ |\n| Refund | ✅ | ❌ | ❌ | ❌ |\n| Products / categories / compatibility | ✅ | 👁 | ✅ | 👁 |\n| Change price | ✅ | ✅ | ✅ | ❌ |\n| Stock movements | ✅ | ❌ | ❌ | ✅ |\n| Customers | ✅ | ✅ | ❌ | ❌ |\n| Import | ✅ | ❌ | ❌ | ❌ |\n| Audit log, system, settings | ✅ | ❌ | ❌ | ❌ |\n\n👁 = view only\n\n- Roles come from the `roles` claim of the Identity token.\n- **Checks are enforced in Nest** (`@Roles()` + `RolesGuard`). The Admin UI only hides buttons — that is not a security mechanism.\n- Every action that changes data → `admin_audit_log` (automatically, via a Nest interceptor).\n","09-repo-and-dev":"# 09 — Repo structure and development\n\n## 1. Repositories\n\nThe code is split into **three separate repos**, as in the company's other projects (e.g. ev-charger-admin). Each has its own Dockerfile, CI and deploy.\n\n| Repo | What it is | usectl apps |\n|---|---|---|\n| `icomers-api` | NestJS: REST API, worker, migrations | `api`, `worker`, `migrate` |\n| `icomers-storefront` | Next.js: public site | `storefront` |\n| `icomers-admin` | Next.js: Admin Panel | `admin` |\n\nThe documentation (this folder) is kept separately; once approved, the code repos will reference it.\n\n### `icomers-api`\n```\nicomers-api/\n├─ src/\n│  ├─ modules/            # catalog, cart, orders, payments, … (see architecture)\n│  ├─ infra/              # prisma, nats, outbox, grpc, storage\n│  ├─ contracts/          # NATS event schemas (zod)\n│  ├─ main.ts             # HTTP API\n│  └─ worker.ts           # Worker\n├─ proto/                 # .proto contracts of company services + generated code\n├─ prisma/\n│  ├─ schema.prisma\n│  ├─ migrations/\n│  └─ seed.ts             # test catalog, brands, models\n├─ dev/                   # NATS setup, Billing / Fiscal / Identity mocks\n├─ openapi.json           # API description (updated by CI); the frontends generate their client from it\n├─ docker-compose.yml     # local infrastructure\n├─ Dockerfile\n└─ .env.example\n```\n\n### `icomers-storefront` and `icomers-admin`\n```\nicomers-storefront/\n├─ src/\n│  ├─ app/                # Next.js pages\n│  ├─ components/\n│  ├─ api/schema.ts       # API types, generated from openapi.json\n│  └─ messages/           # ka.json, en.json\n├─ Dockerfile\n└─ .env.example\n```\nThe admin has the same structure.\n\n### How the frontend gets the API types\nThe `icomers-api` CI updates `openapi.json` on every change. In the frontend repo, a single command generates the types:\n```bash\npnpm api:generate   # openapi-typescript <openapi.json of the api> -o src/api/schema.ts\n```\nThe source can be the local API (`http://localhost:4000/docs-json`) or staging. If something changes in the backend, after the types are updated TypeScript shows every mismatching place in the frontend.\n\n## 2. Local environment\n\nThe `docker-compose.yml` in `icomers-api` runs the infrastructure. The apps run locally with `pnpm dev`, each in its own repo:\n\n| Service | Image | Port |\n|---|---|---|\n| postgres | `postgres:16` | 5432 |\n| nats | `nats:2` (with `-js` JetStream) | 4222, 8222 (monitoring) |\n| minio | `minio/minio` (local S3) | 9000, 9001 (console) |\n| mailpit | `axllent/mailpit` (email testing) | 1025, 8025 |\n| identity | Keycloak or your Identity dev instance | 8080 |\n\n### Mocks\nUntil we have access to dev instances of the existing services:\n- `PAYMENT_GATEWAY=mock`: `CreatePayment` returns a local \"bank\" page (`/dev/fake-bank`) whose \"Pay\" / \"Decline\" buttons publish a `billing.payment.*` event to NATS\n- `FISCAL_GATEWAY=mock`: returns a fake receipt number\n- Identity: a local Keycloak realm (`dev/keycloak/realm.json`) with the same roles\n\n### Commands\n```bash\n# icomers-api\ndocker compose up -d\ncp .env.example .env\npnpm install\npnpm prisma migrate dev\npnpm prisma db seed\npnpm dev            # api :4000\npnpm dev:worker     # worker\n\n# icomers-storefront / icomers-admin\npnpm install\npnpm dev            # storefront :3000 / admin :3001\n```\n\n## 3. Configuration and code rules\n\n<details>\n<summary>Environment variables</summary>\n\n| Variable | Example |\n|---|---|\n| `DATABASE_URL` | `postgresql://icomers:icomers@localhost:5432/icomers` |\n| `NATS_URL` | `nats://localhost:4222` |\n| `OIDC_ISSUER` | `https://id.example.ge/realms/main` |\n| `OIDC_AUDIENCE` | `icomers-api` |\n| `GRPC_BILLING_URL` / `GRPC_FISCAL_URL` / `GRPC_IDENTITY_URL` | `billing:50051` |\n| `PAYMENT_GATEWAY` / `FISCAL_GATEWAY` | `grpc` / `mock` |\n| `S3_ENDPOINT`, `S3_BUCKET`, `S3_ACCESS_KEY`, `S3_SECRET_KEY`, `S3_PUBLIC_URL` | |\n| `RESERVATION_TTL_MINUTES` | `15` |\n| `STOREFRONT_URL`, `STOREFRONT_REVALIDATE_SECRET` | |\n| `CORS_ORIGINS` | `http://localhost:3000,http://localhost:3001` |\n| `LOG_LEVEL` | `info` |\n\nFor the Next.js apps: `API_URL`, `OIDC_ISSUER`, `OIDC_CLIENT_ID`, `OIDC_CLIENT_SECRET`, `SESSION_SECRET`, `NEXT_PUBLIC_SITE_URL`, `REVALIDATE_SECRET`.\n\nConfig is validated at startup (zod / `@nestjs/config`). If the config is invalid, the app does not start.\n\n</details>\n\n<details>\n<summary>Code rules</summary>\n\n- TypeScript `strict: true`\n- ESLint + Prettier, `lint-staged` + `husky` pre-commit\n- Conventional Commits (`feat:`, `fix:`, `docs:`...)\n- Business logic lives in services; controllers are thin\n- Every DTO is described with `@nestjs/swagger` decorators so the OpenAPI spec is complete\n- Money is stored only as `*_minor` integers; formatting is done by a single helper function\n\n</details>\n\n## 4. Tests\n\n| Level | Tool | What we test |\n|---|---|---|\n| Unit | Vitest / Jest | price calculation, VAT, state machine, validation |\n| Integration | Jest + **Testcontainers** (Postgres, NATS) | checkout transaction, stock race condition (parallel requests), outbox relay, idempotent consumers |\n| Contract | gRPC mock servers | Billing/Fiscal adapters |\n| E2E | **Playwright** | catalog → cart → checkout → (mock) payment → order PAID; admin: status change |\n\n**Mandatory test:** 10 parallel checkouts on the same last unit → only 1 must succeed.\n\n## 5. CI\n\nEach repo has its own CI:\n\n| Stage | What is checked |\n|---|---|\n| Pull request | lint, typecheck, tests, build. Additionally in `icomers-api`: Prisma schema check and a warning on OpenAPI breaking changes |\n| Merge into `develop` | usectl automatically builds and updates staging |\n| Merge into `main` | production |\n","10-deployment":"# 10 — Deployment (usectl)\n\nThe shop runs on **usectl**. After a push to GitHub, usectl itself builds the image, runs the migrations and updates the apps. The database, NATS, S3, domains and monitoring are all within usectl as well.\n\n## 1. Apps\n\nAll apps live in a single usectl **Machine** (`icomers`). Each app is deployed from its own repo.\n\n| App | Repo | Type (kind) | What it does | Port | Domain |\n|---|---|---|---|---|---|\n| `storefront` | `icomers-storefront` | `web` | public site | 3000 | `shop.<domain>` |\n| `admin` | `icomers-admin` | `web` | Admin Panel | 3001 | `admin.<domain>` |\n| `api` | `icomers-api` | `web` | REST API + SSE | 4000 | `api.<domain>` |\n| `worker` | `icomers-api` | `worker` | NATS events, outbox, receipts, cron | — | — (`--private`) |\n| `migrate` | `icomers-api` | `release` | `prisma migrate deploy`, before every deploy | — | — |\n\n- The **`release`** app runs on every deploy **before the web apps are updated**. So new code always works against an already-updated database.\n- **`worker`** has no HTTP traffic and needs no domain.\n- Deploy is automatic on GitHub push (`--auto-deploy`). Manually: `usectl machines deploy icomers`.\n\n## 2. Dockerfiles\n\nEach repo has its own `Dockerfile` in its root, and usectl uses it automatically.\n\n| Repo | Image | usectl apps |\n|---|---|---|\n| `icomers-storefront` | Next.js `standalone` build | `storefront` |\n| `icomers-admin` | Next.js `standalone` build | `admin` |\n| `icomers-api` | NestJS build + Prisma | `api` (default command), `worker` (`--command \"node dist/worker.js\"`), `migrate` (`--command \"npx prisma migrate deploy\"`) |\n\nThe memory limit per pod is at most 1 GiB, which is enough for these apps.\n\n<details>\n<summary>Initial version of the Dockerfiles</summary>\n\n`icomers-api`:\n```dockerfile\nFROM node:24-alpine AS build\nRUN corepack enable\nWORKDIR /app\nCOPY package.json pnpm-lock.yaml ./\nRUN pnpm install --frozen-
