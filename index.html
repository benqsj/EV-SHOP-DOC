<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>icomers — დოკუმენტაცია</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>:root {
  --bg: #f7f8fa; --surface: #ffffff; --surface-2: #f1f3f6; --border: #e3e6eb;
  --text: #1b1f27; --muted: #5f6878; --accent: #0f7b5f; --accent-2: #e6f4ef;
  --warn: #b25e09; --warn-bg: #fff4e5; --ok: #1a7f37; --ok-bg: #e7f6ec;
  --code-bg: #f3f4f6; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --sidebar-w: 290px; --topbar-h: 58px;
  --font: "Noto Sans Georgian", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216; --surface: #161a20; --surface-2: #1d222a; --border: #2a313b;
    --text: #e6e9ee; --muted: #9aa4b2; --accent: #3ccf9f; --accent-2: #12302a;
    --warn: #f0a24b; --warn-bg: #33240f; --ok: #56d37a; --ok-bg: #12301d;
    --code-bg: #1d222a; --shadow: none;
  }
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--topbar-h) + 16px); }
body { margin: 0; font-family: var(--font); font-size: 15.5px; line-height: 1.7; color: var(--text); background: var(--bg); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* topbar */
.topbar { position: fixed; inset: 0 0 auto 0; height: var(--topbar-h); z-index: 30; display: flex; align-items: center; gap: 14px;
  padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
.brand { font-weight: 700; font-size: 17px; color: var(--text); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.brand:hover { text-decoration: none; }
.brand-mark { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 15px; }
.brand-sub { font-weight: 400; color: var(--muted); font-size: 14px; }
.status-pill { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); font-weight: 600; white-space: nowrap; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 18px; }
.progress { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; white-space: nowrap; }
.progress-bar { width: 110px; height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.progress-bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; }
.me { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.me input { width: 190px; }
.menu-btn { display: none; border: 0; background: none; font-size: 22px; color: var(--text); cursor: pointer; }

input, textarea { font: inherit; font-size: 14px; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; }
input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }

/* layout */
.layout { padding-top: var(--topbar-h); }
.sidebar { position: fixed; top: var(--topbar-h); bottom: 0; left: 0; width: var(--sidebar-w); overflow-y: auto; padding: 16px 12px 24px;
  background: var(--surface); border-right: 1px solid var(--border); z-index: 20; }
.content { margin-left: var(--sidebar-w); padding: 36px 56px 120px; max-width: calc(var(--sidebar-w) + 1000px); }
.nav-filter { width: 100%; margin-bottom: 12px; }
.nav-group { margin: 14px 0 4px; padding: 0 10px; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.nav-doc > a { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 7px; color: var(--text); font-weight: 500; font-size: 14.5px; }
.nav-doc > a:hover { background: var(--surface-2); text-decoration: none; }
.nav-doc.active > a { background: var(--accent-2); color: var(--accent); }
.nav-sub { list-style: none; margin: 2px 0 6px 12px; padding: 0 0 0 10px; border-left: 1px solid var(--border); display: none; }
.nav-doc.active .nav-sub, .sidebar.filtering .nav-sub { display: block; }
.nav-sub a { display: block; padding: 3px 8px; font-size: 13.5px; color: var(--muted); border-radius: 6px; line-height: 1.45; }
.nav-sub a:hover { color: var(--text); text-decoration: none; background: var(--surface-2); }
.nav-sub a.active { color: var(--accent); font-weight: 600; }
.nav-count { font-size: 11px; min-width: 20px; text-align: center; padding: 0 6px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); font-weight: 700; }
.nav-count.done { background: var(--ok-bg); color: var(--ok); }
.hidden { display: none !important; }
.link-btn { font: inherit; font-size: 13px; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.link-btn:hover { text-decoration: underline; }
.foot-note { font-size: 12px; color: var(--muted); line-height: 1.45; }
.doc details { margin: 14px 0; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 0 14px; max-width: 900px; }
.doc details[open] { padding-bottom: 8px; }
.doc summary { cursor: pointer; padding: 10px 0; font-weight: 600; font-size: 14px; color: var(--muted); }
.doc summary:hover { color: var(--text); }
.mode-banner { margin-top: 12px; font-size: 13.5px; color: var(--warn); background: var(--warn-bg); border-radius: 8px; padding: 8px 12px; max-width: 860px; }
.sidebar-foot { margin-top: 22px; padding: 12px 10px 0; border-top: 1px solid var(--border); display: grid; gap: 6px; font-size: 13px; }

/* content */
.intro { padding-bottom: 8px; }
.intro h1 { font-size: 30px; line-height: 1.25; margin: 0 0 10px; }
.intro p { color: var(--muted); max-width: 760px; }
.howto { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; font-size: 14.5px; max-width: 860px; }
.doc { padding-top: 34px; margin-top: 34px; border-top: 1px solid var(--border); }
.doc-group { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.doc h1 { font-size: 27px; margin: 2px 0 16px; line-height: 1.3; }
.doc h2 { font-size: 21px; margin: 38px 0 12px; line-height: 1.35; }
.doc h3 { font-size: 17px; margin: 28px 0 8px; }
.doc h4 { font-size: 15.5px; margin: 20px 0 6px; }
.doc h1 a.anchor, .doc h2 a.anchor, .doc h3 a.anchor { opacity: 0; margin-left: 6px; font-weight: 400; }
.doc h1:hover a.anchor, .doc h2:hover a.anchor, .doc h3:hover a.anchor { opacity: .6; }
.doc p, .doc li { max-width: 860px; }
.doc code { font-family: var(--mono); font-size: .86em; background: var(--code-bg); padding: 1px 5px; border-radius: 5px; }
.doc pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; overflow-x: auto; line-height: 1.5; }
.doc pre code { background: none; padding: 0; font-size: 13px; overflow-wrap: normal; }
.doc p code, .doc li code, .q-text code { overflow-wrap: anywhere; }
.doc blockquote { margin: 16px 0; padding: 10px 16px; border-left: 3px solid var(--accent); background: var(--surface); border-radius: 0 10px 10px 0; color: var(--text); }
.doc blockquote p { margin: 4px 0; }
.table-wrap { overflow-x: auto; margin: 14px 0; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.doc table { border-collapse: collapse; width: 100%; font-size: 14px; }
.doc th, .doc td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
.doc th { background: var(--surface-2); font-weight: 600; white-space: nowrap; }
.doc tr:last-child td { border-bottom: 0; }
figure.diagram { margin: 18px 0 22px; padding: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow-x: auto; }
figure.diagram svg { display: block; width: 100%; height: auto; min-width: 640px; max-width: 100%; margin: 0 auto; }
figure.diagram figcaption { margin-top: 10px; text-align: center; font-size: 13px; color: var(--muted); }
:root { --d-bg: var(--surface); --d-text: var(--text); --d-muted: var(--muted); --d-edge: #4b5563; --d-grp: #f8fafc; --d-grp-s: #cbd5e1; --d-band: #f1f5f9; }
@media (prefers-color-scheme: dark) {
  :root { --d-edge: #9aa4b2; --d-grp: #12161b; --d-grp-s: #364150; --d-band: #1b2128;
    --d-ours: #10302a; --d-ours-s: #3ccf9f; --d-ext: #1d1f3d; --d-ext-s: #8b8ff0; --d-data: #33260f; --d-data-s: #e0a64b;
    --d-actor: #20252c; --d-actor-s: #6b7685; --d-final: #12301d; --d-final-s: #56d37a; --d-bad: #3a1a12; --d-bad-s: #f08a5d; }
}

/* question cards */
.q { margin: 18px 0; border: 1px solid var(--border); border-left: 4px solid var(--warn); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); max-width: 900px; }
.q.answered { border-left-color: var(--ok); }
.q-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 16px 0; font-size: 12.5px; color: var(--muted); }
.q-chip { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 9px; border-radius: 999px; }
.q-chip.open { background: var(--warn-bg); color: var(--warn); }
.q-chip.done { background: var(--ok-bg); color: var(--ok); }
.q-id { font-family: var(--mono); font-size: 12px; }
.q-to { margin-left: auto; }
.q-text { padding: 4px 16px 4px; font-weight: 500; }
.q-text p { margin: 6px 0; }
.q-answers { padding: 0 16px; }
.q-answer { border-top: 1px dashed var(--border); padding: 10px 0; }
.q-answer-meta { font-size: 12.5px; color: var(--muted); }
.q-answer-meta b { color: var(--text); }
.q-answer-text { white-space: pre-wrap; margin-top: 2px; }
.q-form { display: grid; gap: 8px; padding: 12px 16px 14px; border-top: 1px solid var(--border); background: var(--surface-2); border-radius: 0 0 12px 12px; }
.q-form textarea { width: 100%; min-height: 64px; resize: vertical; }
.q-form-row { display: flex; align-items: center; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.q-form-hint { font-size: 12.5px; color: var(--muted); }
button.primary { font: inherit; font-size: 14px; font-weight: 600; border: 0; border-radius: 8px; padding: 7px 16px; background: var(--accent); color: #fff; cursor: pointer; }
button.primary:disabled { opacity: .55; cursor: default; }

/* additions (+ დამატება) */
:root { --add: #7c3aed; --add-bg: #f5f0ff; --add-border: #ddd0fb; }
@media (prefers-color-scheme: dark) { :root { --add: #b794f6; --add-bg: #221a33; --add-border: #3e2f5c; } }
.add-block { margin: 10px 0 6px; max-width: 900px; }
.add-btn { font: inherit; font-size: 13px; font-weight: 600; color: var(--add); background: none; border: 1px dashed var(--add-border); border-radius: 8px; padding: 4px 12px; cursor: pointer; opacity: .75; }
.add-btn:hover { opacity: 1; background: var(--add-bg); }
.addition { margin: 10px 0; padding: 10px 14px; background: var(--add-bg); border: 1px solid var(--add-border); border-left: 4px solid var(--add); border-radius: 10px; }
.addition-meta { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.addition-meta b { color: var(--text); }
.addition-tag { font-size: 11px; font-weight: 700; color: #fff; background: var(--add); padding: 1px 8px; border-radius: 999px; }
.addition-text { white-space: pre-wrap; margin-top: 4px; }
.add-form { display: grid; gap: 8px; margin-top: 8px; padding: 12px 14px; background: var(--add-bg); border: 1px solid var(--add-border); border-radius: 10px; }
.add-form-title { font-size: 13px; color: var(--muted); }
.add-form textarea { width: 100%; min-height: 80px; resize: vertical; }
.add-form .primary { background: var(--add); }
button.ghost { font: inherit; font-size: 14px; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; padding: 6px 14px; cursor: pointer; }
.nav-badges { display: flex; gap: 4px; }
.nav-adds { font-size: 11px; padding: 0 6px; border-radius: 999px; background: var(--add-bg); color: var(--add); font-weight: 700; }

.edit-btn { font: inherit; font-size: 12px; color: var(--muted); background: none; border: 0; padding: 0 0 0 6px; cursor: pointer; text-decoration: underline dotted; }
.edit-btn:hover { color: var(--text); }
.edited { font-style: italic; }
.edit-form { display: grid; gap: 8px; margin-top: 6px; }
.edit-form textarea { width: 100%; min-height: 70px; resize: vertical; }
.edit-actions { display: flex; justify-content: flex-end; gap: 6px; }
.addition .edit-form .primary { background: var(--add); }

/* question index */
.q-index-tools { display: flex; gap: 14px; align-items: center; font-size: 14px; margin: 8px 0; }
.q-index td:first-child { white-space: nowrap; }

.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
  background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 14px; transition: .25s; z-index: 50; }
.toast.show { opacity: 1; transform: translateX(-50%); }
.loading { color: var(--muted); }

@media (max-width: 1100px) { .brand-sub, .me span { display: none; } .content { padding: 28px 32px 100px; } }
@media (max-width: 520px) { .progress { display: none; } }
@media (max-width: 820px) {
  .menu-btn { display: block; }
  .status-pill, .progress-bar { display: none; }
  .sidebar { transform: translateX(-100%); transition: transform .2s; width: min(86vw, 320px); box-shadow: var(--shadow); }
  .sidebar.open { transform: none; }
  .content { margin-left: 0; padding: 20px 16px 90px; }
  .topbar { padding: 0 12px; gap: 10px; }
  .me input { width: 120px; }
  .topbar-right { gap: 10px; }
  .brand-mark + * { }
  .intro h1 { font-size: 24px; }
  .q-to { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="მენიუ">☰</button>
    <a class="brand" href="#top"><span class="brand-mark">⚡</span> icomers <span class="brand-sub">ტექნიკური დოკუმენტაცია</span></a>
    <span class="status-pill">დასამტკიცებელი</span>
    <div class="topbar-right">
      <a class="progress" href="#12-roadmap--ღია-კითხვები" id="progress" title="ღია კითხვები">
        <span class="progress-bar"><span id="progressFill"></span></span>
        <span id="progressText">…</span>
      </a>
      <label class="me">
        <span>თქვენი სახელი</span>
        <input id="authorInput" placeholder="მაგ. გიორგი (Billing)" maxlength="80">
      </label>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="სარჩევი">
      <input class="nav-filter" id="navFilter" type="search" placeholder="ძებნა სარჩევში…">
      <div id="nav"></div>
      <div class="sidebar-foot">
        <button type="button" class="link-btn" id="downloadBtn">⬇ პასუხების და დამატებების ჩამოტვირთვა</button>
        <span class="foot-note" id="modeNote"></span>
      </div>
    </nav>
    <main class="content" id="top">
      <section class="intro">
        <h1>icomers — ონლაინ მაღაზია</h1>
        <p>კომპანიის საკუთარი პროდუქციის (EV დამტენების ნაწილები და აქსესუარები) ონლაინ მაღაზიის არქიტექტურა და ტექნიკური დოკუმენტაცია: backend, frontend, admin panel, API, ინტეგრაციები და deploy.</p>
      </section>
      <div id="docs"><p class="loading">იტვირთება…</p></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
